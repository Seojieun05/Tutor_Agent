[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor"
version = "0.1.0"
description = "Visual Socratic Tutor - voice math tutor server (XIAO ESP32S3 Sense camera/mic + Grok)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "openai>=1.40",
    "httpx>=0.27",
    "sympy>=1.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
sim = ["pillow>=10"]
mic = ["sounddevice>=0.4"]
# hands-free laptop mic device (simulator/voice_device.py): Silero VAD + capture
voice = ["sounddevice>=0.4", "silero-vad>=5.1"]

[tool.setuptools.packages.find]
include = ["tutor*", "simulator*"]

[tool.setuptools.package-data]
"tutor.knowledge" = ["seeds/*.json", "seeds/**/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
