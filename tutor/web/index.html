<!doctype html>
<!--
  Hands-free browser client for the Visual Socratic Tutor.

  The laptop only captures and plays; the VAD, STT, tutor pipeline and TTS all
  run on the server (that is the point of this page: over SSH the server has no
  microphone and nobody is listening to its speaker).

    IN:  getUserMedia → AudioWorklet → float32 @16 kHz → int16 → 512-sample
         frames → binary AUDIO frames on ONE WebSocket (the same framing the
         camera device uses, so the server code is unchanged)
    OUT: turn_state / transcript / tutor_says / problem events + TTS_AUDIO
         frames with the tutor's speech → <audio> → "playback_done" back

  Barge-in: the mic stays open while the tutor speaks so the student can cut
  in. What keeps the tutor from hearing itself is echoCancellation in
  getUserMedia, plus a higher onset bar on the server for those frames. The mic
  still shuts during PROCESSING: there is nothing to interrupt while it thinks,
  and a half-turn must not survive into the answer.

  Chrome/Edge recommended (AudioWorklet at a 16 kHz AudioContext).

  DESIGN. One scene: the MEDITERRANEAN, from inside. The page is deep, clear
  cobalt water — sunlight falling from a surface just out of sight, a slow
  caustic shimmer, a few motes and bubbles, a reef asleep at the bottom — and
  the two working surfaces float in it: the BOARD, a sheet of glass the lesson
  is written on, and the CONVERSATION, a bright submarine window on the right.
  The board is deliberately of the water (translucent navy, cyan rim) and the
  chat is deliberately not (warm daylight glass in the #b5e48c→#1e6091 family):
  the lesson lives in the sea, the talk happens at the porthole. One committed
  look, no schemes: the depth IS the dark and the panel IS the light.

  Nothing decorative may cost the pipeline anything. Every ambient motion is
  transform/opacity on its own layer, blur exists only on the static reef
  silhouette, and there is no backdrop-filter anywhere: this machine is also
  running a VAD, an STT call and TTS.

  THE TUTOR IS A PUFFERFISH, and it replaces the spinner. It is one inline SVG
  (no asset to load, recolorable, and its eyes can actually look at things) on
  a fixed layer, flown between two homes: the conversation's header, where it
  lives, and the board's margin, where it goes to read. The waiting is
  narrated by its body:

    hears you finish  → it puffs up round and spiky ("어? 질문했구나!")
    thinking          → it swims over to the problem and READS it — eyes
                        tracking title → equation → work, a slow ∞ drift,
                        a few faint math glyphs rising off it
    answer ready      → it freezes, eyes wide, hops, puffs once ("아!") and
                        darts home — and only then does the answer speak
    fillers, 맞아요    → spoken from wherever it already is; it does not
                        shuttle for lines that are not the turn's last word

  The server labels that last word (`final` on tutor_says); everything else
  about which line is which stays server-side. The page HOLDS the final line's
  text and audio while the fish returns — bounded by a hard 1.9 s timer, so a
  lost flight can never keep an answer from a student.

  The state of the turn is written in the conversation's header as a live
  status line ("풀이를 살펴보는 중...") whose dots breathe one at a time up to
  three and back — progress lives there now, not as bubbles inside the chat.

  MATH: the server sends one normalized display vocabulary (x², ·, √, log₃,
  1/5 — see tutor/speech/mathspeak.py displayable()). This page converts that
  small alphabet to TeX and typesets it with KaTeX. If the KaTeX CDN cannot be
  reached, everything falls back to the plain unicode text.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생선님 · Visual Socratic Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
  /* ===================================================================
     TOKENS. Four of the colour names are also the server's contract:
     tutor/hints/plot.py writes var(--accent-deep), var(--err), var(--dim)
     and var(--line) into the figures it draws, and those figures land on
     the BOARD — so at :root the four are inks for deep water. The chat
     panel is a different climate and re-declares them inside its own
     scope, which is exactly what custom properties are for.
     =================================================================== */
  :root {
    /* the water column, surface light to floor */
    --sea-0:#1a86b8; --sea-1:#0f5f92; --sea-2:#093f6c; --sea-3:#041e3d;
    /* ink on the open water (header, chrome) */
    --page-ink:#e9f6fd; --page-dim:#a5cde4;
    /* THE BOARD: glass in the sea. Text was picked against the panel it
       actually sits on (rgba navy over the gradient ≈ #0b3a5f). */
    --board-bg-hi:rgba(10,49,82,.68); --board-bg-lo:rgba(6,35,60,.74);
    --board-rim:rgba(139,224,255,.20);
    --text:#ecf7ff;                /* board ink: 12.9:1 */
    --text-mid:#c8e3f5;
    /* the server's four, tuned as board inks */
    --dim:#a9cee6;                 /* axes, ticks, captions: 7.4:1 */
    --line:rgba(148,205,235,.17);  /* hairlines and the figure's grid */
    --accent-deep:#6fdcf5;         /* the curve's own stroke, and cyan ink */
    --err:#ff9e8c;                 /* the wrong thing, softly */
    --accent-soft:rgba(111,220,245,.14);
    --accent-line:rgba(111,220,245,.38);
    /* THE CHAT: daylight glass, in the given family
       #b5e48c #99d98c #76c893 #52b69a #34a0a4 #168aad #1a759f #1e6091 */
    --c-bg-0:#f3fbf2; --c-bg-1:#e2f3ec; --c-bg-2:#d5eeea;
    --c-line:rgba(26,117,159,.16);
    --c-text:#143c4e; --c-mid:#1e6091; --c-dim:#48707d;
    --c-solid:#ffffff;
    --c-fill:#1a759f; --c-fill-lit:#1e6091;   /* the student's bubble, ≥4.9:1 under white */
    --c-err:#a8503f; --c-err-soft:#fbe9e3;
    /* THE THREE STATES, one hue each, legible from across a desk. Declared
       on :root because the chip, the orb and the header all use them and
       all sit on the light panel. */
    --hear-ink:#0f6d8a; --hear-soft:#d9f0f5;
    --think-ink:#8a5a12; --think-soft:#f7ecd7;
    --talk-ink:#a8503f; --talk-soft:#fbe7e0;
    /* radius is a hierarchy, not a habit */
    --r-panel:24px; --r-card:16px; --r-bubble:14px; --r-btn:12px; --r-chip:999px;
    /* shadows are the deep's own blue, never black */
    --sink:2 16 30;
    --shadow-soft:0 4px 12px rgb(var(--sink) / .30), 0 18px 44px rgb(var(--sink) / .38);
    --lip:inset 0 1px 0 rgba(212,242,255,.14);
    --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
           "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --math:"STIX Two Math", "Cambria Math", "Times New Roman", serif;
    /* the pufferfish's own box (the SVG is 200×176) */
    --pf:78px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  /* Typeset maths does not wrap: a formula is laid out as one run with no
     break opportunity in it. The box that scrolls has to be OURS — `.katex`
     computes to display:inline, and neither max-width nor overflow applies
     to a non-replaced inline box, so every math run gets this wrapper in
     mathify(). vertical-align:bottom because an inline-block with overflow
     aligns on its bottom margin edge. */
  .mathrun {
    display:inline-block; max-width:100%; vertical-align:bottom;
    overflow-x:auto; overflow-y:hidden;
    /* KaTeX widths are fractional em; scrollWidth rounds up, clientWidth
       down, and on Windows the resulting phantom overflow drew a full
       arrow scrollbar under a two-glyph a_n. The padding absorbs the
       rounding; a genuinely long formula still overflows past it. */
    padding-right:2px; scrollbar-width:thin;
  }
  body {
    margin:0; min-height:100dvh; display:flex; flex-direction:column;
    color:var(--page-ink); font:15px/1.6 var(--font);
    background:linear-gradient(180deg, var(--sea-0) 0%, var(--sea-1) 32%,
               var(--sea-2) 64%, var(--sea-3) 100%);
    background-attachment:fixed;
  }
  .visually-hidden {
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  /* ===================================================================
     THE SCENE. Layers of one sea, back to front: sunlight, caustics,
     motes and bubbles, a shoal in the middle distance, and the reef
     asleep at the bottom — the only blurred thing here, and static.
     Nothing in the scene may compete with a line of mathematics.
     =================================================================== */
  .scene { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  /* light from a surface just above the top edge */
  .scene .glow {
    position:absolute; inset:0;
    background:radial-gradient(64% 36% at 50% -8%, rgba(163,235,255,.30), transparent 72%);
  }
  /* two shafts of it, falling steeply — barely there, and very slow */
  .scene .rays {
    position:absolute; inset:-6%;
    background:
      linear-gradient(104deg, transparent 26%, rgba(180,235,255,.10) 34%,
                      transparent 44%, rgba(180,235,255,.07) 58%, transparent 68%);
  }
  /* the wobble the surface throws on everything below it: two soft lattices
     at different scales sliding past each other read as water moving */
  .scene .caustic {
    position:absolute; inset:-12%; opacity:.16; mix-blend-mode:soft-light;
    background:
      radial-gradient(38% 24% at 20% 30%, rgba(220,245,255,.9), transparent 70%),
      radial-gradient(30% 18% at 62% 16%, rgba(220,245,255,.75), transparent 72%),
      radial-gradient(44% 26% at 84% 44%, rgba(220,245,255,.7), transparent 70%),
      radial-gradient(34% 20% at 40% 62%, rgba(220,245,255,.7), transparent 72%);
    background-size:60% 44%, 44% 34%, 66% 48%, 50% 38%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .scene .rays { animation:sway 46s ease-in-out infinite alternate; }
    .scene .caustic { animation:drift 38s ease-in-out infinite alternate; }
    @keyframes sway {
      0%   { transform:translate3d(-1.5%, 0, 0); }
      100% { transform:translate3d(1.5%, 0, 0); }
    }
    @keyframes drift {
      0%   { transform:translate3d(0,0,0) scale(1); }
      100% { transform:translate3d(3%, 2%, 0) scale(1.08); }
    }
  }

  /* bubbles (few, bright-rimmed) and motes (many, faint): both rise, on very
     different clocks. Under reduced motion they hang where they are — still,
     not gone, because they are part of the middle distance either way. */
  .bubbles, .motes { position:absolute; inset:0; }
  .bubbles i {
    position:absolute; bottom:-8vh; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(235,250,255,.9),
               rgba(235,250,255,.18) 58%, rgba(235,250,255,.04));
    border:1px solid rgba(220,245,255,.42);
  }
  .motes i {
    position:absolute; bottom:-4vh; border-radius:50%;
    background:rgba(205,240,255,.35);
  }
  @media (prefers-reduced-motion: reduce) {
    .bubbles i, .motes i { bottom:auto; top:24%; opacity:.4; }
    .bubbles i:nth-child(even), .motes i:nth-child(even) { top:56%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bubbles i, .motes i { opacity:0; animation:rise linear infinite; }
    @keyframes rise {
      0%   { transform:translateY(0) scale(.7); opacity:0; }
      14%  { opacity:.7; }
      86%  { opacity:.4; }
      100% { transform:translateY(-118vh) scale(1); opacity:0; }
    }
  }

  /* a few fish, far enough off to be shapes rather than animals */
  .shoal .fish {
    position:absolute; top:var(--y); left:0; width:calc(30px * var(--k));
    height:auto; fill:#cfeeff; opacity:.12; transform:translateX(-12vw);
  }
  @media (prefers-reduced-motion: reduce) {
    .shoal .fish { transform:translateX(var(--park, 22vw)); }
    .shoal .fish:nth-child(even) { --park:64vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .shoal .fish { animation:cross var(--sec) linear var(--lag) infinite; }
    @keyframes cross {
      from { transform:translateX(-12vw); }
      to   { transform:translateX(112vw); }
    }
  }

  /* the reef: a silhouette, out of focus, and the one place blur is allowed —
     it is painted once and never moves */
  #reefSil {
    position:absolute; left:0; bottom:-6px; width:100%; height:auto;
    filter:blur(5px); opacity:.85;
  }

  header, main { position:relative; z-index:1; }

  /* ===================================================================
     TOP BAR. Whose tutor this is, whether it is connected, the way out.
     It sits on open water, so its ink is the page's.
     =================================================================== */
  header {
    flex:none; display:flex; align-items:center; gap:1rem;
    width:100%; max-width:calc(1440px + 3rem); margin:0 auto;
    padding:.85rem 1.5rem .45rem;
  }
  .brand { display:flex; align-items:baseline; gap:.55rem; min-width:0; margin-right:auto; }
  .brand .name {
    font-size:1.12rem; font-weight:800; letter-spacing:-.01em; color:var(--page-ink);
  }
  .brand .sub {
    font-size:.64rem; font-weight:700; color:var(--page-dim);
    letter-spacing:.15em; text-transform:uppercase; white-space:nowrap;
  }
  #conn {
    flex:none; display:inline-flex; align-items:center; gap:.4rem;
    font-size:.74rem; font-weight:700; color:var(--page-dim);
    background:rgba(7,42,70,.55); border:1px solid rgba(148,205,235,.22);
    border-radius:var(--r-chip); padding:.26rem .7rem .26rem .58rem;
  }
  #conn::before {
    content:""; width:.45rem; height:.45rem; border-radius:50%;
    background:currentColor; opacity:.7;
  }
  #conn.ok { color:#8fe9d8; border-color:rgba(143,233,216,.4); }
  #conn.down { color:var(--err); }
  #hangup {
    flex:none; font:700 .74rem var(--font); color:var(--page-dim); cursor:pointer;
    background:transparent; border:1px solid transparent;
    border-radius:var(--r-btn); padding:.3rem .7rem;
    transition:color .18s, background .18s, border-color .18s;
  }
  #hangup[hidden] { display:none; }
  #hangup:hover { color:var(--err); background:rgba(255,158,140,.12); border-color:var(--err); }
  #hangup:active { transform:translateY(1px); }
  #hangup:focus-visible { outline:2px solid var(--err); outline-offset:2px; color:var(--err); }

  /* ===================================================================
     LAYOUT. The board is the lesson, so it takes about three quarters;
     the conversation takes the rest. Siblings in one grid row, same top,
     same bottom.
     =================================================================== */
  main {
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; justify-content:center;
    padding:.35rem 1.5rem 1.15rem;
  }
  .grid {
    width:100%; max-width:1440px; min-height:0;
    display:grid; gap:1.1rem; align-items:stretch;
    grid-template-columns:minmax(0,74fr) minmax(310px,26fr);
  }
  .cardlabel {
    display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.02em;
    color:var(--accent-deep); background:var(--accent-soft);
    border-radius:var(--r-chip); padding:.2rem .7rem;
  }

  /* ===================================================================
     THE BOARD. A pane of glass hanging in the water: translucent navy,
     a whisper of cyan at the rim, the problem as its heading and
     everything the tutor writes below — ONE surface, never a stack of
     cards. The dot grid is a texture, not a feature. No backdrop-filter:
     the translucency alone lets the caustics breathe through it.
     =================================================================== */
  #board {
    position:relative;
    min-height:0; display:flex; flex-direction:column;
    padding:1.1rem 1.5rem 1.3rem;
    background:linear-gradient(180deg, var(--board-bg-hi), var(--board-bg-lo));
    border:1px solid var(--board-rim);
    border-radius:var(--r-panel);
    box-shadow:var(--lip), inset 0 0 46px rgba(2,16,30,.30), var(--shadow-soft);
    background-image:
      radial-gradient(circle, rgba(160,215,245,.09) 1px, transparent 1px),
      linear-gradient(180deg, var(--board-bg-hi), var(--board-bg-lo));
    background-size:26px 26px, 100% 100%;
    background-position:13px 13px, 0 0;
    overflow:hidden;
  }
  #boardHead { flex:none; }
  #boardLines { color-scheme:dark; }   /* the board's own scrollbar, in its own night */

  /* ---- the problem, as the board's own heading ---- */
  #problemCard {
    padding:0 0 .9rem; margin-bottom:.2rem;
    border-bottom:1px solid rgba(139,224,255,.14);
  }
  #problemCard[hidden] { display:none; }
  #problemCard .cardlabel { margin-bottom:.5rem; }
  #problemText {
    font-size:1.06rem; font-weight:700; line-height:1.62; color:var(--text);
    word-break:keep-all;
  }
  #problemEqs {
    margin-top:.5rem; font-family:var(--math); font-size:1.16rem; color:var(--text-mid);
  }
  #problemEqs div { padding:.1rem 0; }

  /* ---- worksheet photo (click / drag / paste); shown only in upload mode ---- */
  #sheet { display:none; }
  #drop[hidden] { display:none; }
  #drop {
    display:flex; align-items:center; gap:.9rem; margin-bottom:.7rem;
    background:rgba(9,44,72,.55); border:1.5px dashed rgba(148,205,235,.32);
    border-radius:var(--r-card); padding:.7rem .9rem;
    color:var(--dim); font-size:.8rem; line-height:1.5; cursor:pointer;
    transition:border-color .18s, color .18s, background .18s;
  }
  #drop:hover, #drop.over { border-color:var(--accent-deep); color:var(--text); }
  #drop:active { transform:translateY(1px); }
  #drop:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  #drop.has {
    border-style:solid; border-color:var(--accent-line);
    background:var(--accent-soft); color:var(--text);
  }
  #drop b { font-weight:800; color:var(--text-mid); }
  #thumb { max-height:2.6rem; border-radius:8px; display:none; }
  #thumb.has { display:block; }
  .meta { font-size:.72rem; color:var(--dim); overflow-wrap:anywhere; }
  #drop > div { min-width:0; }

  /* the writing area, and the fish's reading spot at its right margin —
     a real element, so a resize has something live to measure */
  .writing { position:relative; flex:1 1 auto; min-height:0; display:flex; }
  #boardPerch { position:absolute; right:clamp(34px, 5%, 72px); top:10%; width:0; height:0; }

  #boardLines {
    flex:1 1 auto; min-width:0; overflow-y:auto;
    padding:16px .1rem 0; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
  }
  /* What the tutor deliberately WROTE, one step of the argument: the biggest
     type on the board, with the reason underneath in the margin voice. */
  .boardline {
    padding:.5rem .2rem .8rem; margin:.15rem 0;
    font-size:1.36rem; line-height:1.5; color:var(--text);
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .boardline .katex { font-size:1.3em; }
  .boardline .note {
    margin-top:.28rem; font-size:.78rem; font-weight:700; color:var(--accent-deep);
    letter-spacing:-.01em; word-break:keep-all;
  }
  @media (prefers-reduced-motion: no-preference) {
    /* A line surfaces out of the water's own cyan into the chalk's white —
       the cheapest possible way of saying the sea became the step. */
    .boardline { animation:inked .5s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes inked {
      0%   { opacity:0; transform:translateY(-4px); filter:blur(3px);
             color:var(--accent-deep); }
      100% { opacity:1; transform:none; filter:none; color:var(--text); }
    }

    /* A line in a burst is UNCOVERED left to right, like writing being put
       there. The wipe is mask-position, whose own default — 0%, the solid
       end — is FULLY VISIBLE: if the animation never runs, for any reason,
       the student still reads the step.

       The geometry has to be exact or the mechanism silently half-works. A
       percentage mask-position lines the image's P% up with the box's P%, so
       at 300% the box sees image fractions 0–33% at 0% and 67–100% at 100%.
       Stops at 34% and 66% put the box ENTIRELY inside the solid end at one
       extreme and ENTIRELY inside the clear end at the other. (210% with
       stops at 46/60 never quite finishes uncovering and never quite starts
       covered — a wipe that does not wipe.) */
    .boardline.laying, .boardfigure.laying {
      animation:inked 0s both, laydown var(--lay, .46s) cubic-bezier(.3,.6,.35,1) both;
      -webkit-mask-image:linear-gradient(90deg, #000 0 34%, transparent 66%);
              mask-image:linear-gradient(90deg, #000 0 34%, transparent 66%);
      -webkit-mask-size:300% 100%;   mask-size:300% 100%;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    }
    /* the mask comes OFF when it is done: a board holding a lesson's worth
       of steps should not keep every one on its own composited layer */
    .boardline.dry, .boardfigure.dry {
      -webkit-mask-image:none; mask-image:none;
    }
    @keyframes laydown {
      from { -webkit-mask-position:100% 0; mask-position:100% 0; }
      to   { -webkit-mask-position:0% 0;   mask-position:0% 0; }
    }
  }

  /* a function sketched on the board: axes, a light grid, the curve */
  .boardfigure {
    position:relative; padding:.4rem 0 .2rem;
    overflow:hidden;                 /* the drag preview stops at its frame */
    /* A sideways finger pans the GRAPH; an up-down finger still scrolls the
       BOARD, which is taller than the screen exactly when it has a figure. */
    touch-action:pan-y;
    cursor:grab;
  }
  .boardfigure:active { cursor:grabbing; }
  .boardfigure:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  .figzoom {
    position:absolute; top:.55rem; right:.15rem; z-index:1;
    display:flex; gap:.3rem; opacity:.55; transition:opacity .18s;
  }
  .boardfigure:hover .figzoom, .figzoom:focus-within { opacity:1; }
  .figzoom button {
    width:1.7rem; height:1.7rem; display:grid; place-items:center;
    font:700 1.05rem var(--font); line-height:1;
    color:var(--text-mid); background:rgba(9,44,72,.9);
    border:1px solid rgba(148,205,235,.28); border-radius:var(--r-btn);
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .figzoom button:hover { color:var(--accent-deep); border-color:var(--accent-line); }
  .figzoom button:active { transform:translateY(1px); }
  .figzoom button:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference) {
    .boardfigure { transition:opacity .18s ease; }
    .boardfigure.fading { opacity:.15; }
  }
  .boardfigure svg { display:block; width:100%; height:auto; }
  .boardfigure .grid line { stroke:var(--line); stroke-width:1; }
  .boardfigure .axes line { stroke:var(--dim); stroke-width:1.4; }
  .boardfigure .ticks text { fill:var(--dim); font-size:10px; font-family:var(--font); }
  .boardfigure .legend { font-size:12px; font-family:var(--math); }
  .boardfigure .point-label { font:800 15px var(--math); }
  .boardfigure .note {
    margin-top:.15rem; text-align:center; font-size:.78rem; font-weight:700;
    color:var(--accent-deep); word-break:keep-all;
  }

  /* Empty state: a note pinned to the top of the board saying the tutor is
     ready — not a message floating in the middle of nothing. */
  #boardEmpty {
    max-width:30rem; margin:.2rem 0 0 .1rem; position:relative;
    background:rgba(10,52,84,.66); border:1px solid rgba(139,224,255,.18);
    border-radius:var(--r-card); border-top-left-radius:6px;
    padding:.85rem 1.1rem;
    color:var(--dim); font-size:.88rem; line-height:1.65;
  }
  #boardEmpty b {
    display:block; font-size:1.02rem; font-weight:800; color:var(--text);
    margin-bottom:.15rem;
  }

  /* ===================================================================
     THE CONVERSATION. A porthole of daylight: the panel is BRIGHT — the
     one bright thing on the page — in the green-teal family, glass only
     by suggestion (a white rim, a lit top edge; no frosting). Its header
     carries the tutor's nest and the live status line; the voice
     controls are pinned at its foot, next to the words they produce.
     =================================================================== */
  #chatPanel {
    /* the server's four names, re-tuned for daylight, so anything inside
       the panel that speaks the shared vocabulary stays readable here */
    --line:var(--c-line); --dim:var(--c-dim);
    --accent-deep:#0f6d8a; --err:var(--c-err);
    --accent-soft:#dff0e8; --accent-line:#8fd0c4;
    min-height:0; display:flex; flex-direction:column; overflow:hidden;
    padding:0; color:var(--c-text);
    background:linear-gradient(180deg, var(--c-bg-0), var(--c-bg-1) 52%, var(--c-bg-2));
    border:1px solid rgba(255,255,255,.75);
    border-radius:var(--r-panel);
    box-shadow:inset 0 1px 0 #ffffff, var(--shadow-soft);
  }
  .chathead {
    flex:none; display:flex; align-items:center; gap:.7rem;
    padding:.7rem 1rem; border-bottom:1px solid var(--c-line);
    background:linear-gradient(180deg, rgba(181,228,140,.28),
               rgba(82,182,154,.12) 68%, transparent);
  }
  /* the nest the fish sits in: an empty socket that reserves the space and
     says where to land — the character itself is on the page-wide layer */
  #pufferHome {
    flex:none; width:calc(var(--pf) * .84); height:calc(var(--pf) * .7);
    border-radius:var(--r-chip);
    background:radial-gradient(60% 42% at 50% 86%, rgba(20,60,78,.16), transparent 70%);
  }
  .chathead .who { min-width:0; margin-right:auto; }
  .chathead .who b { display:block; font-size:.92rem; font-weight:800; color:var(--c-text); }
  /* the status line: what is happening right now, with dots that breathe
     one at a time up to three and back — written by script, read at a
     glance, never a bubble inside the conversation */
  #stageLine {
    display:block; font-size:.74rem; font-weight:600; color:var(--c-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #stageDots { letter-spacing:.08em; }
  #stateChip {
    display:inline-flex; align-items:center; gap:.38rem;
    font-size:.74rem; font-weight:800; letter-spacing:-.01em;
    border-radius:var(--r-chip); padding:.22rem .62rem .22rem .5rem;
    color:var(--c-dim); background:var(--c-solid); border:1px solid var(--c-line);
    transition:color .2s, background .2s, border-color .2s;
  }
  #stateChip .led {
    width:.46rem; height:.46rem; border-radius:50%; background:currentColor;
    flex:none;
  }
  #stateChip[data-state="LISTENING"], #stateChip[data-state="USER_SPEAKING"] {
    color:var(--hear-ink); background:var(--hear-soft); border-color:var(--hear-ink);
  }
  #stateChip[data-state="PROCESSING"] {
    color:var(--think-ink); background:var(--think-soft); border-color:var(--think-ink);
  }
  #stateChip[data-state="AGENT_SPEAKING"] {
    color:var(--talk-ink); background:var(--talk-soft); border-color:var(--talk-ink);
  }
  @media (prefers-reduced-motion: no-preference) {
    /* each state's light behaves differently, legible out of the corner of
       an eye: listening breathes, working blinks, speaking pulses */
    #stateChip[data-state="LISTENING"] .led { animation:breathe 2.4s ease-in-out infinite; }
    #stateChip[data-state="USER_SPEAKING"] .led { animation:breathe 1s ease-in-out infinite; }
    #stateChip[data-state="PROCESSING"] .led { animation:tick 1.1s steps(1) infinite; }
    #stateChip[data-state="AGENT_SPEAKING"] .led { animation:beat .62s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes tick    { 0%,49% { opacity:1; } 50%,100% { opacity:.25; } }
    @keyframes beat    { 0%,100% { transform:scale(.8); } 50% { transform:scale(1.25); } }
  }

  #chat {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:.8rem;
    padding:.9rem .9rem 1rem; scrollbar-width:thin;
  }
  .msg { max-width:94%; display:flex; flex-direction:column; gap:.2rem; }
  .msg .who { font-size:.68rem; font-weight:700; color:var(--c-dim); padding:0 .3rem; }
  .msg .bubble {
    border-radius:var(--r-bubble); padding:.6rem .85rem;
    font-size:.88rem; line-height:1.62;
    white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere;
  }
  /* the tutor speaks in white, the student in the family's deep teal */
  .msg.tutor { align-self:flex-start; }
  .msg.tutor .bubble {
    background:var(--c-solid); border:1px solid rgba(30,96,145,.13); color:var(--c-text);
    border-top-left-radius:5px; box-shadow:0 1px 2px rgba(20,60,78,.06);
  }
  .msg.you { align-self:flex-end; align-items:flex-end; }
  .msg.you .bubble {
    background:linear-gradient(158deg, var(--c-fill), var(--c-fill-lit));
    border:1px solid var(--c-fill-lit); color:#fff;
    border-top-right-radius:5px; box-shadow:0 2px 8px rgba(20,60,78,.20);
  }
  /* the line being revealed carries a caret, so a pause mid-sentence reads
     as "still coming" rather than as the end of the answer */
  .msg.typing .bubble::after {
    content:""; display:inline-block; vertical-align:-2px;
    width:.5em; height:1.05em; margin-left:.06em; border-radius:1px;
    background:var(--accent-deep); opacity:.55;
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg.typing .bubble::after { animation:caret .9s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity:.55; } 50%,100% { opacity:0; } }
  }
  /* The turn is still talking: dots at the bubble's end, lighting one at a
     time and resetting together. The whole turn is ONE bubble — the filler
     opens it, every later line appends — and this is its pulse. */
  .msg .bubble .more i { font-style:normal; opacity:.18; }
  @media (prefers-reduced-motion: no-preference) {
    .msg .bubble .more i:nth-child(1) { animation:dot1 1.6s steps(1) infinite; }
    .msg .bubble .more i:nth-child(2) { animation:dot2 1.6s steps(1) infinite; }
    .msg .bubble .more i:nth-child(3) { animation:dot3 1.6s steps(1) infinite; }
    @keyframes dot1 { 0%,12% { opacity:.18; } 13%,100% { opacity:.85; } }
    @keyframes dot2 { 0%,40% { opacity:.18; } 41%,100% { opacity:.85; } }
    @keyframes dot3 { 0%,68% { opacity:.18; } 69%,100% { opacity:.85; } }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg .bubble .more i { opacity:.6; }
  }
  /* machine talk (hint level, action): smaller and quieter than speech */
  .msg .note {
    font-size:.68rem; font-weight:600; color:var(--c-dim); padding:0 .35rem;
    letter-spacing:.01em;
  }
  .sys {
    align-self:center; max-width:94%; text-align:center;
    font-size:.74rem; font-weight:600; color:var(--c-err);
    background:var(--c-err-soft); border-radius:var(--r-bubble); padding:.35rem .7rem;
  }

  /* ---- the voice controls, at the foot of the words they make ---- */
  .chatfoot {
    flex:none; display:flex; align-items:center; gap:.75rem;
    padding:.8rem 1rem .9rem; border-top:1px solid var(--c-line);
    background:rgba(255,255,255,.66);
  }
  #orb {
    flex:none; position:relative;
    display:inline-flex; align-items:center; gap:.5rem;
    border-radius:var(--r-chip); border:1px solid var(--c-fill-lit);
    background:linear-gradient(158deg, var(--c-fill), var(--c-fill-lit)); color:#fff;
    padding:.5rem 1.05rem .5rem .85rem; font:800 .84rem var(--font); cursor:pointer;
    box-shadow:0 2px 8px rgba(20,60,78,.22);
    transition:filter .18s, box-shadow .18s, transform .1s;
  }
  #orb .dot {
    width:.5rem; height:.5rem; border-radius:50%; background:#fff; opacity:.85;
    transition:background .25s, box-shadow .25s, opacity .25s;
  }
  #orb:hover { filter:brightness(1.07); }
  #orb:active { transform:translateY(1px); }
  #orb:focus-visible { outline:2px solid var(--accent-deep); outline-offset:3px; }
  /* once it is running the button stops being a button and becomes the light */
  #orb:disabled {
    cursor:default; background:#eef7f2; color:var(--c-mid);
    border-color:var(--c-line); box-shadow:none; filter:none;
  }
  #orb:disabled .dot { background:var(--c-dim); opacity:1; }
  #orb[data-state="LISTENING"] .dot      { background:var(--hear-ink); }
  #orb[data-state="USER_SPEAKING"] .dot  { background:var(--hear-ink); box-shadow:0 0 0 4px var(--hear-soft); }
  #orb[data-state="PROCESSING"] .dot     { background:var(--think-ink); }
  #orb[data-state="AGENT_SPEAKING"] .dot { background:var(--talk-ink); box-shadow:0 0 0 4px var(--talk-soft); }
  #orb[data-state="LISTENING"], #orb[data-state="USER_SPEAKING"] { border-color:var(--hear-ink); }
  #orb[data-state="PROCESSING"] { border-color:var(--think-ink); }
  #orb[data-state="AGENT_SPEAKING"] { border-color:var(--talk-ink); }
  @media (prefers-reduced-motion: no-preference) {
    #orb[data-state="LISTENING"] .dot     { animation:breathe 2.4s ease-in-out infinite; }
    #orb[data-state="USER_SPEAKING"] .dot { animation:breathe 1s ease-in-out infinite; }
    #orb[data-state="AGENT_SPEAKING"] .dot { animation:beat .62s ease-in-out infinite; }
  }
  #status {
    min-width:0; font-size:.72rem; line-height:1.45; color:var(--c-dim);
    word-break:keep-all; overflow-wrap:anywhere;
  }

  /* ===================================================================
     THE PUFFERFISH. One inline SVG on a layer over the whole page, flown
     between two sockets. The element stack is a division of labour, so
     no animation ever fights another for the same transform:

       #tutor   position + heading   (inline transform / WAAPI flight)
       .drift   ambient motion       (idle bob, the reading ∞, breathing)
       .pose    impulses             (WAAPI: launch squash, the aha hop)
       .size    inflation            (class transition: the puff)
       svg      the animal           (fins, eyes, mouth on their own clocks)

     The art faces LEFT (toward the board). Flying right it is flipped,
     not rotated: a fish returns facing where it is going.
     =================================================================== */
  #pfLayer {
    position:fixed; inset:0; z-index:6; pointer-events:none; overflow:hidden;
  }
  #tutor {
    position:absolute; left:0; top:0;
    width:var(--pf); height:calc(var(--pf) * .88);
    transform:translate3d(-999px, -999px, 0);
    will-change:transform;
  }
  @media (prefers-reduced-motion: no-preference) {
    #tutor { transition:transform var(--fly, 0ms) cubic-bezier(.34, .8, .3, 1); }
  }
  #tutor .drift, #tutor .pose, #tutor .size {
    position:absolute; inset:0; transform-origin:50% 52%;
  }
  #tutor svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  #tutor .flip { transform-origin:100px 92px; transform-box:view-box; transition:transform .14s ease; }
  #tutor.faceR .flip { transform:scaleX(-1); }

  /* ambient: at home it bobs the way anything neutrally buoyant does;
     reading, it drifts a slow ∞ around its spot and leans a little */
  @media (prefers-reduced-motion: no-preference) {
    #tutor .drift { animation:bob 3.2s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform:translate(0,0) rotate(0deg) scale(1); }
      28%     { transform:translate(1.6px,-4px) rotate(1.6deg) scale(1.018); }
      58%     { transform:translate(-2px,3px) rotate(-1.8deg) scale(1); }
      82%     { transform:translate(1px,-1.5px) rotate(.6deg) scale(1.01); }
    }
    #tutor.pondering .drift { animation:wander 8.5s ease-in-out infinite; }
    @keyframes wander {
      0%    { transform:translate(0,0) rotate(0deg); }
      12.5% { transform:translate(-8px,-5px) rotate(-2deg); }
      25%   { transform:translate(-13px,0) rotate(-3deg); }
      37.5% { transform:translate(-8px,5.5px) rotate(-1deg); }
      50%   { transform:translate(0,0) rotate(0deg); }
      62.5% { transform:translate(8px,-5.5px) rotate(2.4deg); }
      75%   { transform:translate(13px,0) rotate(3deg); }
      87.5% { transform:translate(8px,5px) rotate(1deg); }
      100%  { transform:translate(0,0) rotate(0deg); }
    }
    /* a flight carries its own motion; nothing ambient underneath it — and
       the aha's first beat is a DEAD stop, which is what sells it */
    #tutor.swimming .drift, #tutor.stunned .drift { animation:none; }
  }

  /* inflation: the puff is a class, so arriving and leaving both spring */
  #tutor .size { transition:transform .26s cubic-bezier(.34,1.5,.5,1); }
  #tutor.puffed .size { transform:scale(1.32); }

  /* the animal itself */
  .pf-spikes {
    transform-box:fill-box; transform-origin:50% 50%;
    transform:scale(.55); opacity:0;
    transition:transform .24s cubic-bezier(.34,1.6,.5,1), opacity .16s;
  }
  #tutor.puffed .pf-spikes { transform:scale(1); opacity:1; }
  /* TWO portraits, not one morph: the reference sheet draws the puffed fish
     as its own animal (black almond eyes, its own fins), so the puff swaps
     drawings. The puffed portrait rides the .pf-spikes spring above — same
     bounce, same clocks — and the resting one steps aside under it. */
  .pf-normal { transition:opacity .18s ease; }
  #tutor.puffed .pf-normal { opacity:0; }

  .pf-fin {
    transform-box:fill-box;
    animation:finwave 1.15s ease-in-out infinite;
  }
  .pf-fin.tail { transform-origin:0% 50%; }
  .pf-fin.dorsal { transform-origin:30% 100%; animation-delay:-.4s; }
  .pf-fin.pect { transform-origin:50% 0%; animation-delay:-.2s; }
  @keyframes finwave {
    0%,100% { transform:rotate(-9deg); }
    50%     { transform:rotate(11deg); }
  }
  #tutor.pondering .pf-fin { animation-duration:.85s; }
  #tutor.swimming .pf-fin { animation-duration:.22s; }
  @media (prefers-reduced-motion: reduce) { .pf-fin { animation:none; } }

  /* eyes: the pupil group carries the GAZE, the iris group the WIDENING */
  .pf-pupil { transform:translate(-1.5px,.5px); transition:transform .35s ease; }
  .pf-iris { transform-box:fill-box; transform-origin:50% 50%; transition:transform .14s ease; }
  #tutor.stunned .pf-iris, #tutor.puffed .pf-iris { transform:scale(1.18); }
  #tutor.stunned .pf-pupil, #tutor.puffed .pf-pupil { transform:translate(0,-1.5px); }
  /* reading: title → first equation → the work below → a glance up (the
     thinking face) → back to the equation. The board is to its LEFT. */
  @media (prefers-reduced-motion: no-preference) {
    #tutor.pondering .pf-pupil { animation:scan 7.5s ease-in-out infinite; }
    @keyframes scan {
      0%,11%   { transform:translate(-4px,-3px); }
      17%,29%  { transform:translate(-5px,0); }
      35%,47%  { transform:translate(-4px,3.5px); }
      53%,59%  { transform:translate(-1px,-4.5px); }
      66%,79%  { transform:translate(-5px,.5px); }
      88%,100% { transform:translate(-4px,-3px); }
    }
  }
  .pf-mouth-o { opacity:0; }
  #tutor.stunned .pf-mouth-o, #tutor.puffed .pf-mouth-o { opacity:1; }
  #tutor.stunned .pf-mouth-smile, #tutor.puffed .pf-mouth-smile { opacity:0; }

  /* what it says without speaking: a startled !, and the faint maths that
     rises off a fish that is reading. Placed on the character's centre. */
  #pfMarks {
    position:absolute; left:50%; top:52%; width:0; height:0;
  }
  #pfMarks span {
    position:absolute; display:block; transform:translate(-50%,-50%);
    will-change:transform, opacity;
  }
  #pfMarks .bang {
    font:800 calc(var(--pf) * .34)/1 var(--font); color:#ff8a4d;
    text-shadow:0 1px 6px rgba(4,30,52,.35);
    animation:bangpop .9s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes bangpop {
    0%   { opacity:0; transform:translate(-50%,-50%)
           translate(var(--x), var(--y)) scale(.4); }
    22%  { opacity:1; transform:translate(-50%,-50%)
           translate(var(--x), var(--y)) scale(1.25); }
    45%  { transform:translate(-50%,-50%) translate(var(--x), var(--y)) scale(1); }
    100% { opacity:0; transform:translate(-50%,-50%)
           translate(var(--x), calc(var(--y) - 10px)) scale(1); }
  }
  #pfMarks .mus {
    font:700 calc(var(--pf) * .26)/1 var(--math); color:#a9e6f8;
    animation:muse 2.3s ease-out both;
  }
  /* faint by contract: 0 → .35 → 0, drifting up as it thins away */
  @keyframes muse {
    0%   { opacity:0; transform:translate(-50%,-50%)
           translate(var(--x), var(--y)) scale(.7); }
    30%  { opacity:.35; }
    100% { opacity:0; transform:translate(-50%,-50%)
           translate(var(--x), calc(var(--y) - 28px)) scale(1.05); }
  }

  /* ===================================================================
     RESPONSIVE. Under 1000px the conversation moves below the board; the
     page scrolls rather than dividing one screen three ways.
     =================================================================== */
  @media (max-width: 1000px) {
    header { max-width:calc(1440px + 2rem); padding:.7rem 1rem .35rem; }
    main { flex:none; padding:.35rem 1rem 1.15rem; }
    .grid { grid-template-columns:minmax(0,1fr); gap:.9rem; }
    #board { min-height:24rem; }
    #chatPanel { min-height:26rem; }
    .msg { max-width:88%; }
  }
  @media (max-width: 620px) {
    :root { --pf:60px; }
    header { flex-wrap:wrap; gap:.5rem .7rem; max-width:calc(1440px + 1.4rem); padding-inline:.7rem; }
    .brand { margin-right:auto; }
    .brand .sub { display:none; }
    main { padding:.35rem .7rem 1rem; }
    #board { padding:.9rem 1rem 1.1rem; min-height:21rem; }
    #problemText { font-size:1rem; }
    .boardline { font-size:1.16rem; }
    .chathead { gap:.5rem; padding:.6rem .7rem; }
    #stateChip { padding:.2rem .5rem .2rem .42rem; font-size:.7rem; }
    .chatfoot { flex-wrap:wrap; gap:.5rem .7rem; }
    #status { flex:1 0 100%; }
  }
</style>
</head>
<body>
  <!-- one distant fish, drawn once and used five times -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <path id="fishBody" d="M6 4.5c4-4 11-4 16 0-5 4-12 4-16 0zM5 4.5L0 .5v8z"/>
    </defs>
  </svg>

  <!-- ==================================================================
       THE SCENE: sunlight, caustics, motes, bubbles, a far shoal, and
       the reef silhouette asleep at the bottom. All of it is drawn in
       this file: no external images, nothing hotlinked.
       ================================================================== -->
  <div class="scene" aria-hidden="true">
    <div class="glow"></div>
    <div class="rays"></div>
    <div class="caustic"></div>
    <div class="motes"></div>
    <div class="bubbles"></div>

    <div class="shoal">
      <svg class="fish" viewBox="0 0 23 9" style="--y:15%; --k:1;   --sec:74s; --lag:0s"><use href="#fishBody"/></svg>
      <svg class="fish" viewBox="0 0 23 9" style="--y:21%; --k:.7;  --sec:74s; --lag:-5s"><use href="#fishBody"/></svg>
      <svg class="fish" viewBox="0 0 23 9" style="--y:11%; --k:.6;  --sec:74s; --lag:-8s"><use href="#fishBody"/></svg>
      <svg class="fish" viewBox="0 0 23 9" style="--y:56%; --k:1.2; --sec:102s; --lag:-36s"><use href="#fishBody"/></svg>
      <svg class="fish" viewBox="0 0 23 9" style="--y:64%; --k:.9;  --sec:102s; --lag:-44s"><use href="#fishBody"/></svg>
    </div>

    <!-- the reef, only as far as a silhouette: a rise of seabed, kelp
         bending one way, a branching coral, a stand of tube corals. It is
         a shape at the bottom of the eye, never a picture to look at. -->
    <svg id="reefSil" viewBox="0 0 1440 200" preserveAspectRatio="xMidYMax slice"
         aria-hidden="true" focusable="false">
      <path d="M0 200V158c130-14 250 6 400 2 150-4 260-22 400-18 140 4 240 18 360 14
               120-4 200-14 280-10v54z" fill="#0b3f66" opacity=".5"/>
      <path d="M0 200V174c150-10 280 6 430 2 150-4 270-16 410-12 140 4 250 14 370 10
               90-3 160-8 230-6v32z" fill="#083254" opacity=".8"/>
      <!-- kelp, bending the way one current bends it -->
      <g fill="none" stroke="#0b3f66" stroke-linecap="round" opacity=".75">
        <g stroke-width="11">
          <path d="M150 196c-14-30 12-52 0-84s10-46 2-66"/>
          <path d="M180 196c10-28-10-48 2-78s-6-42 4-60"/>
          <path d="M212 198c-8-24 8-40 0-66s6-34 2-48"/>
        </g>
        <g stroke-width="9" opacity=".85">
          <path d="M1180 196c-12-26 10-44 0-72s8-40 2-56"/>
          <path d="M1212 196c8-24-8-42 2-66s-4-36 4-52"/>
          <path d="M1246 198c-8-20 8-34 0-56s6-28 2-40"/>
        </g>
      </g>
      <!-- one branching coral -->
      <g fill="none" stroke="#0b3f66" stroke-linecap="round" stroke-linejoin="round"
         stroke-width="16" opacity=".7">
        <path d="M470 198v-64"/>
        <path d="M470 152l-26-36"/><path d="M470 146l24-40"/>
        <path d="M444 118l-4-24"/><path d="M494 110l14-22"/>
      </g>
      <!-- a stand of tube corals -->
      <g fill="#0b3f66" opacity=".65">
        <path d="M880 198l6-58a16 16 0 0 1 32 0l6 58z"/>
        <path d="M930 198l5-74a17 17 0 0 1 34 0l5 74z"/>
        <path d="M984 198l6-52a15 15 0 0 1 30 0l6 52z"/>
      </g>
    </svg>
  </div>

  <header>
    <div class="brand">
      <span class="name">생선님</span>
      <span class="sub">Visual Socratic Tutor</span>
    </div>
    <div id="conn" role="status">연결 대기</div>
