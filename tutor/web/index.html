<!doctype html>
<!--
  Hands-free browser client for the Visual Socratic Tutor.

  The laptop only captures and plays; the VAD, STT, tutor pipeline and TTS all
  run on the server (that is the point of this page: over SSH the server has no
  microphone and nobody is listening to its speaker).

    IN:  getUserMedia → AudioWorklet → float32 @16 kHz → int16 → 512-sample
         frames → binary AUDIO frames on ONE WebSocket (the same framing the
         camera device uses, so the server code is unchanged)
    OUT: turn_state / transcript / tutor_says / problem events + TTS_AUDIO
         frames with the tutor's speech → <audio> → "playback_done" back

  Barge-in: the mic stays open while the tutor speaks so the student can cut
  in. What keeps the tutor from hearing itself is echoCancellation in
  getUserMedia — the browser subtracts what it is playing from what it hears —
  plus a higher onset bar on the server for those frames. Without working AEC
  (an external speaker, a bad driver) the tutor will interrupt itself; that is
  what BARGE_IN=0 is for.

  The mic still shuts during PROCESSING: there is nothing to interrupt while it
  thinks, and a half-turn must not survive into the answer.

  Chrome/Edge recommended (AudioWorklet at a 16 kHz AudioContext).

  DESIGN: one underwater scene, one blue accent, one 20px corner. Two zones:
  the BOARD in the middle, where the problem is pinned and every mathematical
  line the tutor says is written out in real type (KaTeX), and the
  conversation on the right. The tutor is a squid, drawn here as SVG: it
  breathes in the mic bar and fills the board before the first hint. Every
  control on this page is wired to something real; there are deliberately no
  decorative buttons. The archive of solved problems is on hold, so its panel
  is gone and only the transcript it will need is still kept.

  Both colour schemes are the same water at different depths: the surface in
  light mode, the deep in dark. Everything is a variable, including the four
  the server names when it draws a curve (--accent-deep, --err, --dim, --line
  in tutor/hints/plot.py), so a figure is legible either way.

  MATH: the server sends one normalized display vocabulary (x², ·, √, log₃,
  1/5 — see tutor/speech/mathspeak.py displayable()). This page converts that
  small alphabet to TeX and typesets it with KaTeX. If the KaTeX CDN cannot be
  reached, everything falls back to the plain unicode text, which is exactly
  what the page showed before KaTeX existed.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Socratic Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
  :root {
    /* The surface of the water. Every colour here is a variable because the
       server names four of them when it draws a curve (tutor/hints/plot.py). */
    --bg:#bad6f0; --bg-far:#93b9e2; --bg-near:#e6f1fd;
    --surface:rgba(255,255,255,.62); --surface-solid:#f4f9ff;
    /* the glass: a lit top edge, a white rim, and the water blurred behind */
    --glass:linear-gradient(158deg, rgba(255,255,255,.70), rgba(255,255,255,.46));
    --glass-rim:rgba(255,255,255,.62);
    --glass-lip:inset 0 1px 0 rgba(255,255,255,.9);
    --line:#c2d9f0;
    --text:#2c4d7e; --dim:#6f92c0;
    --accent:#5b86d6; --accent-deep:#39619f;
    --accent-soft:#e2edfb; --accent-line:#bdd5f4;
    --err:#cc6b5e;
    --squid-lit:#ffe6cf; --squid-mid:#f8c49d; --squid-deep:#e79b6d;
    --shadow:0 1px 2px rgba(38,77,132,.06), 0 14px 34px rgba(38,77,132,.10);
    --shadow-lift:0 2px 4px rgba(38,77,132,.08), 0 22px 50px rgba(38,77,132,.14);
    --radius:20px; --radius-sm:12px;
    --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
           "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --math:"STIX Two Math", "Cambria Math", "Times New Roman", serif;
  }
  /* The same water, deeper. Note --accent-deep inverts to a LIGHT blue: the
     server hands it to the curve stroke and the figure note, both of which sit
     on the surface colour. */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12293f; --bg-far:#0a1a2b; --bg-near:#1b3a58;
      --surface:rgba(226,240,255,.07); --surface-solid:#173049;
      --glass:linear-gradient(158deg, rgba(190,220,255,.13), rgba(190,220,255,.05));
      --glass-rim:rgba(200,226,255,.18);
      --glass-lip:inset 0 1px 0 rgba(220,238,255,.20);
      --line:#2b4d70;
      --text:#dceaf9; --dim:#8fb2d8;
      --accent:#6f9fe8; --accent-deep:#a8c9f6;
      --accent-soft:rgba(111,159,232,.16); --accent-line:rgba(111,159,232,.38);
      --err:#e58b7d;
      --shadow:0 1px 2px rgba(0,0,0,.28), 0 14px 34px rgba(0,0,0,.30);
      --shadow-lift:0 2px 4px rgba(0,0,0,.32), 0 22px 50px rgba(0,0,0,.38);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; min-height:100dvh; display:flex; flex-direction:column;
    color:var(--text); font:15px/1.6 var(--font);
    /* the light comes from the upper right and the floor falls away to the
       left, as it does in the photograph */
    background:
      radial-gradient(90% 70% at 88% -6%, var(--bg-near), transparent 62%),
      radial-gradient(120% 90% at 6% 104%, var(--bg-far), transparent 58%),
      linear-gradient(168deg, var(--bg), var(--bg-far));
    background-attachment:fixed;
  }
  /* light through water: one slow band across the top, never in the way */
  body::before {
    content:""; position:fixed; inset:-20% -10% auto -10%; height:70vh; z-index:0;
    background:linear-gradient(102deg, transparent 30%, rgba(255,255,255,.30) 46%,
               transparent 58%, rgba(255,255,255,.18) 70%, transparent 82%);
    pointer-events:none;
  }
  /* the sandbank sweeping in from the right, and the floor it rises from */
  body::after {
    content:""; position:fixed; left:-15%; right:-30%; bottom:-46vh; height:78vh;
    z-index:0; border-radius:50% 50% 0 0; pointer-events:none;
    transform:rotate(-4deg);
    background:radial-gradient(58% 100% at 62% 100%, var(--bg-near), transparent 70%);
    opacity:.8;
  }
  /* the reef, along the bottom edge. Soft and out of focus on purpose: it is
     scenery, and the panels above it carry the lesson. */
  /* width:100% with height:auto, so the reef keeps its own proportions: a
     branching coral squashed to fit a fixed height stops being a coral and
     becomes a worm. It is taller than the strip left for it on purpose, and
     the glass above blurs the part it overlaps, which is what a panel
     floating over a reef should look like. */
  #reef {
    position:fixed; left:0; bottom:0; z-index:0; width:100%; height:auto;
    pointer-events:none; opacity:.85; filter:blur(.5px);
  }
  @media (prefers-color-scheme: dark) {
    body::before { opacity:.28; }
    body::after { opacity:.45; }
    #reef { opacity:.3; }
  }

  /* bubbles: six of them, rising, behind everything */
  #water { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #water i {
    position:absolute; bottom:-8vh; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.92), rgba(255,255,255,.18) 58%,
               rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.45); opacity:0;
  }
  @media (prefers-reduced-motion: no-preference) {
    #water i { animation:rise linear infinite; }
    @keyframes rise {
      0%   { transform:translateY(0) scale(.7); opacity:0; }
      14%  { opacity:.7; }
      86%  { opacity:.5; }
      100% { transform:translateY(-118vh) scale(1); opacity:0; }
    }
  }

  main, header, footer { position:relative; z-index:1; }

  /* ---- top bar: the brand, and the microphone that used to sit at the
     bottom. Nothing was dropped with the bottom bar; 시작 is the click that
     grants the microphone and unlocks the speaker, so it has to stay. ---- */
  header {
    flex:none; min-height:68px;
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding:.7rem 1.5rem;
  }
  .brand { display:flex; align-items:baseline; gap:.5rem; min-width:0; }
  /* The reference sets its title in white script over the water. At 120px it
     can; at 17px white on pale blue is about 1.6:1, so the shape of that type
     is borrowed and the colour is not: soft, wide-spaced, and dark enough to
     read. */
  .brand .name {
    font-size:1.15rem; font-weight:800; letter-spacing:-.01em; color:var(--accent-deep);
    text-shadow:0 1px 0 rgba(255,255,255,.55);
  }
  .brand .name span {
    margin-left:.6rem; font-size:.66rem; font-weight:600; color:var(--dim);
    letter-spacing:.16em; text-transform:uppercase;
  }
  .mic { display:flex; align-items:center; gap:.7rem; min-width:0; }
  #status {
    font-size:.76rem; line-height:1.45; color:var(--dim); text-align:right;
    max-width:48ch; word-break:keep-all;
  }
  #orb {
    flex:none; display:inline-flex; align-items:center; gap:.5rem;
    border-radius:999px; border:1px solid var(--accent-line);
    background:var(--surface); backdrop-filter:blur(10px);
    padding:.42rem .95rem .42rem .8rem;
    color:var(--accent-deep); font:800 .82rem var(--font); cursor:pointer;
    transition:border-color .25s, box-shadow .25s, transform .12s;
  }
  #orb .dot {
    width:.5rem; height:.5rem; border-radius:50%; background:var(--dim);
    transition:background .25s, box-shadow .25s;
  }
  #orb:disabled { cursor:default; }
  #orb:not(:disabled):hover { border-color:var(--accent); }
  #orb:not(:disabled):active { transform:scale(.97); }
  #orb[data-state="LISTENING"] .dot      { background:var(--accent); }
  #orb[data-state="USER_SPEAKING"] .dot  { background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
  #orb[data-state="PROCESSING"] .dot     { background:var(--dim); }
  #orb[data-state="AGENT_SPEAKING"] .dot { background:var(--err); }
  #conn {
    flex:none; font-size:.76rem; font-weight:700; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:.3rem .9rem;
    background:var(--surface); backdrop-filter:blur(10px);
  }
  #conn.ok { color:var(--accent-deep); border-color:var(--accent-line); background:var(--accent-soft); }
  #conn.down { color:var(--err); }

  /* ---- middle: board in the centre, conversation on the right ---- */
  /* the bottom padding is the reef's: the panels stop short of the floor so
     the water they float in is visible under them */
  main {
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; justify-content:center;
    padding:1.5rem 1.5rem 7rem;
  }
  .grid {
    width:100%; max-width:1400px; min-height:0;
    display:grid; gap:1rem;
    grid-template-columns:minmax(0,1fr) 360px;
  }
  .centre { min-height:0; display:flex; flex-direction:column; gap:.8rem; }

  .panel {
    background:var(--glass); border:1px solid var(--glass-rim);
    border-radius:var(--radius); box-shadow:var(--glass-lip), var(--shadow);
    backdrop-filter:blur(20px) saturate(150%);
  }
  @media (prefers-reduced-transparency: reduce) {
    .panel, #conn, #orb {
      background:var(--surface-solid); border-color:var(--line);
      box-shadow:var(--shadow); backdrop-filter:none;
    }
  }
  .cardlabel {
    display:inline-block; font-size:.72rem; font-weight:700;
    color:var(--accent-deep); background:var(--accent-soft);
    border:1px solid var(--accent-line);
    border-radius:999px; padding:.18rem .75rem;
  }

  /* ---- problem card: notation, not a photo ---- */
  #problemCard { flex:none; padding:1.1rem 1.6rem 1.25rem; text-align:center; }
  #problemCard[hidden] { display:none; }
  #problemCard .cardlabel { margin-bottom:.6rem; }
  #problemText { font-size:1.15rem; font-weight:700; line-height:1.6; word-break:keep-all; }
  #problemEqs { margin-top:.45rem; font-family:var(--math); font-size:1.18rem; }
  #problemEqs div { padding:.12rem 0; }

  /* ---- worksheet photo (click / drag / paste) ----
     Hidden until the server says this laptop is the eye (INPUT_MODE=upload).
     With a phone on /camera the box would be a dead end: the phone is asked
     first and answers every capture. */
  #sheet { display:none; }
  #drop[hidden] { display:none; }
  #drop {
    flex:none; display:flex; align-items:center; justify-content:center; gap:.9rem;
    border-style:dashed; padding:.75rem 1rem; color:var(--dim);
    font-size:.82rem; line-height:1.5; text-align:center; cursor:pointer;
    transition:border-color .2s, color .2s;
  }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--text); }
  #drop.has { border-style:solid; border-color:var(--accent-line); background:var(--accent-soft); color:var(--text); }
  #drop b { font-weight:700; }
  #thumb { max-height:3rem; border-radius:var(--radius-sm); display:none; }
  #thumb.has { display:block; }
  .meta { font-size:.75rem; color:var(--dim); }

  /* ---- the board: every mathematical line the tutor writes ---- */
  #board {
    flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    padding:1rem 1.4rem 1.2rem;
    /* the dot grid a whiteboard has, over the panel's own glass. The glass
       layer is repeated here because background-image replaces .panel's, and
       without it the board is a hole straight through to the water. */
    background-image:
      radial-gradient(circle, var(--line) 1.1px, transparent 1.1px),
      var(--glass);
    background-size:24px 24px, auto;
    background-position:12px 12px, 0 0;
  }
  /* the tutor sits in the corner of its own board, no title needed */
  #boardHead { flex:none; display:flex; align-items:center; padding-bottom:.2rem; }
  #boardHead svg { width:56px; height:auto; }
  #boardLines {
    flex:1 1 auto; min-height:0; overflow-y:auto; padding-top:.2rem; scrollbar-width:thin;
    /* A board fills downward and scrolls, so the line at the top edge is
       usually a line in half. Fade it out instead of slicing it. */
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 18px,
                       #000 calc(100% - 10px), transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 18px,
                       #000 calc(100% - 10px), transparent 100%);
  }
  .boardline {
    padding:.45rem .2rem; font-size:1.06rem; line-height:1.7;
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .boardline .katex { font-size:1.15em; }
  /* a function sketched on the board: axes, a light grid, the curve */
  .boardfigure { padding:.5rem 0; }
  @media (prefers-reduced-motion: no-preference) {
    .boardfigure { transition:opacity .18s ease; }
    .boardfigure.fading { opacity:.15; }
  }
  /* The server now draws the sketch at 900x470, which is about the width of
     the board, so it fills it at roughly 1:1 and the tick labels stay the
     size they were drawn. */
  .boardfigure svg { display:block; width:100%; height:auto; }
  .boardfigure .grid line { stroke:var(--line); stroke-width:1; }
  .boardfigure .axes line { stroke:var(--dim); stroke-width:1.4; }
  .boardfigure .ticks text { fill:var(--dim); font-size:10px; font-family:var(--font); }
  .boardfigure .legend { font-size:12px; font-family:var(--math); }
  .boardfigure .note {
    margin-top:.15rem; text-align:center; font-size:.78rem; font-weight:600;
    color:var(--accent-deep); word-break:keep-all;
  }

  /* What the tutor deliberately WROTE. Written, not framed: a person at a
     board writes the line and scribbles why beside it, and a card around
     every step turns a train of thought into a list of receipts. */
  .boardline.key {
    padding:.55rem .2rem .75rem; margin:.2rem 0;
    font-size:1.32rem; line-height:1.5; color:var(--text);
  }
  .boardline.key .katex { font-size:1.3em; }
  .boardline.key .note {
    margin-top:.25rem; font-size:.8rem; font-weight:600; color:var(--accent-deep);
    letter-spacing:-.01em; word-break:keep-all; opacity:.85;
  }
  /* Empty state: the tutor is already in the corner, so this is just the
     invitation. */
  /* min-height, not flex: #boardLines is a scroll container, so a flex-grow
     child of it grows to its content and sits at the top */
  #boardEmpty {
    min-height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:.35rem;
    color:var(--dim); font-size:.9rem; text-align:center; padding-bottom:2rem;
  }
  #boardEmpty b { display:block; font-size:1.05rem; font-weight:700; color:var(--text); }

  /* ---- conversation (right) ---- */
  #chatPanel {
    min-height:0; display:flex; flex-direction:column; padding:1rem 1rem .7rem;
  }
  #chatPanel .cardlabel { align-self:flex-start; }
  #chat {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:.85rem;
    padding:.7rem .1rem .6rem; scrollbar-width:thin;
  }
  .msg { max-width:92%; display:flex; flex-direction:column; gap:.22rem; }
  .msg .who { font-size:.7rem; font-weight:700; color:var(--dim); padding:0 .35rem; }
  .msg .bubble {
    border-radius:var(--radius-sm); padding:.55rem .85rem; font-size:.88rem;
    white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere;
  }
  .msg.tutor { align-self:flex-start; }
  .msg.tutor .bubble {
    background:var(--surface-solid); border:1px solid var(--line);
    border-top-left-radius:5px;
  }
  .msg.you { align-self:flex-end; align-items:flex-end; }
  .msg.you .bubble {
    background:var(--accent); border:1px solid var(--accent); color:#fff;
    border-top-right-radius:5px;
  }
  .msg .note { font-size:.7rem; color:var(--dim); padding:0 .35rem; }
  .sys { align-self:center; font-size:.75rem; color:var(--err); text-align:center; }

  /* the tutor is thinking: shown only during PROCESSING */
  #thinking { align-self:flex-start; }
  #thinking[hidden] { display:none; }
  #thinking .bubble {
    display:flex; align-items:center; gap:.5rem;
    background:var(--accent-soft); border:1px solid var(--accent-line);
    color:var(--accent-deep); font-size:.8rem; font-weight:600;
  }
  .dots { display:inline-flex; gap:.22rem; }
  .dots i { width:.3rem; height:.3rem; border-radius:50%; background:var(--accent); opacity:.4; }
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation:blink 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay:.2s; }
    .dots i:nth-child(3) { animation-delay:.4s; }
    @keyframes blink { 40% { opacity:1; } }
  }

  /* the squid breathes; it bobs faster while it talks. Nothing loops fast
     enough to compete with the voice, and nothing loops at all under reduced
     motion. */
  .squid { overflow:visible; }
  @media (prefers-reduced-motion: no-preference) {
    .squid .swim { transform-origin:50% 30%; animation:drift 6s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform:translateY(0) rotate(0deg); }
      50%      { transform:translateY(-5px) rotate(-1.6deg); }
    }
    body:has(#orb[data-state="AGENT_SPEAKING"]) #boardHead .swim { animation-duration:2.4s; }
  }

  /* One column under 960px: problem, photo, board, chat. The page scrolls
     rather than dividing one screen three ways, because splitting 844px of
     phone between a problem statement, a board and a conversation leaves the
     board a sliver, and the board is the lesson. */
  @media (max-width: 960px) {
    header { flex-wrap:wrap; padding:.6rem .8rem; }
    /* #status is a child of .mic, not of header, so it is .mic that has to
       wrap: giving the status `flex:1 0 100%` in a nowrap parent just made it
       426px wide inside a 719px page and scrolled the whole document sideways */
    .mic { flex-wrap:wrap; justify-content:flex-end; }
    #status { flex:1 0 100%; max-width:100%; text-align:right; order:3; }
    main { flex:none; padding:.4rem .8rem .8rem; }
    .grid { grid-template-columns:minmax(0,1fr); }
    #board { min-height:20rem; }
    #chatPanel { min-height:20rem; }
    #boardHead svg { width:44px; }
    #problemText { font-size:1.02rem; }
    .msg { max-width:88%; }
  }
</style>
</head>
<body>
  <!-- The tutor, drawn once and used wherever it appears. Hand-drawn SVG
       rather than an image file: it has to sit at 26px in the header and
       132px on the board, tint itself for both colour schemes, and ship
       inside the one file the server serves. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- gradients live OUTSIDE the symbol: a <use> clone resolves url(#…)
           against the document, and a gradient hidden inside the symbol is a
           coin flip across browsers -->
      <radialGradient id="sqMantle" cx="34%" cy="24%" r="82%">
        <stop offset="0" stop-color="var(--squid-lit)"/>
        <stop offset="56%" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </radialGradient>
      <radialGradient id="sqHead" cx="34%" cy="18%" r="88%">
        <stop offset="0" stop-color="var(--squid-lit)"/>
        <stop offset="62%" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </radialGradient>
      <linearGradient id="sqArm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </linearGradient>
      <symbol id="squid" viewBox="0 0 120 152">
        <g class="swim">
          <!-- arms: tapered, splayed, back pair first so the front three
               overlap them. Long enough that the silhouette reads as a squid
               and not as a body with legs. -->
          <g fill="url(#sqArm)" opacity=".78">
            <path d="M40 106c-6 13-11 26-13 39-1 6 6 8 8 2 4-14 8-27 12-41z"/>
            <path d="M80 106c6 13 11 26 13 39 1 6-6 8-8 2-4-14-8-27-12-41z"/>
          </g>
          <g fill="url(#sqArm)">
            <path d="M49 108c-4 14-8 27-8 41 0 6 8 6 9 0 2-14 4-27 7-41z"/>
            <path d="M56 109c-1 15-1 29 0 43 0 6 8 6 8 0 1-14 1-28 0-43z"/>
            <path d="M71 108c4 14 8 27 8 41 0 6-8 6-9 0-2-14-4-27-7-41z"/>
          </g>
          <!-- head, then mantle on top of it -->
          <rect x="26" y="82" width="68" height="36" rx="17" fill="url(#sqHead)"/>
          <path d="M60 6c26 0 40 20 40 46 0 24-16 40-40 40S20 76 20 52C20 26 34 6 60 6z"
                fill="url(#sqMantle)"/>
          <!-- the light on top, and two spots, exactly as the reference reads -->
          <ellipse cx="45" cy="30" rx="15" ry="11" fill="#fff" opacity=".38" transform="rotate(-24 45 30)"/>
          <circle cx="76" cy="44" r="6" fill="var(--squid-deep)" opacity=".45"/>

<script>
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };

const SAMPLE_RATE = 16000;
const FRAME_SAMPLES = 512;          // Silero's window at 16 kHz (32 ms)

const IMAGE_FRAME = 0x01, AUDIO_FRAME = 0x02, TTS_FRAME = 0x03;

let ws = null;
let turnState = "";                 // LISTENING | USER_SPEAKING | PROCESSING | AGENT_SPEAKING
let streamSeq = 0;
let worksheet = null;               // optional jpeg bytes for capture_request
let uploadMode = false;             // set from the server's config event

// With barge-in the mic stays open while the tutor talks, so the student can
// cut in; the server judges those frames at a higher bar. It stays shut during
// PROCESSING either way — there is nothing to interrupt while it thinks, and a
// half-turn must not survive into the answer.
let bargeIn = false;
const micOpen = () =>
  turnState === "LISTENING" ||
  turnState === "USER_SPEAKING" ||
  (bargeIn && turnState === "AGENT_SPEAKING");

// --- the project's binary framing, in ~15 lines ----------------------------
function encodeFrame(type, header, payload) {
  const head = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(5 + head.length + payload.length);
  new DataView(out.buffer).setUint32(1, head.length, false);  // big endian
  out[0] = type;
  out.set(head, 5);
  out.set(payload, 5 + head.length);
  return out;
}

function decodeFrame(buffer) {
  const bytes = new Uint8Array(buffer);
  const headLen = new DataView(buffer).getUint32(1, false);
  return {
    type: bytes[0],
    header: JSON.parse(new TextDecoder().decode(bytes.subarray(5, 5 + headLen))),
    payload: bytes.subarray(5 + headLen),
  };
}

const sendEvent = (event, data = {}) => {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: "EVENT", event, data, ts: Date.now() }));
};

// --- math typesetting -------------------------------------------------------
// The server normalizes everything the tutor writes into ONE small display
// vocabulary (x² · √ log₃ f'(1) 1/5 — mathspeak.displayable). These two
// functions take that vocabulary the last mile: find the math runs inside a
// Korean sentence, translate the run to TeX, hand it to KaTeX. No KaTeX (CDN
// down, offline) → the unicode text stands as-is, which is yesterday's page.
const SUBS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7",
               "₈":"8","₉":"9","ₐ":"a","ₑ":"e","ₕ":"h","ₖ":"k","ₗ":"l","ₘ":"m",
               "ₙ":"n","ₒ":"o","ₚ":"p","ₛ":"s","ₜ":"t","ₓ":"x",
               // a_{n+1}: the operators sink with the rest of the subscript
               "₊":"+","₋":"-","₌":"=","₍":"(","₎":")" };
// the server's unicode superscripts (x², x¹⁰, xⁿ), back to TeX for KaTeX
const SUP_CHARS = "⁰¹²³⁴⁵⁶⁷⁸⁹ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻ";
const SUP_ASCII = "0123456789abcdefghijklmnoprstuvwxyz";
const SUPS = Object.fromEntries([...SUP_CHARS].map((c, i) => [c, SUP_ASCII[i]]));
const SUP_RE = new RegExp("[" + SUP_CHARS + "]+", "g");
// derived from the tables above, so a character added there is understood
// everywhere: a run that breaks mid-subscript renders as half an expression
const SUB_CHARS = Object.keys(SUBS).join("");
const SUB_RE = new RegExp("[" + SUB_CHARS + "]+", "g");
const MATH_RUN = new RegExp(
  "[0-9A-Za-z+\\-=^*/().,'′²³√·_{} " + SUB_CHARS + SUP_CHARS + "]+", "g");
const MATH_SIGNAL = new RegExp(
  "[=^²³√·′]|[" + SUB_CHARS + SUP_CHARS + "]|\\w\\/\\w|[A-Za-z]['_]|"
  + "\\b(?:log|sqrt|sin|cos|tan)\\b");

function toTex(s) {
  // function names first: "log₃" has no word boundary before the subscript
  s = s.replace(/\b(log|sin|cos|tan)(?![A-Za-z])/g, "\\$1");
  s = s.replace(/√\(([^()]*)\)/g, "\\sqrt{$1}");
  s = s.replace(SUP_RE, (m) => "^{" + [...m].map(c => SUPS[c]).join("") + "}");
  // the (?!\{) keeps these off the braced groups the lines above just built:
  // re-matching "_{n+k}" would take "_{n" and leave "+k}" dangling
  s = s.replace(/\^(?!\{)([A-Za-z0-9]+)/g, "^{$1}");
  s = s.replace(SUB_RE, (m) => "_{" + [...m].map(c => SUBS[c]).join("") + "}");
  s = s.replace(/_(?!\{)([A-Za-z0-9]+)/g, "_{$1}");   // raw a_4 that slipped through
  s = s.replace(/·/g, "\\cdot ");
  s = s.replace(/(?<![}\w])(\w+)\s*\/\s*(\w+)(?![\w{])/g, "\\frac{$1}{$2}");
  return s;
}

/** text → { frag, hasMath }: math runs typeset, everything else plain text. */
function mathify(text) {
  const frag = document.createDocumentFragment();
  if (!window.katex) { frag.append(text); return { frag, hasMath: false }; }
  let last = 0, found = false;
  for (const m of text.matchAll(MATH_RUN)) {
    const run = m[0], at = m.index;
    // a run must LOOK like math, not just be latin letters in a sentence
    const core = run.trim();
    if (core.length < 2 || !MATH_SIGNAL.test(core)) continue;
    frag.append(text.slice(last, at));
    frag.append(run.slice(0, run.indexOf(core)));          // leading spaces
    const span = document.createElement("span");
    try {
      span.innerHTML = katex.renderToString(toTex(core), { throwOnError: true });
    } catch (e) {
      span.textContent = core;         // one bad run must not lose the sentence
    }
    frag.append(span);
    frag.append(run.slice(run.indexOf(core) + core.length)); // trailing spaces
    last = at + run.length;
    found = true;
  }
  frag.append(text.slice(last));
  return { frag, hasMath: found };
}

// --- 1. capture: mic → worklet → 512-sample int16 frames → server ----------
async function start() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true,
               channelCount: 1 },
    });
  } catch (e) {
    setStatus("마이크 권한이 필요합니다 (localhost 또는 HTTPS에서 열어주세요): " + e.message);
    return;
  }

  // Ask for 16 kHz so the browser resamples for us — the server's VAD needs it.
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.sampleRate !== SAMPLE_RATE) {
    setStatus(`브라우저가 ${ctx.sampleRate} Hz를 반환했습니다. Chrome/Edge를 사용해 주세요.`);
    return;
  }
  await ctx.audioWorklet.addModule("worklet.js");
  const capture = new AudioWorkletNode(ctx, "pcm-capture");
  ctx.createMediaStreamSource(stream).connect(capture);
  capture.port.onmessage = (e) => onSamples(e.data);

  const speakerReady = await unlockAudio();   // must happen inside this click
  connect();

  // from here on the button is a status light, not a control
  $("orb").disabled = true;
  setStatus(
    speakerReady
      ? "핸즈프리로 대화하세요. 튜터 목소리는 이 기기에서 나옵니다."
      : "마이크는 열렸지만 스피커가 차단되었습니다. 페이지를 한 번 클릭해 주세요."
  );
}

let pending = new Float32Array(0);
function onSamples(block) {
  if (!micOpen()) return;               // muted while the tutor thinks or speaks
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const joined = new Float32Array(pending.length + block.length);
  joined.set(pending);
  joined.set(block, pending.length);
  pending = joined;

  while (pending.length >= FRAME_SAMPLES) {
    const frame = pending.subarray(0, FRAME_SAMPLES);
    pending = pending.slice(FRAME_SAMPLES);
    const pcm = new Int16Array(FRAME_SAMPLES);
    for (let i = 0; i < FRAME_SAMPLES; i++) {
      const s = Math.max(-1, Math.min(1, frame[i]));   // clamp: overflow screeches
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;        // float32 → int16 LE
    }
    ws.send(encodeFrame(AUDIO_FRAME, {
      stream_id: "browser", sample_rate: SAMPLE_RATE, bits: 16, channels: 1,
      seq: ++streamSeq, last: false,
    }, new Uint8Array(pcm.buffer)));
  }
}

// --- 2. one socket, both directions ---------------------------------------
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/browser`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => sendEvent("hello", { device_id: "browser", proto: 1, caps: ["mic", "speaker"] });
  ws.onclose = () => {
    setState("");
    setConn("연결 끊김", "down");
    setStatus("연결이 끊어졌습니다. 새로고침 해주세요.");
  };
  ws.onmessage = (e) => (typeof e.data === "string" ? onEvent(JSON.parse(e.data)) : onBinary(e.data));
}

function setConn(text, cls) {
  const conn = $("conn");
  conn.textContent = text;
  conn.className = cls || "";
}

function onEvent(msg) {
  const d = msg.data || {};
  switch (msg.event) {
    case "hello_ack":   setConn("연결됨", "ok"); setStatus("연결됐어요. 말을 시작하세요."); break;
    case "turn_state":  setState(d.state); break;
    case "config":
      bargeIn = !!d.barge_in;
      // Only an upload-mode server takes a photo from this page; with a phone
      // watching, the box would be an invitation to nowhere.
      uploadMode = d.input_mode === "upload";
      $("drop").hidden = !uploadMode;
      break;
    case "barge_in":    stopSpeaking(); break;
    case "transcript":  addTurn("you", d.text || "(인식 실패)"); break;
    case "tutor_says":  addTurn("tutor", d.text); break;
    case "board":       for (const line of d.lines || []) boardWrite(line); break;
    case "figure":      boardDraw(d); break;
    case "stage":       setStage(d.text); break;
    case "solved":      addSolved(d.text); break;
    case "problem":     showProblem(d); break;
    case "hint_issued": note(`힌트 L${d.level} · ${d.action}`); break;
    case "capture_request": sendWorksheet(d.capture_id); break;
    case "error":       addTurn("err", d.message || JSON.stringify(d)); break;
  }
}

function onBinary(buffer) {
  const { type, header, payload } = decodeFrame(buffer);
  if (type === TTS_FRAME) onTts(header, payload);
}

function setState(s) {
  turnState = s;
  // a data attribute, not a class: the state light is one dot inside the
  // button, and the button keeps its own classes
  const orb = $("orb");
  if (orb.disabled) orb.dataset.state = s;
  const label = {
    LISTENING: "듣는 중", USER_SPEAKING: "말하는 중",
    PROCESSING: "생각 중", AGENT_SPEAKING: "튜터 발화 중",
  }[s] || "대기";
  $("stateLabel").textContent = label;
  orb.setAttribute("aria-label", label);
  const thinking = $("thinking");
  thinking.hidden = s !== "PROCESSING";
  if (!thinking.hidden) {
    $("chat").appendChild(thinking);     // always after the newest message
    scrollChat();
  }
  if (s === "LISTENING")                 // a fresh turn starts generic
    $("stageText").textContent = "튜터가 생각하는 중이에요";
}

// What the pipeline is doing right now (server `stage` events) — the screen
// carries the progress so the voice does not have to narrate it.
function setStage(text) {
  if (!text) return;
  $("stageText").textContent = text;
  if (!$("thinking").hidden) scrollChat();
}

// --- the problem card and the board ----------------------------------------
function showProblem(d) {
  const text = (d.text || "").trim();
  const eqs = d.equations || [];
  if (!text && !eqs.length) return;
  problemTitle = text;
  currentDialogue = [];                // a new problem starts a fresh transcript
  const pt = $("problemText");
  pt.textContent = "";
  pt.append(mathify(text).frag);
  const box = $("problemEqs");
  box.textContent = "";
  // the server sends only equations the statement does NOT already spell out
  for (const eq of eqs) {
    const line = document.createElement("div");
    line.append(mathify(eq).frag);
    box.appendChild(line);
  }
  $("problemCard").hidden = false;
  boardClear();                          // a new problem starts a clean board
}

// --- the solved-problems archive -------------------------------------------
// The PANEL is on hold, so nothing is drawn. What is kept is the transcript it
// will be built from: the conversation since the last problem event, cleared
// when the server says that problem is DONE (a `solved` event from the finish
// path, not from a mere "맞아요"). Two lines, and the archive can come back
// without the lesson having lost anything in the meantime.
let currentDialogue = [];              // {kind, text} since the last problem event
let problemTitle = "";

function addSolved(title) {
  console.info("solved: %s (%d turns)", title || problemTitle, currentDialogue.length);
  currentDialogue = [];
}

let boardSeen = new Set();             // one problem's writing, no duplicates

function boardClear() {
  boardSeen = new Set();
  const lines = $("boardLines");
  lines.textContent = "";
  const empty = document.createElement("div");
  empty.id = "boardEmpty";
  const invite = document.createElement("b");
  invite.textContent = "같이 풀어 볼까요?";
  empty.append(invite, "튜터가 짚어 주는 수식이 여기에 쌓여요.");
  lines.appendChild(empty);
}

/** A function sketched on the board. The markup is built by the server (sympy
    samples the curve there), so this only has to place it — and the same leak
    guard that screens the spoken hint has already seen it. */
/** ONE grid per problem, replaced in place. The server re-declares the whole
    scene each turn — a curve that has served its purpose is simply absent
    from the next one — so the picture must CHANGE rather than a second
    picture appearing beneath it. */
function boardDraw(d) {
  const svg = d && d.svg;
  if (!svg) return;
  const id = `fig:${d.id || d.of || "scene"}`;
  const key = `${id}|${d.of}|${d.note || ""}`;
  if (boardSeen.has(key)) return;      // the same scene twice is not a change
  boardSeen.add(key);

  let box = document.querySelector(`[data-figure="${CSS.escape(id)}"]`);
  const fresh = !box;
  if (fresh) {
    const empty = document.getElementById("boardEmpty");
    if (empty) empty.remove();
    box = document.createElement("div");
    box.className = "boardfigure";
    box.dataset.figure = id;
    $("boardLines").appendChild(box);
  }
  const paint = () => {
    box.innerHTML = svg;
    if (d.note) {
      // what to look at, in the same margin voice the written lines use
      const label = document.createElement("div");
      label.className = "note";
      label.textContent = d.note;
      box.appendChild(label);
    }
    box.classList.remove("fading");
    // Show the picture from ITS top, not the board's bottom. The sketch now
    // fills the board, so scrolling to the foot as a written line does would
    // put the legend (which says which curve is l) above the visible edge.
    const lines = $("boardLines");
    lines.scrollTop +=
      box.getBoundingClientRect().top - lines.getBoundingClientRect().top - 6;
  };
  if (fresh) return paint();
  // redrawing an existing grid: fade out the old scene so a curve leaving is
  // seen as leaving rather than as a flicker
  box.classList.add("fading");
  setTimeout(paint, 180);
}

/** The board shows ONLY what the tutor deliberately wrote (the `board`
    event) — the whiteboard move behind the spoken hint, typeset. Sentence
    transcription used to land here too and read as a strange half-solution;
    sentences live in the chat now, full stop. */
function boardWrite(item) {
  // {expr, note} from the server; a bare string still works
  const expr = ((typeof item === "string" ? item : item && item.expr) || "").trim();
  const note = ((typeof item === "string" ? "" : item && item.note) || "").trim();
  if (!expr || boardSeen.has(expr)) return;
  boardSeen.add(expr);
  const lines = $("boardLines");
  const empty = document.getElementById("boardEmpty");
  if (empty) empty.remove();
  const line = document.createElement("div");
  line.className = "boardline key";
  const math = document.createElement("div");
  math.append(mathify(expr).frag);
  line.appendChild(math);
  if (note) {
    // the margin scribble: why this line is here, in the tutor's shorthand
    const label = document.createElement("div");
    label.className = "note";
    label.textContent = note;
    line.appendChild(label);
  }
  lines.appendChild(line);
  lines.scrollTop = lines.scrollHeight;
}

// --- 3. playback: the tutor's audio, then tell the server we are done ------

// 50 ms of silence. Browsers only grant an <audio> element permission to play
// programmatically once it has played inside a user gesture — and play() on a
// SOURCELESS element rejects, which grants nothing. So play real (silent)
// audio during the 시작 click; every later hint then plays on its own.
const SILENCE =
  "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZ" +
  "ABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI" +
  "CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

async function unlockAudio() {
  const player = $("player");
  try {
    player.src = SILENCE;
    await player.play();
    return true;
  } catch (e) {
    return false;
  }
}

// The tutor's audio is a queue, not a single clip: a turn can be a filler
// followed by the hint, and a barge-in has to be able to throw away the part
// that has not started playing as well as the part that has.
//
// STREAMED SPEECH: one utterance now arrives as MANY small TTS frames (the
// server ships MP3 chunks while xAI is still rendering the tail), grouped by
// utterance_id and ordered by seq, the final one flagged last. Playback
// starts on the FIRST chunk via MediaSource — that is the whole point: the
// voice begins ~1.3s after synthesis starts instead of after the ~2.5s file.
// Where MediaSource cannot take mp3, chunks are collected and played whole,
// which is exactly the old behaviour.
let audioQueue = [];                     // Blobs (fallback) and stream objects
let playingUrl = null;
const ttsStreams = new Map();            // utterance_id → in-flight stream
const MSE_OK = window.MediaSource && MediaSource.isTypeSupported("audio/mpeg");

function onTts(header, bytes) {
  const id = header.utterance_id || "solo";
  // A stream begins at seq 0. A mid-stream chunk with no stream behind it is
  // the tail of an utterance a barge-in already threw away — starting playback
  // from the middle of an MP3 would be noise followed by a stall.
  if (header.seq > 0 && !ttsStreams.has(id)) return;
  if (!MSE_OK) {                         // fallback: whole-file, old behaviour
    let held = ttsStreams.get(id);
    if (!held) { held = []; ttsStreams.set(id, held); }
    held.push(bytes);
    if (header.last) {
      ttsStreams.delete(id);
      audioQueue.push(new Blob(held, { type: "audio/mpeg" }));
      if (!playingUrl) playNext();
    }
    return;
  }
  let st = ttsStreams.get(id);
  if (!st) {
    st = { id, url: null, ms: null, sb: null, chunks: [], ended: false };
    ttsStreams.set(id, st);
    audioQueue.push(st);
    if (!playingUrl) playNext();
  }
  st.chunks.push(bytes);
  if (header.last) { st.ended = true; ttsStreams.delete(id); }
  feedStream(st);
}

function feedStream(st) {
  // append exactly one pending chunk per updateend; close when drained
  if (!st.sb || st.url !== playingUrl || st.sb.updating) return;
  if (st.chunks.length) {
    st.sb.appendBuffer(st.chunks.shift());
  } else if (st.ended && st.ms.readyState === "open") {
    st.ms.endOfStream();
  }
}

function playNext() {
  const item = audioQueue.shift();
  if (!item) { playingUrl = null; return; }

  const player = $("player");
  let url;
  if (item instanceof Blob) {
    url = URL.createObjectURL(item);
  } else {                               // an in-flight stream: play as it arrives
    item.ms = new MediaSource();
    url = URL.createObjectURL(item.ms);
    item.url = url;
    item.ms.addEventListener("sourceopen", () => {
      if (playingUrl !== url) return;    // dropped before it even opened
      item.sb = item.ms.addSourceBuffer("audio/mpeg");
      item.sb.addEventListener("updateend", () => feedStream(item));
      feedStream(item);
    });
  }
  playingUrl = url;
  const done = () => {
    if (playingUrl !== url) return;      // already dropped by a barge-in
    URL.revokeObjectURL(url);
    playingUrl = null;
    if (audioQueue.length) { playNext(); return; }
    sendEvent("playback_done");          // the server reopens the mic after its tail guard
  };
  player.onended = done;
  player.onerror = done;                 // never leave the server waiting
  player.src = url;
  player.play().catch(() => {
    setStatus("자동 재생이 차단되었습니다. 페이지를 한 번 클릭한 뒤 다시 말해주세요.");
    done();
  });
}

/** The student cut in. Stop mid-word and drop everything not yet played. */
function stopSpeaking() {
  const player = $("player");
  const dropped = audioQueue.length + ttsStreams.size;
  audioQueue = [];
  ttsStreams.clear();                    // late chunks of dropped streams are ignored
  if (playingUrl) {
    URL.revokeObjectURL(playingUrl);
    playingUrl = null;
  }
  player.pause();
  // Detach the source, or the element keeps buffering what we just cancelled.
  player.removeAttribute("src");
  player.load();
  // Deliberately no playback_done: the server already knows, it told us to stop.
  addTurn("err", dropped ? `끼어들기: 재생을 멈추고 대기 중이던 ${dropped}개를 지웠어요` : "끼어들기: 재생을 멈췄어요");
}

// --- 4. the worksheet photo ------------------------------------------------
// Three ways in, because the one that fits the moment is the one that gets
// used: choosing a file, dragging it, or pasting a screenshot straight from
// the clipboard — which is how most photos actually arrive on a laptop.
async function useWorksheet(file) {
  // In camera mode the box is hidden, but Ctrl+V still reaches the document:
  // accepting a paste there would stash a photo nobody can see and nothing
  // will use (the phone answers first), which is worse than ignoring it.
  if (!uploadMode || !file || !file.type.startsWith("image/")) return;
  worksheet = new Uint8Array(await file.arrayBuffer());
  $("sheetname").textContent =
    `${file.name || "붙여넣은 이미지"} · ${Math.round(worksheet.length / 1024)} KB`;
  // Show it back: the commonest failure is not a bad model but a photo that
  // turns out to be blurred, cropped short, or of the wrong page.
  const thumb = $("thumb");
  thumb.src = URL.createObjectURL(file);
  thumb.classList.add("has");
  $("drop").classList.add("has");
  setStatus("사진을 받았습니다. 이제 힌트를 물어보세요.");
}

$("sheet").addEventListener("change", (e) => useWorksheet(e.target.files[0]));
$("drop").addEventListener("click", () => $("sheet").click());

for (const type of ["dragenter", "dragover"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.add("over");
  });
}
for (const type of ["dragleave", "drop"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.remove("over");
  });
}
$("drop").addEventListener("drop", (e) => useWorksheet(e.dataTransfer.files[0]));

document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.files) {
    if (item.type.startsWith("image/")) { useWorksheet(item); return; }
  }
});

function sendWorksheet(captureId) {
  if (!worksheet) {
    // Nothing to read HERE. In camera mode that is the normal answer, not a
    // problem: the phone is the eye and was already asked first, so say
    // nothing. In upload mode the student really does need to pick a photo.
    sendEvent("capture_failed", { capture_id: captureId });
    if (uploadMode) setStatus("문제 사진이 아직 없어요. 위에 사진을 올려 주세요.");
    return;
  }
  ws.send(encodeFrame(IMAGE_FRAME, { capture_id: captureId, format: "jpeg" }, worksheet));
}

// --- 5. the conversation ---------------------------------------------------
function scrollChat() {
  const chat = $("chat");
  chat.scrollTop = chat.scrollHeight;
}

function addTurn(kind, text) {
  const chat = $("chat");
  const div = document.createElement("div");
  if (kind === "err") {
    div.className = "sys";
    div.textContent = text;
  } else {
    div.className = `msg ${kind}`;
    div.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
    div.querySelector(".who").textContent = kind === "you" ? "나" : "튜터";
    div.querySelector(".bubble").append(mathify(text).frag);
    currentDialogue.push({ kind, text });  // this problem's transcript-so-far
  }
  // the thinking bubble stays glued to the end while it is visible
  const thinking = $("thinking");
  chat.insertBefore(div, thinking.hidden ? null : thinking);
  scrollChat();
}

function note(text) {
  const turns = $("chat").querySelectorAll(".msg:not(#thinking)");
  const last = turns[turns.length - 1];
  if (!last) return;
  const meta = document.createElement("div");
  meta.className = "note";
  meta.textContent = text;
  last.appendChild(meta);
  scrollChat();
}

$("orb").addEventListener("click", start, { once: true });

// --- 6. the water ----------------------------------------------------------
// Six bubbles, sized and paced apart so they never read as a row. Built here
// rather than in markup because the only thing that varies is numbers, and
// the CSS keyframe is already gated on prefers-reduced-motion.
for (const [size, left, seconds, delay] of
     [[14, 8, 22, 0], [8, 19, 28, 6], [20, 34, 25, 12],
      [10, 63, 30, 3], [16, 78, 21, 15], [7, 91, 26, 9]]) {
  const bubble = document.createElement("i");
  bubble.style.cssText =
    `width:${size}px;height:${size}px;left:${left}%;` +
    `animation-duration:${seconds}s;animation-delay:-${delay}s`;
  $("water").appendChild(bubble);
}
</script>
