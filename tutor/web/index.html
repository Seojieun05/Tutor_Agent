<script>
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };

const SAMPLE_RATE = 16000;
const FRAME_SAMPLES = 512;          // Silero's window at 16 kHz (32 ms)

const IMAGE_FRAME = 0x01, AUDIO_FRAME = 0x02, TTS_FRAME = 0x03;

let ws = null;
let turnState = "";                 // LISTENING | USER_SPEAKING | PROCESSING | AGENT_SPEAKING
let streamSeq = 0;
let worksheet = null;               // optional jpeg bytes for capture_request
let uploadMode = false;             // set from the server's config event

// With barge-in the mic stays open while the tutor talks, so the student can
// cut in; the server judges those frames at a higher bar. It stays shut during
// PROCESSING either way — there is nothing to interrupt while it thinks, and a
// half-turn must not survive into the answer.
let bargeIn = false;
const micOpen = () =>
  turnState === "LISTENING" ||
  turnState === "USER_SPEAKING" ||
  (bargeIn && turnState === "AGENT_SPEAKING");

const STILL = window.matchMedia("(prefers-reduced-motion: reduce)");

// --- the project's binary framing, in ~15 lines ----------------------------
function encodeFrame(type, header, payload) {
  const head = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(5 + head.length + payload.length);
  new DataView(out.buffer).setUint32(1, head.length, false);  // big endian
  out[0] = type;
  out.set(head, 5);
  out.set(payload, 5 + head.length);
  return out;
}

function decodeFrame(buffer) {
  const bytes = new Uint8Array(buffer);
  const headLen = new DataView(buffer).getUint32(1, false);
  return {
    type: bytes[0],
    header: JSON.parse(new TextDecoder().decode(bytes.subarray(5, 5 + headLen))),
    payload: bytes.subarray(5 + headLen),
  };
}

const sendEvent = (event, data = {}) => {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: "EVENT", event, data, ts: Date.now() }));
};

// --- math typesetting -------------------------------------------------------
// The server normalizes everything the tutor writes into ONE small display
// vocabulary (x² · √ log₃ f'(1) 1/5 — mathspeak.displayable). These two
// functions take that vocabulary the last mile: find the math runs inside a
// Korean sentence, translate the run to TeX, hand it to KaTeX. No KaTeX (CDN
// down, offline) → the unicode text stands as-is.
const SUBS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7",
               "₈":"8","₉":"9","ₐ":"a","ₑ":"e","ₕ":"h","ₖ":"k","ₗ":"l","ₘ":"m",
               "ₙ":"n","ₒ":"o","ₚ":"p","ₛ":"s","ₜ":"t","ₓ":"x",
               // a_{n+1}: the operators sink with the rest of the subscript
               "₊":"+","₋":"-","₌":"=","₍":"(","₎":")" };
// the server's unicode superscripts (x², x¹⁰, xⁿ), back to TeX for KaTeX
const SUP_CHARS = "⁰¹²³⁴⁵⁶⁷⁸⁹ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻ";
const SUP_ASCII = "0123456789abcdefghijklmnoprstuvwxyz";
const SUPS = Object.fromEntries([...SUP_CHARS].map((c, i) => [c, SUP_ASCII[i]]));
const SUP_RE = new RegExp("[" + SUP_CHARS + "]+", "g");
// derived from the tables above, so a character added there is understood
// everywhere: a run that breaks mid-subscript renders as half an expression
const SUB_CHARS = Object.keys(SUBS).join("");
const SUB_RE = new RegExp("[" + SUB_CHARS + "]+", "g");
const MATH_RUN = new RegExp(
  "[0-9A-Za-z+\\-=^*/().,'′²³√·_{} " + SUB_CHARS + SUP_CHARS + "]+", "g");
const MATH_SIGNAL = new RegExp(
  "[=^²³√·′]|[" + SUB_CHARS + SUP_CHARS + "]|\\w\\/\\w|[A-Za-z]['_]|"
  + "\\b(?:log|sqrt|sin|cos|tan)\\b");

function toTex(s) {
  // function names first: "log₃" has no word boundary before the subscript
  s = s.replace(/\b(log|sin|cos|tan)(?![A-Za-z])/g, "\\$1");
  s = s.replace(/√\(([^()]*)\)/g, "\\sqrt{$1}");
  s = s.replace(SUP_RE, (m) => "^{" + [...m].map(c => SUPS[c]).join("") + "}");
  // the (?!\{) keeps these off the braced groups the lines above just built:
  // re-matching "_{n+k}" would take "_{n" and leave "+k}" dangling
  s = s.replace(/\^(?!\{)([A-Za-z0-9]+)/g, "^{$1}");
  s = s.replace(SUB_RE, (m) => "_{" + [...m].map(c => SUBS[c]).join("") + "}");
  s = s.replace(/_(?!\{)([A-Za-z0-9]+)/g, "_{$1}");   // raw a_4 that slipped through
  s = s.replace(/·/g, "\\cdot ");
  s = s.replace(/(?<![}\w])(\w+)\s*\/\s*(\w+)(?![\w{])/g, "\\frac{$1}{$2}");
  return s;
}

/** text → { frag, hasMath }: math runs typeset, everything else plain text. */
function mathify(text) {
  const frag = document.createDocumentFragment();
  if (!window.katex) { frag.append(text); return { frag, hasMath: false }; }
  let last = 0, found = false;
  for (const m of text.matchAll(MATH_RUN)) {
    const run = m[0], at = m.index;
    // a run must LOOK like math, not just be latin letters in a sentence
    const core = run.trim();
    if (core.length < 2 || !MATH_SIGNAL.test(core)) continue;
    frag.append(text.slice(last, at));
    frag.append(run.slice(0, run.indexOf(core)));          // leading spaces
    const span = document.createElement("span");
    span.className = "mathrun";      // the box a too-wide formula scrolls in
    try {
      span.innerHTML = katex.renderToString(toTex(core), { throwOnError: true });
    } catch (e) {
      span.textContent = core;         // one bad run must not lose the sentence
    }
    frag.append(span);
    frag.append(run.slice(run.indexOf(core) + core.length)); // trailing spaces
    last = at + run.length;
    found = true;
  }
  frag.append(text.slice(last));
  return { frag, hasMath: found };
}

// --- 1. capture: mic → worklet → 512-sample int16 frames → server ----------
let micStream = null, audioCtx = null;

// A failed start must be retryable. This listener used to be {once:true}, so a
// dismissed microphone prompt consumed it. The guard below is what stops a
// double click opening two microphones instead.
let starting = false;

async function start() {
  if (starting || micStream) return;
  starting = true;
  try {
    await openMic();
  } finally {
    starting = false;
  }
}

async function openMic() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true,
               channelCount: 1 },
    });
  } catch (e) {
    setStatus("마이크 권한이 필요합니다 (localhost 또는 HTTPS에서 열어주세요). "
              + "허용한 뒤 다시 눌러 주세요: " + e.message);
    return;
  }

  // Ask for 16 kHz so the browser resamples for us — the server's VAD needs it.
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.sampleRate !== SAMPLE_RATE) {
    setStatus(`브라우저가 ${ctx.sampleRate} Hz를 반환했습니다. Chrome/Edge를 사용해 주세요.`);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  try {
    await ctx.audioWorklet.addModule("worklet.js");
  } catch (e) {
    setStatus("오디오 모듈을 불러오지 못했습니다. 새로고침한 뒤 다시 시도해 주세요: " + e.message);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  const capture = new AudioWorkletNode(ctx, "pcm-capture");
  ctx.createMediaStreamSource(stream).connect(capture);
  capture.port.onmessage = (e) => onSamples(e.data);
  micStream = stream;
  audioCtx = ctx;

  const speakerReady = await unlockAudio();   // must happen inside this click
  connect();

  // from here on the button is a status light, not a control, and there is
  // something running to hang up on
  const orb = $("orb");
  orb.disabled = true;
  orb.querySelector("span").textContent = "마이크 켜짐";
  orb.setAttribute("aria-label", "마이크 켜짐");
  $("hangup").hidden = false;
  setStatus(
    speakerReady
      ? "핸즈프리로 대화하세요. 튜터 목소리는 이 기기에서 나옵니다."
      : "마이크는 열렸지만 스피커가 차단되었습니다. 페이지를 한 번 클릭해 주세요."
  );
}

/** 연결 종료: let go of everything this page took, and offer to start again. */
function hangUp() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  stopSpeaking(false);        // hanging up is not barging in: say nothing
  setState("");
  const orb = $("orb");
  orb.disabled = false;
  orb.removeAttribute("data-state");
  orb.querySelector("span").textContent = "다시 연결";
  orb.setAttribute("aria-label", "다시 연결");
  $("hangup").hidden = true;
  setConn("연결 종료됨", "");
  setStatus("연결을 끊었습니다. 다시 연결을 누르면 이어서 할 수 있어요.");
}

let pending = new Float32Array(0);
function onSamples(block) {
  if (!micOpen()) return;               // muted while the tutor thinks or speaks
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const joined = new Float32Array(pending.length + block.length);
  joined.set(pending);
  joined.set(block, pending.length);
  pending = joined;

  while (pending.length >= FRAME_SAMPLES) {
    const frame = pending.subarray(0, FRAME_SAMPLES);
    pending = pending.slice(FRAME_SAMPLES);
    const pcm = new Int16Array(FRAME_SAMPLES);
    for (let i = 0; i < FRAME_SAMPLES; i++) {
      const s = Math.max(-1, Math.min(1, frame[i]));   // clamp: overflow screeches
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;        // float32 → int16 LE
    }
    ws.send(encodeFrame(AUDIO_FRAME, {
      stream_id: "browser", sample_rate: SAMPLE_RATE, bits: 16, channels: 1,
      seq: ++streamSeq, last: false,
    }, new Uint8Array(pcm.buffer)));
  }
}

// --- 2. one socket, both directions ---------------------------------------
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/browser`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => sendEvent("hello", { device_id: "browser", proto: 1, caps: ["mic", "speaker"] });
  ws.onclose = () => {
    setState("");
    setConn("연결 끊김", "down");
    setStatus("연결이 끊어졌습니다. 새로고침 해주세요.");
  };
  ws.onmessage = (e) => (typeof e.data === "string" ? onEvent(JSON.parse(e.data)) : onBinary(e.data));
}

function setConn(text, cls) {
  const conn = $("conn");
  conn.textContent = text;
  conn.className = cls || "";
}

function onEvent(msg) {
  const d = msg.data || {};
  switch (msg.event) {
    case "hello_ack":   setConn("연결됨", "ok"); setStatus("연결됐어요. 말을 시작하세요."); break;
    case "turn_state":  setState(d.state); break;
    case "config":
      bargeIn = !!d.barge_in;
      // Only an upload-mode server takes a photo from this page; with a phone
      // watching, the box would be an invitation to nowhere.
      uploadMode = d.input_mode === "upload";
      $("drop").hidden = !uploadMode;
      break;
    case "barge_in":    stopSpeaking(); break;
    case "transcript":  addTurn("you", d.text || "(인식 실패)"); break;
    case "tutor_says":  onTutorSays(d); break;
    case "tutor_stream_start": startTutorStream(d); break;
    case "tutor_stream_delta": appendTutorStream(d); break;
    case "tutor_stream_done":  finishTutorStream(d); break;
    case "board":       for (const line of d.lines || []) boardWrite(line); break;
    case "figure":      boardDraw(d); break;
    case "stage":       setStage(d.text); break;
    case "solved":      addSolved(d.text); break;
    case "problem":     showProblem(d); break;
    case "hint_issued": note(`힌트 L${d.level} · ${d.action}`); break;
    case "capture_request": sendWorksheet(d.capture_id); break;
    case "error":       addTurn("err", d.message || JSON.stringify(d)); break;
  }
}

function onBinary(buffer) {
  const { type, header, payload } = decodeFrame(buffer);
  if (type === TTS_FRAME) onTts(header, payload);
}

// ===========================================================================
// THE TUTOR AS A CHARACTER
//
// One element on a fixed layer with two homes: the conversation's header and
// the board's margin. Everything below is placement and theatre; the pipeline
// is never once made to wait for an animation — the single exception is the
// deliberate HOLD on the turn's final line, and that is bounded by a timer.
// ===========================================================================
const tutor = $("tutor");
const pose = tutor.querySelector(".pose");

// where the character's visual centre sits inside its own frame
const PF_CX = 0.5, PF_CY = 0.52;

// A fish's dart, normalised: distance covered by fraction of time. Fast off
// the mark, a long glide, and a soft stop — sampled into keyframe offsets so
// the browser interpolates a path position, not an easing someone guessed.
const SPEED = [0, .09, .22, .38, .53, .66, .77, .855, .915, .955, .98, .993, 1];

const pf = {
  state: "home",     // home | alert | toBoard | board | returning
  target: null,      // the element it is at (or flying to)
  dest: null,        // that element's centre, measured at launch
  flight: null, pulse: null,
  finishFlight: null,
  timers: [], museTimer: null,
  pos: { x: -999, y: -999 },
};

const wait = (ms, fn) => pf.timers.push(setTimeout(fn, ms));
function clearPfTimers() {
  pf.timers.forEach(clearTimeout);
  pf.timers = [];
}

const centerOf = (el) => {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
};

/** Put the character's centre on a point, now or on the CSS transition. */
function placeAt(cx, cy, deg = 0, ms = 0) {
  const w = tutor.offsetWidth, h = tutor.offsetHeight;
  tutor.style.setProperty("--fly", (STILL.matches ? 0 : ms) + "ms");
  tutor.style.transform =
    `translate3d(${(cx - w * PF_CX).toFixed(1)}px, ${(cy - h * PF_CY).toFixed(1)}px, 0) ` +
    `rotate(${deg.toFixed(1)}deg)`;
  pf.pos = { x: cx, y: cy };
}

/** Stop a flight where it is. The transform is HANDED OVER before the
 *  animation is dropped: a filled animation is layered over the inline style,
 *  so cancelling one without writing the current matrix first snaps the
 *  character back to wherever the inline style last said. */
function haltFlight() {
  if (!pf.flight) return;
  const t = getComputedStyle(tutor).transform;
  tutor.style.transform = t === "none" ? "" : t;
  // pf.pos must follow the hand-over, or the NEXT flight launches from where
  // this one started and the character teleports. The matrix is translate3d
  // then rotate, so its translation terms are the translate3d values.
  if (t && t !== "none") {
    const m = new DOMMatrixReadOnly(t);
    pf.pos = { x: m.e + tutor.offsetWidth * PF_CX, y: m.f + tutor.offsetHeight * PF_CY };
  }
  pf.flight.cancel(); pf.flight = null;
  if (pf.pulse) { pf.pulse.cancel(); pf.pulse = null; }
  pose.style.transform = "";
  pf.finishFlight = null;
  tutor.classList.remove("swimming");
}

/** Swim to an element's centre on a shallow arc, aimed along the way.
 *
 *  The path is a quadratic lifted a little above both ends ("약간 위로,
 *  그다음 가로질러"), with one gentle S laid over it — a small push
 *  perpendicular to the path, two half-waves, which is a swimming line and
 *  not a slide. The heading is the path's tangent clamped to a lean (a fish
 *  banks, it does not somersault), and it levels out to land.
 */
function swim(toEl, { ms = 680, faceRight = false, done = null } = {}) {
  haltFlight();
  const to = centerOf(toEl);
  pf.target = toEl;
  pf.dest = to;
  const from = { ...pf.pos };
  const dist = Math.hypot(to.x - from.x, to.y - from.y);
  if (STILL.matches || dist < 10) {
    placeAt(to.x, to.y, 0, 0);
    if (done) done();
    return;
  }
  const lift = Math.min(140, Math.max(50, dist * .22));
  const c = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - lift };
  const wig = dist > 240 ? 6 : 3;
  tutor.classList.add("swimming");
  tutor.classList.toggle("faceR", faceRight);
  tutor.style.setProperty("--fly", "0ms");     // the flight owns the transform now
  const w = tutor.offsetWidth, h = tutor.offsetHeight;

  const frames = SPEED.map((s, i) => {
    const u = 1 - s;
    let x = u * u * from.x + 2 * u * s * c.x + s * s * to.x;
    let y = u * u * from.y + 2 * u * s * c.y + s * s * to.y;
    const tx = 2 * u * (c.x - from.x) + 2 * s * (to.x - c.x);
    const ty = 2 * u * (c.y - from.y) + 2 * s * (to.y - c.y);
    const m = Math.hypot(tx, ty) || 1;
    const sway = Math.sin(s * Math.PI * 2) * wig;
    x += (-ty / m) * sway;
    y += (tx / m) * sway;
    let deg = Math.atan2(ty, tx) * 180 / Math.PI;
    if (!faceRight) deg -= 180;                // the art already points left
    deg = ((deg + 540) % 360) - 180;
    deg = Math.max(-24, Math.min(24, deg));
    if (i === SPEED.length - 2) deg *= .5;     // level out…
    if (i === SPEED.length - 1) deg = 0;       // …and land flat
    return {
      offset: i / (SPEED.length - 1), easing: "linear",
      transform: `translate3d(${(x - w * PF_CX).toFixed(1)}px, ` +
                 `${(y - h * PF_CY).toFixed(1)}px, 0) rotate(${deg.toFixed(1)}deg)`,
    };
  });

  pf.flight = tutor.animate(frames, { duration: ms, fill: "forwards" });
  // the launch, on its own clock: coiled, then stretched along travel
  pf.pulse = pose.animate([
    { offset: 0,   transform: "scale(1,1)" },
    { offset: .10, transform: "scale(.88,1.08)", easing: "cubic-bezier(.5,0,.8,.4)" },
    { offset: .30, transform: "scale(1.16,.9)",  easing: "cubic-bezier(.2,.8,.35,1)" },
    { offset: .62, transform: "scale(1.05,.97)" },
    { offset: 1,   transform: "scale(1,1)" },
  ], { duration: ms, fill: "forwards" });

  const finish = () => {
    pf.finishFlight = null;
    // hand the destination over BEFORE the animations are dropped
    tutor.style.transform = frames[frames.length - 1].transform;
    pose.style.transform = "";
    if (pf.flight) { pf.flight.cancel(); pf.flight = null; }
    if (pf.pulse) { pf.pulse.cancel(); pf.pulse = null; }
    tutor.classList.remove("swimming");
    // land on where the target IS, which after a mid-flight resize is not
    // where the frames were pointed
    const now = centerOf(toEl);
    placeAt(now.x, now.y, 0, 0);
    if (done) done();
  };
  pf.finishFlight = finish;
  pf.flight.onfinish = finish;
}

// --- the choreography -------------------------------------------------------

/** "어? 질문했구나!" — the student stopped talking: puff up, then go read. */
function alertThenGo() {
  // no theatre under reduced motion — and none in a hidden tab, where the
  // animations that would carry it home are frozen until the tab returns
  if (STILL.matches || document.hidden) return;
  if (pf.state === "board" || pf.state === "toBoard") return;   // already reading
  if (pf.state !== "home") {                  // caught mid-return: snap first
    settleHome(true);
  }
  clearPfTimers();
  pf.state = "alert";
  tutor.classList.add("puffed");
  spawnBangs();
  wait(500, () => {
    tutor.classList.remove("puffed");
    wait(180, () => {
      // the turn may already be over (an instant answer): stay put then
      if (turnState !== "PROCESSING" && turnState !== "AGENT_SPEAKING") {
        pf.state = "home";
        return;
      }
      pf.state = "toBoard";
      tutor.classList.remove("faceR");        // the board is to the LEFT
      swim($("boardPerch"), { ms: 740, done: () => {
        pf.state = "board";
        tutor.classList.add("pondering");
        startMuse();
      }});
    });
  });
}

/** The turn's last word is ready: freeze — eyes — hop — one proud puff —
 *  and dart home. `release` fires when it lands (or straight away when
 *  there is no trip to make); the held line and audio wait on it. */
function answerReady(release) {
  stopMuse();
  if (STILL.matches || document.hidden ||
      pf.state === "home" || pf.state === "returning") {
    if (document.hidden) settleHome(true);
    release();
    return;
  }
  clearPfTimers();
  if (pf.state === "alert") {                 // never left: just deflate and talk
    tutor.classList.remove("puffed", "stunned");
    pf.state = "home";
    release();
    return;
  }
  tutor.classList.remove("pondering");
  if (pf.state === "toBoard") haltFlight();   // caught mid-flight: aha where it is
  pf.state = "returning";
  tutor.classList.add("stunned");             // 0–150ms: dead stop, eyes wide
  pose.animate([
    { transform: "translateY(0)" },
    { transform: "translateY(-7px)", offset: .45 },
    { transform: "translateY(0)" },
  ], { duration: 200, easing: "cubic-bezier(.3,.7,.4,1)" });
  wait(150, () => {
    tutor.classList.add("puffed");            // "아!"
    wait(360, () => {
      tutor.classList.remove("puffed", "stunned");
      wait(140, () => {
        swim($("pufferHome"), { ms: 620, faceRight: true, done: () => {
          tutor.classList.remove("faceR");
          pf.state = "home";
          release();
        }});
      });
    });
  });
}

/** Back to the nest — the quiet way, for turn ends and interruptions. */
function settleHome(instant = false) {
  clearPfTimers();
  stopMuse();
  tutor.classList.remove("pondering", "puffed", "stunned");
  haltFlight();
  if (pf.state === "home") { tutor.classList.remove("faceR"); return; }
  if (instant || STILL.matches) {
    tutor.classList.remove("faceR");
    pf.state = "home";
    landHome(0);
    return;
  }
  pf.state = "returning";
  swim($("pufferHome"), { ms: 460, faceRight: true, done: () => {
    tutor.classList.remove("faceR");
    pf.state = "home";
  }});
}

function landHome(ms = 0) {
  pf.target = $("pufferHome");
  const c = centerOf(pf.target);
  placeAt(c.x, c.y, 0, ms);
}

// --- what it says without speaking -----------------------------------------
function spawnMark(cls, text, x, y, life) {
  const marks = $("pfMarks");
  const el = document.createElement("span");
  el.className = cls;
  el.textContent = text;
  el.style.setProperty("--x", x + "px");
  el.style.setProperty("--y", y + "px");
  marks.appendChild(el);
  const gone = () => el.remove();
  el.addEventListener("animationend", gone);
  setTimeout(gone, life + 400);               // backstop: a paused tab still cleans up
}

function spawnBangs() {
  if (STILL.matches) return;
  [[-34, -46, 0], [10, -60, 80], [40, -38, 160]].forEach(([x, y, delay]) =>
    setTimeout(() => spawnMark("bang", "!", x, y, 900), delay));
}

const MUSE_GLYPHS = ["?", "x", "√", "π", "+"];
function startMuse() {
  stopMuse();
  const drop = () => {
    if (pf.state !== "board" || document.hidden) return;
    const marks = $("pfMarks");
    if (marks.querySelectorAll(".mus").length >= 3) return;   // 2–4 alive, never a cloud
    const n = 1 + (Math.random() < .35 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const g = MUSE_GLYPHS[(Math.random() * MUSE_GLYPHS.length) | 0];
      const x = -58 + Math.random() * 110;
      const y = -66 + Math.random() * 34;
      spawnMark("mus", g, x, y, 2300);
    }
  };
  drop();
  pf.museTimer = setInterval(drop, 1700);
}
function stopMuse() {
  if (pf.museTimer) { clearInterval(pf.museTimer); pf.museTimer = null; }
}

// --- keeping the fish where it belongs --------------------------------------
// It is placed against live geometry, so anything that moves the geometry has
// to place it again. The ResizeObserver fires every time a chat line is
// appended, so noise is told from a real move by whether the DESTINATION has
// actually moved.
function reperch() {
  const el = pf.target && pf.target.isConnected ? pf.target : $("pufferHome");
  const now = centerOf(el);
  if (pf.flight) {
    if (pf.dest && Math.hypot(now.x - pf.dest.x, now.y - pf.dest.y) <= 1) return;
    // the world moved mid-flight: arrive at once, and let the flight's own
    // continuation run so the choreography is never left half-told
    const finish = pf.finishFlight;
    if (finish) finish();
    return;
  }
  if (Math.hypot(now.x - pf.pos.x, now.y - pf.pos.y) > 1) placeAt(now.x, now.y, 0, 0);
}

// --- the state light and the status line ------------------------------------
const STATE_WORDS = {
  LISTENING: ["듣는 중", "듣는 중"],
  USER_SPEAKING: ["말하는 중", "학생이 말하는 중"],
  PROCESSING: ["생각 중", "튜터가 생각하는 중"],
  AGENT_SPEAKING: ["말하는 중", "튜터가 말하는 중"],
};
// what the header says for each state; PROCESSING is written by the server's
// own stage events instead, which know what the pipeline is actually doing
const HEADER_WORDS = {
  "": ["대기 중", false],
  LISTENING: ["듣고 있어요", true],
  USER_SPEAKING: ["열심히 듣고 있어요", true],
  AGENT_SPEAKING: ["설명하고 있어요", true],
};

function setState(s) {
  const prev = turnState;
  if (s === prev) return;
  turnState = s;
  const [short, spoken] = STATE_WORDS[s] || ["대기", "대기 중"];
  // Everything below is a class or a text swap on nodes that already exist:
  // the first feedback after the student stops talking is a paint, not a
  // fetch. That is the whole budget.
  const chip = $("stateChip");
  chip.dataset.state = s || "";
  chip.lastElementChild.textContent = short;
  $("stateLabel").textContent = spoken;
  const orb = $("orb");
  if (orb.disabled) orb.dataset.state = s;

  if (s === "PROCESSING") {
    // the first thing on screen after the student stops talking
    setStage("문제를 살펴보고 있어요");
    alertThenGo();
  } else {
    const [word, busy] = HEADER_WORDS[s] || HEADER_WORDS[""];
    setStage(word, busy);
  }
  if (s === "LISTENING" || s === "USER_SPEAKING" || !s) {
    flushHeld();                       // an answer must never be trapped mid-hold
    closeTutorBubble();                // the turn is over: the dots come off
    settleHome();
  }
}

// The status line: the WORD is typed (a line still being written is somebody
// doing something right now), the DOTS breathe on their own clock — one at a
// time up to three, then one at a time back down.
let stageTimer = null, dotTimer = null, dotN = 1, dotDir = 1;
function setStage(text, busy = true) {
  if (!text) return;
  const el = $("stageWord");
  clearInterval(stageTimer);
  el.textContent = text;
  if (!STILL.matches && text.length > 1) {
    let shown = 0;
    const step = Math.max(1, Math.ceil(text.length / (420 / 24)));
    el.textContent = "";
    stageTimer = setInterval(() => {
      shown = Math.min(text.length, shown + step);
      el.textContent = text.slice(0, shown);
      if (shown >= text.length) clearInterval(stageTimer);
    }, 24);
  }
  setDots(busy);
}
function setDots(on) {
  const el = $("stageDots");
  if (!on) {
    if (dotTimer) { clearInterval(dotTimer); dotTimer = null; }
    el.textContent = "";
    return;
  }
  if (STILL.matches) {                  // still, not gone
    if (dotTimer) { clearInterval(dotTimer); dotTimer = null; }
    el.textContent = "...";
    return;
  }
  if (dotTimer) return;                 // already breathing
  dotN = 1; dotDir = 1;
  el.textContent = ".";
  dotTimer = setInterval(() => {
    dotN += dotDir;
    if (dotN >= 3) dotDir = -1;
    if (dotN <= 1) dotDir = 1;
    el.textContent = ".".repeat(dotN);
  }, 380);
}

// --- the problem card and the board ----------------------------------------
function showProblem(d) {
  const text = (d.text || "").trim();
  const eqs = d.equations || [];
  if (!text && !eqs.length) return;
  problemTitle = text;
  closeTutorBubble();                  // a new problem is a new conversation
  currentDialogue = [];                // a new problem starts a fresh transcript
  const pt = $("problemText");
  pt.textContent = "";
  pt.append(mathify(text).frag);
  const box = $("problemEqs");
  box.textContent = "";
  // the server sends only equations the statement does NOT already spell out
  for (const eq of eqs) {
    const line = document.createElement("div");
    line.append(mathify(eq).frag);
    box.appendChild(line);
  }
  $("problemCard").hidden = false;
  boardClear();                          // a new problem starts a clean board
}

// --- the solved-problems archive -------------------------------------------
// The PANEL is on hold, so nothing is drawn. What is kept is the transcript it
// will be built from: the conversation since the last problem event.
let currentDialogue = [];              // {kind, text} since the last problem event
let problemTitle = "";

function addSolved(title) {
  console.info("solved: %s (%d turns)", title || problemTitle, currentDialogue.length);
  currentDialogue = [];
}

let boardSeen = new Set();             // one problem's writing, no duplicates

function boardClear() {
  boardSeen = new Set();
  const lines = $("boardLines");
  lines.textContent = "";
  const empty = document.createElement("div");
  empty.id = "boardEmpty";
  const invite = document.createElement("b");
  invite.textContent = "같이 풀어 볼까요?";
  empty.append(invite, "문제를 보여 주면 여기에 하나씩 짚어 가며 적을게요.");
  lines.appendChild(empty);
}

/** ONE grid per problem, replaced in place. The server re-declares the whole
    scene each turn — a curve that has served its purpose is simply absent
    from the next one — so the picture must CHANGE rather than a second
    picture appearing beneath it. */
function boardDraw(d) {
  const svg = d && d.svg;
  if (!svg) return;
  const id = `fig:${d.id || d.of || "scene"}`;
  // The view revision is part of the key. Keying on the zoom VALUE dropped
  // every revisited window — widen then narrow back, and the render at the
  // old zoom collided with the first time it was seen and was thrown away.
  const key = `${id}|${d.of}|${d.note || ""}|${d.v || 0}`;
  if (boardSeen.has(key)) return;      // the same scene twice is not a change
  boardSeen.add(key);

  let box = document.querySelector(`[data-figure="${CSS.escape(id)}"]`);
  const fresh = !box;
  if (fresh) {
    const empty = document.getElementById("boardEmpty");
    if (empty) empty.remove();
    box = document.createElement("div");
    box.className = "boardfigure";
    box.dataset.figure = id;
    // The window controls, OUTSIDE the part a redraw repaints — the same
    // buttons keep keyboard focus across every redraw they cause. The server
    // owns the window (it has the samples); these only ask.
    const zoom = document.createElement("div");
    zoom.className = "figzoom";
    for (const [glyph, act, label] of [
      ["−", () => sendEvent("figure_zoom", { dir: +1 }), "그래프 범위 넓히기"],
      ["+", () => sendEvent("figure_zoom", { dir: -1 }), "그래프 범위 좁히기"],
      ["⟳", () => sendEvent("figure_reset"), "그래프 창 되돌리기"],
    ]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = glyph;
      b.setAttribute("aria-label", label);
      b.title = label;
      b.addEventListener("click", act);
      zoom.appendChild(b);
    }
    const body = document.createElement("div");
    body.className = "figbody";
    box.append(zoom, body);
    figureControls(box, body);
    $("boardLines").appendChild(box);
  }
  const body = box.querySelector(".figbody");
  const paint = () => {
    body.innerHTML = svg;
    if (d.note) {
      // what to look at, in the same margin voice the written lines use
      const label = document.createElement("div");
      label.className = "note";
      label.textContent = d.note;
      body.appendChild(label);
    }
    box.classList.remove("fading");
    // Show the picture from ITS top, not the board's bottom. The sketch
    // fills the board, so scrolling to the foot as a written line does would
    // put the legend (which says which curve is which) above the visible edge.
    const lines = $("boardLines");
    lines.scrollTop +=
      box.getBoundingClientRect().top - lines.getBoundingClientRect().top - 6;
    if (fresh) lay(box);
  };
  if (fresh) return paint();
  // redrawing an existing grid: fade out the old scene so a curve leaving is
  // seen as leaving rather than as a flicker
  box.classList.add("fading");
  setTimeout(paint, 180);
}

/** The figure's own hands: drag to pan, keys to steer.
 *
 *  The buttons cover a mouse at rest; these cover everyone else — a finger,
 *  a trackpad drag, and the keyboard, which is also what makes the sketch
 *  reachable at all without a pointer. The page never does the arithmetic:
 *  it reports the gesture as fractions of the picture and the server, which
 *  owns the samples, moves the window and sends the true render back. The
 *  drag previews locally so the hand feels the picture move at once.
 */
function figureControls(box, body) {
  box.tabIndex = 0;
  box.setAttribute("role", "group");
  box.setAttribute("aria-label",
    "함수 그래프. 화살표 키로 이동, +와 -로 범위, 0으로 되돌리기. 마우스로 끌 수 있어요.");

  box.addEventListener("keydown", (e) => {
    const pan = { ArrowLeft: [-.2, 0], ArrowRight: [.2, 0],
                  ArrowUp: [0, -.2], ArrowDown: [0, .2] }[e.key];
    if (pan) { sendEvent("figure_pan", { dx: pan[0], dy: pan[1] }); }
    else if (e.key === "-" || e.key === "_") sendEvent("figure_zoom", { dir: +1 });
    else if (e.key === "+" || e.key === "=") sendEvent("figure_zoom", { dir: -1 });
    else if (e.key === "0" || e.key === "Home") sendEvent("figure_reset");
    else return;
    e.preventDefault();
  });

  let drag = null;
  box.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest(".figzoom")) return;
    const svg = body.querySelector("svg");
    if (!svg) return;
    drag = { x: e.clientX, y: e.clientY, box: svg.getBoundingClientRect() };
    // a pen lifted in the same instant has no pointer left to capture, and
    // losing the capture only means the drag ends at the figure's edge
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return;
    // the preview: the picture follows the hand until the real render lands
    body.style.transform =
      `translate(${e.clientX - drag.x}px, ${e.clientY - drag.y}px)`;
  });
  const drop = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    const r = drag.box;
    drag = null;
    body.style.transform = "";
    // dragging the picture right means asking for the plane to its LEFT
    if (Math.hypot(dx, dy) >= 4 && r.width && r.height) {
      sendEvent("figure_pan", {
        dx: +(-dx / r.width).toFixed(3),
        dy: +(-dy / r.height).toFixed(3),
      });
    }
  };
  box.addEventListener("pointerup", drop);
  box.addEventListener("pointercancel", () => { drag = null; body.style.transform = ""; });
}

/** Uncover a line left to right, a beat after the one above it.
 *
 *  The fish reads; the board writes itself in its wake. Lines that arrive
 *  together (one turn's board event) cascade LAY_STEP apart, and nothing the
 *  tutor wrote waits longer than LAY_LATEST to start being readable. A line
 *  that arrives on its own — a figure drawn seconds into the answer — starts
 *  its own burst. Nothing about the TEXT waits on any of this: it is in the
 *  document either way, and the mask's own resting position is fully visible.
 */
const LAY_STEP = 130;
const LAY_LATEST = 620;
let layTimers = [];
let burstAt = 0, layFloor = 0;

function lay(line) {
  if (STILL.matches) return;             // no wipe: the line is plain and visible
  const now = performance.now();
  if (now - burstAt > 900) { burstAt = now; layFloor = -90; }  // first waits 40ms
  layFloor = Math.min(LAY_LATEST, layFloor + LAY_STEP);
  const delay = Math.max(0, layFloor);
  line.classList.add("laying");
  // Restarted in place first: an animation declared by a class that was added
  // during a forced layout has been seen adopting the document's start time
  // rather than its own, which finishes the wipe before the line is painted.
  line.style.animation = "none";
  void line.getBoundingClientRect();
  line.style.animation = "";
  line.style.setProperty("--lay", ".46s");
  line.style.animationDelay = `0s, ${delay.toFixed(0)}ms`;
  // And the mask comes off when it has done its work, so a lesson's worth of
  // steps is not left on a lesson's worth of composited layers. The timer is
  // the backstop, because a backgrounded tab pauses the animation and
  // animationend would then never come.
  // By NAME: `.laying` declares two animations and the other, `inked 0s`,
  // finishes inside the frame it starts in — a bare animationend listener
  // took the mask off before the wipe had begun.
  const done = () => line.classList.add("dry");
  line.addEventListener("animationend", (e) => {
    if (e.animationName === "laydown") done();
  });
  layTimers.push(setTimeout(done, delay + 1200));
}

/** Whatever is mid-wipe is simply shown. For the moments no wipe may be
 *  trusted to finish: a backgrounded tab, a motion-preference flip, a stop. */
function dryBoard() {
  layTimers.forEach(clearTimeout);
  layTimers = [];
  for (const el of document.querySelectorAll(".laying:not(.dry)"))
    el.classList.add("dry");
}

/** The board shows ONLY what the tutor deliberately wrote (the `board`
    event) — the whiteboard move behind the spoken hint, typeset. Sentences
    live in the chat, full stop. */
function boardWrite(item) {
  // {expr, note} from the server; a bare string still works
  const expr = ((typeof item === "string" ? item : item && item.expr) || "").trim();
  const note = ((typeof item === "string" ? "" : item && item.note) || "").trim();
  if (!expr || boardSeen.has(expr)) return;
  boardSeen.add(expr);
  const lines = $("boardLines");
  const empty = document.getElementById("boardEmpty");
  if (empty) empty.remove();
  const line = document.createElement("div");
  line.className = "boardline key";
  const math = document.createElement("div");
  math.append(mathify(expr).frag);
  line.appendChild(math);
  if (note) {
    // the margin scribble: why this line is here, in the tutor's shorthand
    const label = document.createElement("div");
    label.className = "note";
    label.textContent = note;
    line.appendChild(label);
  }
  lines.appendChild(line);
  lines.scrollTop = lines.scrollHeight;
  lay(line);
}

// --- 3. playback: the tutor's audio, then tell the server we are done ------

// 50 ms of silence. Browsers only grant an <audio> element permission to play
// programmatically once it has played inside a user gesture — and play() on a
// SOURCELESS element rejects, which grants nothing. So play real (silent)
// audio during the 시작 click; every later hint then plays on its own.
const SILENCE =
  "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZ" +
  "ABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI" +
  "CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

async function unlockAudio() {
  const player = $("player");
  try {
    player.src = SILENCE;
    await player.play();
    return true;
  } catch (e) {
    return false;
  }
}

// The tutor's audio is a queue, not a single clip: a turn can be a filler
// followed by the hint, and a barge-in has to be able to throw away the part
// that has not started playing as well as the part that has.
//
// STREAMED SPEECH: one utterance arrives as MANY small TTS frames (the server
// ships MP3 chunks while xAI is still rendering the tail), grouped by
// utterance_id and ordered by seq, the final one flagged last. Playback
// starts on the FIRST chunk via MediaSource. Where MediaSource cannot take
// mp3, chunks are collected and played whole.
//
// `audioHold` is the choreography's ONE finger on this queue: while the fish
// is carrying the final answer home, nothing starts playing. It is set only
// alongside a heldSay, and every path that clears one clears the other —
// bounded by the hold timer, so audio can be delayed at most ~1.9 s and
// never lost.
let audioQueue = [];                     // Blobs (fallback) and stream objects
let playingUrl = null;
let audioHold = false;
const ttsStreams = new Map();            // utterance_id → in-flight stream
const MSE_OK = window.MediaSource && MediaSource.isTypeSupported("audio/mpeg");

function onTts(header, bytes) {
  const id = header.utterance_id || "solo";
  // A stream begins at seq 0. A mid-stream chunk with no stream behind it is
  // the tail of an utterance a barge-in already threw away — starting playback
  // from the middle of an MP3 would be noise followed by a stall.
  if (header.seq > 0 && !ttsStreams.has(id)) return;
  if (!MSE_OK) {                         // fallback: whole-file, old behaviour
    let held = ttsStreams.get(id);
    if (!held) { held = []; ttsStreams.set(id, held); }
    held.push(bytes);
    if (header.last) {
      ttsStreams.delete(id);
      audioQueue.push(new Blob(held, { type: "audio/mpeg" }));
      if (!playingUrl) playNext();
    }
    return;
  }
  let st = ttsStreams.get(id);
  if (!st) {
    st = { id, url: null, ms: null, sb: null, chunks: [], ended: false };
    ttsStreams.set(id, st);
    audioQueue.push(st);
    if (!playingUrl) playNext();
  }
  st.chunks.push(bytes);
  if (header.last) { st.ended = true; ttsStreams.delete(id); }
  feedStream(st);
}

function feedStream(st) {
  // append exactly one pending chunk per updateend; close when drained
  if (!st.sb || st.url !== playingUrl || st.sb.updating) return;
  if (st.chunks.length) {
    st.sb.appendBuffer(st.chunks.shift());
  } else if (st.ended && st.ms.readyState === "open") {
    st.ms.endOfStream();
  }
}

function playNext() {
  if (audioHold) return;                 // the fish is carrying this one home
  const item = audioQueue.shift();
  if (!item) { playingUrl = null; return; }

  const player = $("player");
  let url;
  if (item instanceof Blob) {
    url = URL.createObjectURL(item);
  } else {                               // an in-flight stream: play as it arrives
    item.ms = new MediaSource();
    url = URL.createObjectURL(item.ms);
    item.url = url;
    item.ms.addEventListener("sourceopen", () => {
      if (playingUrl !== url) return;    // dropped before it even opened
      item.sb = item.ms.addSourceBuffer("audio/mpeg");
      item.sb.addEventListener("updateend", () => feedStream(item));
      feedStream(item);
    });
  }
  playingUrl = url;
  const done = () => {
    if (playingUrl !== url) return;      // already dropped by a barge-in
    URL.revokeObjectURL(url);
    playingUrl = null;
    if (audioQueue.length && !audioHold) { playNext(); return; }
    // The utterance that just ended is acknowledged even under a hold: the
    // server's _say is sequential, so what it is waiting for is THIS line.
    // A held queue is started by flushHeld when the fish lands.
    if (!audioQueue.length)
      sendEvent("playback_done");        // the server reopens the mic after its tail guard
  };
  player.onended = done;
  player.onerror = done;                 // never leave the server waiting
  player.src = url;
  player.play().catch(() => {
    setStatus("자동 재생이 차단되었습니다. 페이지를 한 번 클릭한 뒤 다시 말해주세요.");
    done();
  });
}

// --- the held final line ----------------------------------------------------
// The turn's last word comes home in the fish's mouth: the text and its audio
// wait for the landing, so the answer is spoken from the conversation and not
// from halfway across the page. Bounded hard — a flight that never lands
// (a hidden tab, a resize storm) costs at most HELD_MS, never the answer.
const HELD_MS = 1900;
let heldSay = null, heldTimer = null;

function onTutorSays(d) {
  const away = pf.state === "board" || pf.state === "toBoard" || pf.state === "alert";
  if (d.final && !STILL.matches && away && !heldSay) {
    heldSay = d;
    audioHold = true;
    heldTimer = setTimeout(flushHeld, HELD_MS);
    answerReady(flushHeld);
    return;
  }
  addTurn("tutor", d.text, { final: !!d.final });
}

function flushHeld() {
  if (heldTimer) { clearTimeout(heldTimer); heldTimer = null; }
  const held = heldSay;
  heldSay = null;
  if (held) addTurn("tutor", held.text, { final: true });
  if (audioHold) {
    audioHold = false;
    if (!playingUrl) playNext();
  }
}

/** The student cut in. Stop mid-word and drop everything not yet played.
    `announce` is false when the page itself is stopping (연결 종료), because
    "끼어들기" is a report about the student and they did not do it. */
function stopSpeaking(announce = true) {
  // whatever was being carried home is shown, silently — the words were said
  // to be coming, and a barge-in must not disappear them from the record
  if (heldTimer) { clearTimeout(heldTimer); heldTimer = null; }
  audioHold = false;
  if (heldSay) { addTurn("tutor", heldSay.text, { final: true }); heldSay = null; }
  closeTutorBubble();                    // an interrupted turn is over too
  const player = $("player");
  const dropped = audioQueue.length + ttsStreams.size;
  audioQueue = [];
  ttsStreams.clear();                    // late chunks of dropped streams are ignored
  if (playingUrl) {
    URL.revokeObjectURL(playingUrl);
    playingUrl = null;
  }
  player.pause();
  // Detach the source, or the element keeps buffering what we just cancelled.
  player.removeAttribute("src");
  player.load();
  reveal.finish();                       // a line nobody is hearing is not still arriving
  // Keep the safe prefix that was actually shown, but detach it from the live
  // stream so late deltas/done after a barge-in cannot finish the sentence.
  for (const st of tutorStreams.values()) {
    st.div.classList.remove("typing");
    if (st.text) currentDialogue.push({ kind: "tutor", text: st.text });
  }
  tutorStreams.clear();
  dryBoard();
  settleHome();
  // Deliberately no playback_done: the server already knows, it told us to stop.
  if (announce)
    addTurn("err", dropped ? `끼어들기: 재생을 멈추고 대기 중이던 ${dropped}개를 지웠어요` : "끼어들기: 재생을 멈췄어요");
}

// --- 4. the worksheet photo ------------------------------------------------
// Three ways in, because the one that fits the moment is the one that gets
// used: choosing a file, dragging it, or pasting a screenshot straight from
// the clipboard — which is how most photos actually arrive on a laptop.
async function useWorksheet(file) {
  // In camera mode the box is hidden, but Ctrl+V still reaches the document:
  // accepting a paste there would stash a photo nobody can see and nothing
  // will use (the phone answers first), which is worse than ignoring it.
  if (!uploadMode || !file || !file.type.startsWith("image/")) return;
  worksheet = new Uint8Array(await file.arrayBuffer());
  $("sheetname").textContent =
    `${file.name || "붙여넣은 이미지"} · ${Math.round(worksheet.length / 1024)} KB`;
  // Show it back: the commonest failure is not a bad model but a photo that
  // turns out to be blurred, cropped short, or of the wrong page.
  const thumb = $("thumb");
  thumb.src = URL.createObjectURL(file);
  thumb.classList.add("has");
  $("drop").classList.add("has");
  setStatus("사진을 받았습니다. 이제 힌트를 물어보세요.");
}

$("sheet").addEventListener("change", (e) => useWorksheet(e.target.files[0]));
$("drop").addEventListener("click", () => $("sheet").click());
// It advertises itself as a button and takes tab focus, so Enter and Space
// have to work: a div with role="button" gets no synthesised click.
$("drop").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("sheet").click(); }
});

for (const type of ["dragenter", "dragover"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.add("over");
  });
}
for (const type of ["dragleave", "drop"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.remove("over");
  });
}
$("drop").addEventListener("drop", (e) => useWorksheet(e.dataTransfer.files[0]));

document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.files) {
    if (item.type.startsWith("image/")) { useWorksheet(item); return; }
  }
});

function sendWorksheet(captureId) {
  if (!worksheet) {
    // Nothing to read HERE. In camera mode that is the normal answer, not a
    // problem: the phone is the eye and was already asked first, so say
    // nothing. In upload mode the student really does need to pick a photo.
    sendEvent("capture_failed", { capture_id: captureId });
    if (uploadMode) setStatus("문제 사진이 아직 없어요. 위에 사진을 올려 주세요.");
    return;
  }
  ws.send(encodeFrame(IMAGE_FRAME, { capture_id: captureId, format: "jpeg" }, worksheet));
}

// --- 5. the conversation ---------------------------------------------------
function scrollChat() {
  const chat = $("chat");
  chat.scrollTop = chat.scrollHeight;
}

// The tutor's line is REVEALED, not posted. The server sends the whole
// sentence in one tutor_says (it has to: the same text is being spoken, and
// the TTS wants it whole), so this is the page's own doing — reading speed
// out of a string that is already here. The alternative is a bubble that
// appears fully formed after a silence, which reads as a stall even when the
// audio started at the same instant.
//
// Prose is typed; a formula appears whole, because half a typeset equation is
// worse than no equation. Nothing here can lose a message: the text is in the
// DOM within one tick either way, and finish() puts the rest in at once.
const reveal = {
  timer: null, parts: null, node: null, msg: null, i: 0, at: 0,

  start(msg, bubble, frag) {
    this.finish();
    const parts = [...frag.childNodes];
    if (STILL.matches || !parts.length) { bubble.append(...parts); return; }
    Object.assign(this, { parts, node: bubble, msg, i: 0, at: 0 });
    msg.classList.add("typing");
    // Fast enough never to be the thing anyone is waiting for: this is a
    // reading cue, not a typewriter impression. A ninety-character hint lands
    // in about a second, and nothing takes longer than 1.1 s however long it
    // is — the voice is saying the same words at the same time, and the eye
    // must not fall behind the ear.
    const chars = parts.reduce((n, p) => n + (p.nodeType === 3 ? p.length : 8), 0);
    const ms = Math.min(1100, Math.max(260, chars * 13));
    const step = Math.max(1, Math.ceil(chars / (ms / 24)));
    this.timer = setInterval(() => this.tick(step), 24);
  },

  tick(step) {
    let budget = step;
    while (budget > 0 && this.i < this.parts.length) {
      const part = this.parts[this.i];
      if (part.nodeType !== 3) {         // a typeset formula: whole, or not at all
        this.node.appendChild(part);
        this.i++; this.at = 0; budget -= 8;
        continue;
      }
      const text = part.textContent;
      const take = Math.min(budget, text.length - this.at);
      const end = this.at + take;
      if (!this.at) this.node.appendChild(document.createTextNode(""));
      this.node.lastChild.textContent = text.slice(0, end);
      budget -= take;
      this.at = end;
      if (end >= text.length) { this.i++; this.at = 0; }
    }
    scrollChat();
    if (this.i >= this.parts.length) this.finish();
  },

  finish() {
    if (!this.timer) return;
    clearInterval(this.timer);
    this.timer = null;
    // whatever is left goes in at once, in order
    for (let k = this.i; k < this.parts.length; k++) {
      const part = this.parts[k];
      if (k === this.i && part.nodeType === 3 && this.at) {
        this.node.lastChild.textContent = part.textContent;
      } else {
        this.node.appendChild(part);
      }
    }
    this.msg.classList.remove("typing");
    this.parts = null; this.node = null; this.msg = null;
    // fire-and-clear: the segment's continuation (re-hang the waiting dots,
    // or close the turn's bubble) runs once, after the words are all in
    const done = this.onDone;
    this.onDone = null;
    if (done) done();
    scrollChat();
  },
};

// ONE tutor bubble per student turn. The filler opens it, every later line of
// the turn appends into the same bubble, and the blinking dots at its end say
// "still coming" — so one student question reads as ONE tutor answer instead
// of a stack of fragments.
let openTutor = null;                    // {msg, bubble} of the turn's bubble

function dropDots() {
  for (const el of document.querySelectorAll("#chat .more")) el.remove();
}
function holdDots() {
  if (!openTutor || !openTutor.msg.isConnected) return;
  dropDots();
  const more = document.createElement("span");
  more.className = "more";
  more.innerHTML = "<i>.</i><i>.</i><i>.</i>";
  openTutor.bubble.appendChild(more);
}
function closeTutorBubble() {
  dropDots();
  openTutor = null;
}

function addTurn(kind, text, opts = {}) {
  const chat = $("chat");
  if (kind !== "tutor") closeTutorBubble();   // the turn is over either way
  const after = opts.final ? closeTutorBubble : holdDots;
  if (kind === "tutor" && openTutor && openTutor.msg.isConnected) {
    // the turn's next line lands in the SAME bubble
    currentDialogue.push({ kind, text });
    const { msg, bubble } = openTutor;
    reveal.finish();                     // flush whatever is still typing
    dropDots();
    bubble.appendChild(document.createTextNode("\n"));
    reveal.start(msg, bubble, mathify(text).frag);
    if (STILL.matches) after(); else reveal.onDone = after;
    scrollChat();
    return;
  }
  const div = document.createElement("div");
  if (kind === "err") {
    div.className = "sys";
    div.textContent = text;
  } else {
    div.className = `msg ${kind}`;
    div.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
    div.querySelector(".who").textContent = kind === "you" ? "나" : "튜터";
    currentDialogue.push({ kind, text });  // this problem's transcript-so-far
  }
  chat.appendChild(div);
  if (kind === "tutor") {
    openTutor = { msg: div, bubble: div.querySelector(".bubble") };
    reveal.start(div, div.querySelector(".bubble"), mathify(text).frag);
    if (STILL.matches) after(); else reveal.onDone = after;
  } else if (kind === "you") {
    div.querySelector(".bubble").append(mathify(text).frag);
  }
  scrollChat();
}

// Real model streaming. Unlike `reveal`, these words did not exist on the
// server beforehand: each delta crossed the rolling answer-leak guard first.
// Keep prose plain while incomplete (half a formula must not be typeset), then
// replace it once with the fully validated/math-normalized line on done.
const tutorStreams = new Map();

function startTutorStream(d) {
  reveal.finish();
  dropDots();
  let div, bubble;
  if (openTutor && openTutor.msg.isConnected) {
    // the live-streamed line continues the turn's ONE bubble
    ({ msg: div, bubble } = openTutor);
    bubble.appendChild(document.createTextNode("\n"));
  } else {
    div = document.createElement("div");
    div.className = "msg tutor";
    div.innerHTML = `<div class="who">튜터</div><div class="bubble"></div>`;
    $("chat").appendChild(div);
    bubble = div.querySelector(".bubble");
    openTutor = { msg: div, bubble };
  }
  div.classList.add("typing");
  // the stream owns a SEGMENT, never the bubble: rewriting the whole bubble
  // per delta would erase the filler that opened it
  const seg = document.createElement("span");
  bubble.appendChild(seg);
  tutorStreams.set(d.stream_id, { div, seg, text: "" });
  scrollChat();
}

function appendTutorStream(d) {
  const st = tutorStreams.get(d.stream_id);
  if (!st) return;                       // tail of a cancelled/barge-in stream
  st.text += d.text || "";
  st.seg.textContent = st.text;
  scrollChat();
}

function finishTutorStream(d) {
  const st = tutorStreams.get(d.stream_id);
  if (!st) return;
  const text = d.text || st.text;
  st.text = text;
  st.seg.replaceChildren(mathify(text).frag);
  st.div.classList.remove("typing");
  currentDialogue.push({ kind: "tutor", text });
  tutorStreams.delete(d.stream_id);
  // a streamed line is the turn's generated answer: the bubble is complete
  closeTutorBubble();
  scrollChat();
}

function note(text) {
  const turns = $("chat").querySelectorAll(".msg");
  const last = turns[turns.length - 1];
  if (!last) return;
  const meta = document.createElement("div");
  meta.className = "note";
  meta.textContent = text;
  last.appendChild(meta);
  scrollChat();
}

// NOT {once:true}: a denied microphone prompt would consume the listener and
// leave an enabled button wired to nothing. start() guards itself instead, and
// the button is disabled for the whole time a session is actually running.
$("orb").addEventListener("click", start);
$("hangup").addEventListener("click", hangUp);

// --- 6. the water ----------------------------------------------------------
// Bubbles: few, bright, paced apart so they never read as a row. Motes: many,
// faint, on much longer clocks — the dust that makes water look like water.
// Built here because the only thing that varies is numbers, and the keyframes
// are already gated on prefers-reduced-motion.
for (const [size, left, seconds, delay] of
     [[13, 5, 24, 0], [7, 12, 30, 7], [18, 21, 26, 13], [9, 30, 33, 4],
      [11, 70, 28, 18], [16, 81, 23, 9], [7, 88, 31, 2], [12, 95, 27, 15]]) {
  const bubble = document.createElement("i");
  bubble.style.cssText =
    `width:${size}px;height:${size}px;left:${left}%;` +
    `animation-duration:${seconds}s;animation-delay:-${delay}s`;
  document.querySelector(".bubbles").appendChild(bubble);
}
for (const [size, left, seconds, delay] of
     [[3, 8, 52, 3], [2, 16, 61, 21], [3.5, 26, 47, 9], [2, 38, 66, 31],
      [2.5, 47, 55, 14], [3, 58, 49, 26], [2, 66, 63, 5], [3.5, 76, 51, 18],
      [2, 84, 58, 38], [3, 92, 46, 11], [2.5, 55, 68, 44], [2, 33, 57, 50]]) {
  const mote = document.createElement("i");
  mote.style.cssText =
    `width:${size}px;height:${size}px;left:${left}%;` +
    `animation-duration:${seconds}s;animation-delay:-${delay}s`;
  document.querySelector(".motes").appendChild(mote);
}

// --- 7. keeping the fish where it belongs ----------------------------------
landHome(0);
// A backgrounded tab pauses CSS animations while the mask hiding a line stays
// exactly where it is, and a motion-preference flip mid-flight leaves the
// character somewhere no rule owns. Both land the same way — show everything,
// go home, release anything held.
addEventListener("visibilitychange", () => {
  if (!document.hidden) return;
  dryBoard();
  flushHeld();
  settleHome(true);
});
STILL.addEventListener("change", () => { dryBoard(); flushHeld(); settleHome(true); });
addEventListener("resize", reperch);
new ResizeObserver(reperch).observe($("chatPanel"));
// the panels are inside a scrolling page under 1000px
addEventListener("scroll", reperch, { passive: true });
</script>
</body>
</html>
