<!doctype html>
<!--
  Hands-free browser client for the Visual Socratic Tutor.

  The laptop only captures and plays; the VAD, STT, tutor pipeline and TTS all
  run on the server (that is the point of this page: over SSH the server has no
  microphone and nobody is listening to its speaker).

    IN:  getUserMedia → AudioWorklet → float32 @16 kHz → int16 → 512-sample
         frames → binary AUDIO frames on ONE WebSocket (the same framing the
         camera device uses, so the server code is unchanged)
    OUT: turn_state / transcript / tutor_says / problem events + TTS_AUDIO
         frames with the tutor's speech → <audio> → "playback_done" back

  Barge-in: the mic stays open while the tutor speaks so the student can cut
  in. What keeps the tutor from hearing itself is echoCancellation in
  getUserMedia — the browser subtracts what it is playing from what it hears —
  plus a higher onset bar on the server for those frames. Without working AEC
  (an external speaker, a bad driver) the tutor will interrupt itself; that is
  what BARGE_IN=0 is for.

  The mic still shuts during PROCESSING: there is nothing to interrupt while it
  thinks, and a half-turn must not survive into the answer.

  Chrome/Edge recommended (AudioWorklet at a 16 kHz AudioContext).

  DESIGN. This page is answering a latency problem, not a decoration one. A
  hint costs the pipeline several seconds — vision, retrieval, solver, policy,
  TTS — and none of that can be hurried from here. What CAN be changed is how
  long it FEELS, and the whole interface is built around three ideas:

    1. Something moves within one frame of the student finishing. Every state
       change is a class toggle on nodes that already exist, so the first
       feedback is a paint, not a fetch: no image is loaded, no element is
       created, nothing is measured. Measured at 5 ms from event to painted
       frame; the budget was 200.
    2. The waiting is narrated by a CHARACTER, not a spinner. The squid is one
       element on a fixed layer that flies between two anchors — the
       conversation's header, where it lives, and the board, where it writes —
       so "it has gone to write something" is a thing you watch happen rather
       than a thing that appears. It swims while the pipeline works and the
       maths it is chewing on drifts around it.
    3. The answer arrives as it is read, not when it is finished. The server
       sends one tutor_says with the whole line; the page reveals it at reading
       speed, with the formulas popping in whole because a half-typeset
       equation is worse than no equation.

  Everything the tutor writes is typeset (KaTeX) on the BOARD, which takes
  about three quarters of the width; the CONVERSATION takes the rest, with its
  own header and the voice controls pinned at its foot. Underneath is one
  undersea scene in three planes (a blurred seabed far off, light, caustics and
  bubbles in the middle, the reef in focus at the front), all drawn in this
  file: no external images, nothing hotlinked, nothing whose licence anyone has
  to take on trust.

  Surfaces are opaque and lit from above rather than frosted; radius is a
  hierarchy (panel 24, card 16, bubble 14, button 12, chip full) so a bubble
  never reads as a panel. Every control on this page is wired to something
  real; there are deliberately no decorative buttons.

  Both colour schemes are the same water at different depths: the surface in
  light mode, the deep in dark. Every colour is a token, including the four the
  server names when it draws a curve (--accent-deep, --err, --dim, --line in
  tutor/hints/plot.py), and each one used as ink was picked against the surface
  it actually sits on rather than by eye.

  THE TUTOR'S TWO IMAGES. squid.webp (still) and squid-thinking.webp (the
  tumbling loop) are cut from one clip under one crop, so swapping between them
  never moves the character. The clip we were handed was VP9-with-alpha whose
  RGB is premultiplied by alpha; a browser composites it as straight alpha,
  multiplies by alpha a second time, and draws a grey outline round the
  character. Repairing that per frame at runtime measured 5.6 ms of main thread
  per frame at 208x210 — during PROCESSING, the one moment this page must not
  stutter — so it is baked into the asset instead: a browser is the only
  VP9-with-alpha decoder to hand, so the frames were decoded there, divided
  back through their own alpha, cropped as ONE box (the tumble is the
  animation; cropping each frame to its subject would pin the character still)
  and written out as an animated WebP.

  MATH: the server sends one normalized display vocabulary (x², ·, √, log₃,
  1/5 — see tutor/speech/mathspeak.py displayable()). This page converts that
  small alphabet to TeX and typesets it with KaTeX. If the KaTeX CDN cannot be
  reached, everything falls back to the plain unicode text, which is exactly
  what the page showed before KaTeX existed.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Socratic Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<!-- the thinking loop must be decoded BEFORE the first time it is wanted, or
     the one frame this page cannot afford to be slow is the one that waits on
     a 573 KB image -->
<link rel="preload" as="image" href="squid-thinking.webp">
<style>
  /* ===================================================================
     TOKENS. Colour, radius and shadow live here and nowhere else; four of
     the colour names are also the server's, because tutor/hints/plot.py
     writes var(--accent-deep), var(--err), var(--dim) and var(--line) into
     the figures it draws. Anything used as TEXT is picked for contrast on
     the panel, not for prettiness: the water is pale and a pale ink on it
     is unreadable, whatever the reference does at poster size.
     =================================================================== */
  :root {
    /* the water, top to floor */
    --sea-top:#ddf3ff; --sea-mid:#b6e4f5; --sea-bottom:#8fd3ea;
    --sea-deep:#43a9c6;
    /* the clay palette. Only what the interface itself uses lives here; the
       reef's own creams, mints and lilacs are gradient stops inside its SVG,
       where they belong, rather than tokens nothing references. */
    --coral:#f3a6a8; --peach:#ffd0a6;
    /* surfaces */
    --panel:rgba(248,253,255,.94); --panel-solid:#f8fdff;
    --panel-rim:rgba(255,255,255,.75);
    --panel-tint:#eef8fd;          /* the board, a shade cooler than the chat */
    --line:#d3e6f3;                /* hairlines, and the figure's grid */
    /* Ink, measured against the surface it actually sits on. --dim is checked
       against the BOARD (#eef8fd), which is darker than the chat panel, so it
       passes on both: 4.9:1 and 5.2:1. */
    --text:#1c3d57; --text-mid:#315b7d; --dim:#476f92;
    --accent:#43a9c6;              /* fills and borders, never small text */
    --accent-deep:#166d88;         /* accent as INK: 5.5:1 on the board */
    --accent-soft:#e2f4fa; --accent-line:#a8dcea;
    /* The student's own bubble is filled with this, in white: aqua at the
       reference's own lightness is 2.7:1 under white, which is not a colour
       choice but an unreadable message. */
    --aqua-fill:#237789; --aqua-fill-lit:#2a7d93;   /* both ends ≥4.7:1 under white */
    --err:#b34a43;                 /* 4.6:1 on its own tint, 5.2:1 on a panel */
    --err-soft:#fdeceb;
    /* THE THREE STATES, as ink. The student has to be able to tell listening
       from thinking from talking at a glance and from across a desk, so they
       are three different hues rather than three brightnesses of one — and
       each is the darkened, readable version of a palette colour, because the
       clay peach and coral are object colours: --peach on the disabled fill
       is 1.3:1, which is a light that is not on. */
    --hear-ink:#166d88;            /* aqua   — listening, 5.2:1 on its tint */
    --think-ink:#915b12;           /* amber  — working,   5.0:1 */
    --talk-ink:#a24b46;            /* coral  — speaking,  5.1:1 */
    --hear-soft:#e2f4fa; --think-soft:#fdf0dd; --talk-soft:#fdeceb;
    --squid-lit:#ffe6cf; --squid-mid:#f8c49d; --squid-deep:#e79b6d;
    /* Radius is a hierarchy, not a habit: the further in you go, the tighter
       the corner, so a bubble never reads as a panel. */
    --r-panel:24px; --r-card:16px; --r-bubble:14px; --r-btn:12px; --r-chip:999px;
    /* Shadows are the sea's own blue, never black — and the colour is a token
       too, so the one-off shadows on bubbles and buttons darken with the
       scheme instead of staying a pale blue smudge on deep water. */
    --sink:49 91 125;
    --shadow-soft:0 2px 6px rgb(var(--sink) / .07), 0 14px 30px rgb(var(--sink) / .10);
    --shadow-lift:0 4px 10px rgb(var(--sink) / .09), 0 26px 52px rgb(var(--sink) / .16);
    --lip:inset 0 1px 0 rgba(255,255,255,.95);
    --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
           "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --math:"STIX Two Math", "Cambria Math", "Times New Roman", serif;
    /* the tutor's own box. The character is about 0.9 of this tall and 0.4 of
       it wide when upright, and fills it the other way round when it tumbles
       — the clip's crop is the character's own LENGTH, in every orientation. */
    --sq:78px;
  }
  /* Night in the same sea. The panels stay opaque and the ink inverts;
     --accent-deep goes LIGHT because the server hands it to a curve stroke
     and a caption that both sit on the panel. */
  @media (prefers-color-scheme: dark) {
    :root {
      --sea-top:#123a52; --sea-mid:#0e2c40; --sea-bottom:#0a2032;
      --sea-deep:#2b7d97;
      --panel:rgba(20,49,68,.94); --panel-solid:#143144;
      --panel-rim:rgba(154,205,226,.20); --panel-tint:#122c3e;
      --line:#2c5570;
      --text:#e4f3fb; --text-mid:#bcd9ea; --dim:#8fb4c9;
      --accent:#4fb8d4; --accent-deep:#8fd9ee;
      --accent-soft:rgba(79,184,212,.16); --accent-line:rgba(79,184,212,.40);
      /* the lit end has to be darkened here too: #2a879d is 4.16:1 under the
         white it carries, which is under AA. #237e93 is 4.69:1. */
      --aqua-fill:#1e6d80; --aqua-fill-lit:#237e93;
      /* opaque, unlike its light twin's tint: #hangup sits on the water rather
         than on a panel, so a translucent hover fill composited onto the
         gradient and left --err at 4.3:1 on 11.8px text */
      --err:#f0938a; --err-soft:#33404f;
      --hear-ink:#8fd9ee; --think-ink:#e9b567; --talk-ink:#f0a49c;
      --hear-soft:rgba(79,184,212,.16); --think-soft:#3a3325; --talk-soft:#33404f;
      --sink:0 0 0;
      --shadow-soft:0 2px 6px rgb(var(--sink) / .30), 0 14px 30px rgb(var(--sink) / .34);
      --shadow-lift:0 4px 10px rgb(var(--sink) / .34), 0 26px 52px rgb(var(--sink) / .42);
      --lip:inset 0 1px 0 rgba(190,225,240,.16);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  /* Typeset maths does not wrap: a formula is laid out as one run with no
     break opportunity in it, so a long one paints straight out of whatever
     holds it — a chat bubble, a board line, the problem heading.

     The box that scrolls has to be OURS. `.katex` itself computes to
     display:inline, and neither max-width nor overflow applies to a
     non-replaced inline box, so styling it does nothing at all; every math
     run gets this wrapper in mathify() instead. vertical-align:bottom because
     an inline-block with overflow aligns on its bottom margin edge, and the
     default baseline alignment drops the whole line by the formula's descent. */
  .mathrun {
    display:inline-block; max-width:100%; vertical-align:bottom;
    overflow-x:auto; overflow-y:hidden;
  }
  body {
    margin:0; min-height:100dvh; display:flex; flex-direction:column;
    color:var(--text); font:15px/1.6 var(--font);
    background:linear-gradient(178deg, var(--sea-top) 0%, var(--sea-mid) 52%,
               var(--sea-bottom) 100%);
    background-attachment:fixed;
  }

  /* ===================================================================
     THE SCENE, in three planes. Distance is carried by blur and contrast,
     so only the far plane is blurred: a blurred foreground reads as a
     smudge on the lens rather than as something close.
     =================================================================== */
  .scene { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  /* far: two dunes of seabed, out of focus */
  .scene .far {
    position:absolute; inset:0; filter:blur(26px); opacity:.85;
    background:
      radial-gradient(58% 42% at 18% 74%, rgba(255,255,255,.55), transparent 62%),
      radial-gradient(70% 46% at 82% 88%, rgba(67,169,198,.34), transparent 66%),
      radial-gradient(46% 30% at 62% 58%, rgba(255,255,255,.38), transparent 64%);
  }
  /* mid: shafts of light from the surface, and the floor they fall on */
  .scene .mid {
    position:absolute; inset:0;
    background:
      linear-gradient(104deg, transparent 28%, rgba(255,255,255,.30) 40%,
                      transparent 50%, rgba(255,255,255,.20) 62%, transparent 72%),
      radial-gradient(120% 46% at 50% 104%, rgba(255,255,255,.42), transparent 70%);
  }
  /* mid: the wobble the surface throws on everything below it. Two soft
     lattices at different scales sliding past each other read as water
     moving; one alone reads as a pattern. */
  .scene .caustic {
    position:absolute; inset:-12%; opacity:.5; mix-blend-mode:soft-light;
    background:
      radial-gradient(38% 24% at 20% 30%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(30% 18% at 62% 16%, rgba(255,255,255,.75), transparent 72%),
      radial-gradient(44% 26% at 84% 44%, rgba(255,255,255,.7), transparent 70%),
      radial-gradient(34% 20% at 40% 62%, rgba(255,255,255,.7), transparent 72%);
    background-size:60% 44%, 44% 34%, 66% 48%, 50% 38%;
  }
  @media (prefers-color-scheme: dark) {
    .scene .far { opacity:.5; }
    .scene .mid { opacity:.28; }
    .scene .caustic { opacity:.22; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .scene .caustic { animation:drift 34s ease-in-out infinite alternate; }
    @keyframes drift {
      0%   { transform:translate3d(0,0,0) scale(1); }
      100% { transform:translate3d(3%, 2%, 0) scale(1.08); }
    }
  }

  /* mid: bubbles, small and few, rising the whole height */
  .bubbles { position:absolute; inset:0; }
  .bubbles i {
    position:absolute; bottom:-8vh; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95),
               rgba(255,255,255,.22) 58%, rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.55);
  }
  /* Still, not gone. The rising is the animation; the bubble itself is part of
     the middle distance, and hiding it under reduced motion emptied that whole
     plane of the scene. They hang where they were placed instead. */
  @media (prefers-reduced-motion: reduce) {
    .bubbles i { bottom:auto; top:22%; opacity:.5; }
    .bubbles i:nth-child(even) { top:58%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bubbles i { opacity:0; animation:rise linear infinite; }
    @keyframes rise {
      0%   { transform:translateY(0) scale(.7); opacity:0; }
      14%  { opacity:.75; }
      86%  { opacity:.5; }
      100% { transform:translateY(-118vh) scale(1); opacity:0; }
    }
  }

  /* mid: a few fish, far enough off to be shapes rather than animals. They
     cross behind the panels, which is the only place there is room for them.
     Positioned as elements rather than inside one stretched SVG: the scene
     spans the window, and a fish in a viewBox scaled to a 16:9 window is a
     fish stretched to twice its length. */
  .shoal .fish {
    position:absolute; top:var(--y); left:0; width:calc(30px * var(--k));
    height:auto; fill:#ffffff; opacity:.34; transform:translateX(-12vw);
  }
  @media (prefers-color-scheme: dark) { .shoal .fish { opacity:.16; } }
  /* parked in view, not off the left edge: the crossing is the animation, the
     fish are part of the middle distance either way */
  @media (prefers-reduced-motion: reduce) {
    .shoal .fish { transform:translateX(var(--park, 22vw)); }
    .shoal .fish:nth-child(even) { --park:64vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .shoal .fish { animation:cross var(--sec) linear var(--lag) infinite; }
    @keyframes cross {
      from { transform:translateX(-12vw); }
      to   { transform:translateX(112vw); }
    }
  }

  /* near: the reef, in focus, standing on its own floor rather than being
     cut off by the bottom of the window */
  #reef {
    position:absolute; left:0; bottom:0; width:100%; height:auto;
    /* one soft ground shadow, not a blur on the objects themselves */
    filter:drop-shadow(0 10px 16px rgb(var(--sink) / .16));
  }
  @media (prefers-color-scheme: dark) { #reef { opacity:.55; } }

  header, main { position:relative; z-index:1; }

  /* ===================================================================
     TOP BAR. Three things only, in falling order of importance: whose
     tutor this is, whether it is connected, and the way out. The voice
     controls live at the foot of the conversation, next to the words they
     produce.
     =================================================================== */
  /* the same arithmetic main uses, so the brand starts exactly above the
     board's left edge: box-sizing is border-box, so the gutters have to be
     inside the max-width here as they are inside main's padding there */
  header {
    flex:none; display:flex; align-items:center; gap:1rem;
    width:100%; max-width:calc(1440px + 3rem); margin:0 auto;
    padding:.85rem 1.5rem .45rem;
  }
  .brand { display:flex; align-items:baseline; gap:.55rem; min-width:0; margin-right:auto; }
  .brand .name {
    font-size:1.12rem; font-weight:800; letter-spacing:-.01em; color:var(--text);
  }
  .brand .sub {
    font-size:.64rem; font-weight:700; color:var(--text-mid);
    letter-spacing:.15em; text-transform:uppercase; white-space:nowrap;
  }
  /* a status chip, not a button: it says a thing, it does not do one */
  #conn {
    flex:none; display:inline-flex; align-items:center; gap:.4rem;
    font-size:.74rem; font-weight:700; color:var(--dim);
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r-chip); padding:.26rem .7rem .26rem .58rem;
    box-shadow:var(--shadow-soft);
  }
  #conn::before {
    content:""; width:.45rem; height:.45rem; border-radius:50%;
    background:currentColor; opacity:.7;
  }
  #conn.ok { color:var(--accent-deep); border-color:var(--accent-line); }
  #conn.down { color:var(--err); }
  /* the way out: quiet until you reach for it, then plainly a red door */
  /* text-mid rather than dim: this one sits on the open water, where dim is
     4.2:1 against the paler part of the gradient */
  #hangup {
    flex:none; font:700 .74rem var(--font); color:var(--text-mid); cursor:pointer;
    background:transparent; border:1px solid transparent;
    border-radius:var(--r-btn); padding:.3rem .7rem;
    transition:color .18s, background .18s, border-color .18s;
  }
  #hangup[hidden] { display:none; }
  #hangup:hover { color:var(--err); background:var(--err-soft); border-color:var(--err); }
  #hangup:active { transform:translateY(1px); }
  #hangup:focus-visible {
    outline:2px solid var(--err); outline-offset:2px; color:var(--err);
  }

  /* ===================================================================
     LAYOUT. The board is the lesson, so it takes about three quarters;
     the conversation takes the rest and never drops below a readable
     column. Both start at the same y and end at the same y, because they
     are siblings in one grid row rather than a stack beside a panel.
     =================================================================== */
  /* The panels run nearly to the bottom of the window and cover most of the
     reef, which is what scenery is for: it shows in the gutters, under the
     panels and behind the header, and gives way to the lesson everywhere
     else. */
  main {
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; justify-content:center;
    padding:.35rem 1.5rem 1.15rem;
  }
  .grid {
    width:100%; max-width:1440px; min-height:0;
    display:grid; gap:1.1rem; align-items:stretch;
    grid-template-columns:minmax(0,74fr) minmax(310px,26fr);
  }

  /* One surface recipe: opaque enough to read on, a lit top edge, and the
     sea's own shadow underneath. No backdrop blur anywhere: a page-wide
     frosted veil is the look this was asked to stop being. */
  .panel {
    background:var(--panel); border:1px solid var(--panel-rim);
    border-radius:var(--r-panel); box-shadow:var(--lip), var(--shadow-soft);
  }
  .cardlabel {
    display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.02em;
    color:var(--accent-deep); background:var(--accent-soft);
    border-radius:var(--r-chip); padding:.2rem .7rem;
  }

  /* ---- the problem, as the board's own heading ---- */
  #problemCard {
    padding:0 0 .9rem; margin-bottom:.2rem;
    border-bottom:1px solid var(--line);
  }
  #problemCard[hidden] { display:none; }
  #problemCard .cardlabel { margin-bottom:.5rem; }
  #problemText {
    font-size:1.06rem; font-weight:700; line-height:1.62; color:var(--text);
    word-break:keep-all;
  }
  #problemEqs {
    margin-top:.5rem; font-family:var(--math); font-size:1.16rem; color:var(--text-mid);
  }
  #problemEqs div { padding:.1rem 0; }

  /* ---- worksheet photo (click / drag / paste) ----
     Hidden until the server says this laptop is the eye (INPUT_MODE=upload).
     With a phone on /camera the box would be a dead end: the phone is asked
     first and answers every capture. */
  #sheet { display:none; }
  #drop[hidden] { display:none; }
  #drop {
    display:flex; align-items:center; gap:.9rem; margin-bottom:.7rem;
    background:var(--panel-tint); border:1.5px dashed var(--line);
    border-radius:var(--r-card); padding:.7rem .9rem;
    color:var(--dim); font-size:.8rem; line-height:1.5; cursor:pointer;
    transition:border-color .18s, color .18s, background .18s;
  }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--text); }
  #drop:active { transform:translateY(1px); }
  #drop:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  #drop.has {
    border-style:solid; border-color:var(--accent-line);
    background:var(--accent-soft); color:var(--text);
  }
  #drop b { font-weight:800; color:var(--text-mid); }
  #thumb { max-height:2.6rem; border-radius:8px; display:none; }
  #thumb.has { display:block; }
  /* a filename has no spaces to break at, and this one is whatever the
     student's camera named it */
  .meta { font-size:.72rem; color:var(--dim); overflow-wrap:anywhere; }
  #drop > div { min-width:0; }

  /* ===================================================================
     THE BOARD. A cool near-white slate with a whisper of a dot grid, the
     problem as its heading, and everything the tutor writes below. The
     tutor itself does not live here — it comes over from the conversation
     when it has something to write, and goes back.
     =================================================================== */
  #board {
    position:relative;              /* the ink trail is drawn over it */
    min-height:0; display:flex; flex-direction:column;
    padding:1.1rem 1.5rem 1.3rem;
    background-color:var(--panel-tint);
    /* the grid is a texture, not a feature: one dot every 26px at a tenth
       of the hairline's weight */
    background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size:26px 26px; background-position:13px 13px;
    overflow:hidden;                /* the ink stops at the board's edge */
  }
  #boardHead { flex:none; }

  /* The writing area: everything the tutor puts on the board, and the ink it
     lays it down with. A layer of its own because the sweep belongs to the
     WRITING, not to the board — the board's top left is the problem
     statement, and a squid swimming over the question it was asked is the
     one place on this page it must not be. */
  .writing { position:relative; flex:1 1 auto; min-height:0; display:flex; }
  /* Where the tutor stands when it is at the board and not moving — a real
     element, so a resize has something live to measure rather than a point
     remembered from before the window changed size. Out at the right margin,
     not at 9%/10%: that put it directly on top of the first step it had just
     written, which is the one place on the board it must never sit. */
  #squidBoard { position:absolute; right:1%; top:6%; width:0; height:0; }

  /* The ink. Its viewBox is set to the area's own pixel size before each pass,
     so one unit is one pixel — a stretched viewBox made the dash that draws
     the stroke a different length from the stroke itself, and the trail came
     out as four separate smears.

     UNDER the writing, not over it. That is both the legibility fix and the
     whole meaning of the thing: ink on top of a formula is a smear the student
     has to read through, ink underneath is the ground the letters rise out of
     — which is what 먹물이 지나간 자리에 판서가 시작된다 actually describes. It also
     buys the ink permission to be more present, since it can no longer touch
     the contrast of anything being read.

     A PLUME, not a stroke: ink in water blooms and thins, and a single even
     line is a highlighter, which is exactly what the first attempt looked
     like. Three things make it not one — a wide blurred bloom, a thin front so
     the eye can see where it is coming from, and a gradient along the whole
     length, because UNIFORMITY is the tell. The ink at the launch is the
     oldest and most spread; the ink at the head was let go a moment ago. */
  #boardInk {
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; opacity:0; z-index:0;
    transition:opacity .55s ease;
  }
  #boardInk.wet { opacity:1; transition:none; }
  /* Four round-capped strokes on one path instead of one blurred stroke.
     Overlapping round caps at falling width and rising opacity give the same
     soft shoulder, and nothing has to be re-rasterised through a filter every
     frame — which matters because this plays while the same laptop is running
     the VAD, an STT call and TTS. */
  #boardInk .ink {
    fill:none; stroke:url(#inkFade);
    stroke-linecap:round; stroke-linejoin:round;
  }
  #inkA { stroke-width:30;  opacity:.085; }
  #inkB { stroke-width:17;  opacity:.14; }
  #inkC { stroke-width:8.5; opacity:.30; }
  #inkTrail { stroke-width:3; opacity:.46; }
  /* var() is not valid inside an SVG presentation attribute, so the stops are
     coloured from here — where it also follows the scheme like everything else */
  #inkFade stop, #inkPuff stop { stop-color:var(--accent-deep); }
  /* fill-box, or the transform-origin is the whole SVG and a swelling blob
     slides across the board instead of blooming where it was let go */
  #boardInk .puff {
    fill:url(#inkPuff); opacity:0;
    transform-box:fill-box; transform-origin:50% 50%;
  }
  /* the writing sits above its own ink */
  #boardLines { position:relative; z-index:1; }

  #boardLines {
    flex:1 1 auto; min-width:0; overflow-y:auto;
    /* the top padding is exactly the fade below: the fade is there to dissolve
       a line scrolled halfway off, and it must not wash out the first line
       when nothing is scrolled at all */
    padding:16px .1rem 0; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
  }
  /* What the tutor deliberately WROTE, one step of the argument: the biggest
     type on the board, with the reason scribbled under it in the margin
     voice. Written, not framed.

     One rule, not two: boardWrite has written `boardline key` unconditionally
     since sentence transcription left the board, so a plain `.boardline` rule
     could only ever be shadowed by this one. Its typography sat there looking
     editable and changed nothing. */
  .boardline {
    padding:.5rem .2rem .8rem; margin:.15rem 0;
    font-size:1.36rem; line-height:1.5; color:var(--text);
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .boardline .katex { font-size:1.3em; }
  .boardline .note {
    margin-top:.28rem; font-size:.78rem; font-weight:700; color:var(--accent-deep);
    letter-spacing:-.01em; word-break:keep-all;
  }
  @media (prefers-reduced-motion: no-preference) {
    /* A line that arrives outside a pass simply surfaces — and it surfaces
       out of the ink's own colour into the writing's, which is the cheapest
       possible way of saying the ink BECAME the step. */
    .boardline { animation:inked .5s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes inked {
      0%   { opacity:0; transform:translateY(-4px); filter:blur(3px);
             color:var(--accent-deep); }
      100% { opacity:1; transform:none; filter:none; color:var(--text); }
    }

    /* A line the ink is laying down is UNCOVERED left to right, in the wake of
       the squid, so the writing looks put there rather than switched on.

       The wipe is mask-position and not a registered @property: a custom
       property needs @property to animate at all, and where that is missing
       the mask would sit at its initial value and hide the line for good.
       mask-position animates everywhere, and its own default — 0%, the solid
       end of the gradient — is FULLY VISIBLE. If the animation never runs, for
       any reason, the student still reads the step. */
    /* The geometry has to be exact or the mechanism silently half-works. A
       percentage mask-position lines the image's P% up with the box's P%, so
       at 300% the box sees image fractions 0–33% at 0% and 67–100% at 100%.
       Stops at 34% and 66% therefore put the box ENTIRELY inside the solid end
       at one extreme and ENTIRELY inside the clear end at the other. The first
       attempt used 210% with stops at 46/60, where the box sees 0–47.6% and
       52.4–100%: it never quite finished uncovering and never quite started
       covered, which is a wipe that does not wipe. */
    .boardline.laying, .boardfigure.laying {
      animation:inked 0s both, laydown var(--lay, .46s) cubic-bezier(.3,.6,.35,1) both;
      -webkit-mask-image:linear-gradient(90deg, #000 0 34%, transparent 66%);
              mask-image:linear-gradient(90deg, #000 0 34%, transparent 66%);
      -webkit-mask-size:300% 100%;   mask-size:300% 100%;
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    }
    /* and the mask comes OFF when it is done: a board holding a lesson's worth
       of steps should not keep every one of them on its own composited layer */
    .boardline.dry, .boardfigure.dry {
      -webkit-mask-image:none; mask-image:none;
    }
    @keyframes laydown {
      from { -webkit-mask-position:100% 0; mask-position:100% 0; }
      to   { -webkit-mask-position:0% 0;   mask-position:0% 0; }
    }
  }

  /* a function sketched on the board: axes, a light grid, the curve */
  .boardfigure {
    position:relative; padding:.4rem 0 .2rem;
    overflow:hidden;                 /* the drag preview stops at its frame */
    /* A sideways finger pans the GRAPH; an up-down finger still scrolls the
       BOARD. Taking both would make the sketch a dead zone in the page's own
       scrolling, and the board is taller than the screen exactly when it has
       a figure on it. */
    touch-action:pan-y;
    cursor:grab;
  }
  .boardfigure:active { cursor:grabbing; }
  .boardfigure:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  /* The window controls: the automatic window is a guess about what matters,
     and these are how the student overrules it. − widens (more of the plane,
     the fix when a curve runs out of the frame), + moves closer. Quiet until
     hovered, because they sit on the sketch itself. */
  .figzoom {
    position:absolute; top:.55rem; right:.15rem; z-index:1;
    display:flex; gap:.3rem; opacity:.55; transition:opacity .18s;
  }
  .boardfigure:hover .figzoom, .figzoom:focus-within { opacity:1; }
  .figzoom button {
    width:1.7rem; height:1.7rem; display:grid; place-items:center;
    font:700 1.05rem var(--font); line-height:1;
    color:var(--text-mid); background:var(--panel-solid);
    border:1px solid var(--line); border-radius:var(--r-btn);
    cursor:pointer; box-shadow:0 1px 3px rgb(var(--sink) / .10);
    transition:color .15s, border-color .15s, background .15s;
  }
  .figzoom button:hover { color:var(--accent-deep); border-color:var(--accent-line); }
  .figzoom button:active { transform:translateY(1px); }
  .figzoom button:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference) {
    .boardfigure { transition:opacity .18s ease; }
    .boardfigure.fading { opacity:.15; }
  }
  /* The server draws the sketch at about the board's width, so it fills it at
     roughly 1:1 and the tick labels stay the size they were drawn. */
  .boardfigure svg { display:block; width:100%; height:auto; }
  .boardfigure .grid line { stroke:var(--line); stroke-width:1; }
  .boardfigure .axes line { stroke:var(--dim); stroke-width:1.4; }
  .boardfigure .ticks text { fill:var(--dim); font-size:10px; font-family:var(--font); }
  .boardfigure .legend { font-size:12px; font-family:var(--math); }
  .boardfigure .note {
    margin-top:.15rem; text-align:center; font-size:.78rem; font-weight:700;
    color:var(--accent-deep); word-break:keep-all;
  }

  /* Empty state: not a message floating in the middle of nothing, but a note
     pinned to the top of the board saying the tutor is ready. */
  #boardEmpty {
    max-width:30rem; margin:.2rem 0 0 .1rem; position:relative;
    background:var(--panel-solid); border:1px solid var(--line);
    border-radius:var(--r-card); border-top-left-radius:6px;
    padding:.85rem 1.1rem; box-shadow:var(--shadow-soft);
    color:var(--dim); font-size:.88rem; line-height:1.65;
  }
  #boardEmpty b {
    display:block; font-size:1.02rem; font-weight:800; color:var(--text);
    margin-bottom:.15rem;
  }

  /* ===================================================================
     THE CONVERSATION. Its own header — the tutor's face, its name and
     what it is doing right now — and the voice controls pinned at its
     foot, where the words it produces appear.
     =================================================================== */
  #chatPanel {
    min-height:0; display:flex; flex-direction:column; overflow:hidden;
    padding:0;                      /* the head and foot run edge to edge */
  }
  .chathead {
    flex:none; display:flex; align-items:center; gap:.7rem;
    padding:.7rem 1rem; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--accent-soft), transparent);
  }
  /* the niche the tutor sits in. The character itself is on a layer above
     the whole page (it has to be able to fly to the board), so this is an
     empty socket that reserves the space and says where to land. */
  #squidHome {
    flex:none; width:calc(var(--sq) * .58); height:calc(var(--sq) * .92);
    border-radius:var(--r-chip);
    background:radial-gradient(60% 46% at 50% 88%, rgb(var(--sink) / .10), transparent 70%);
  }
  .chathead .who { min-width:0; margin-right:auto; }
  .chathead .who b { display:block; font-size:.92rem; font-weight:800; color:var(--text); }
  /* the state, said once and plainly: a coloured dot, a word, and a hue that
     does not repeat between states */
  #stateChip {
    display:inline-flex; align-items:center; gap:.38rem;
    font-size:.74rem; font-weight:800; letter-spacing:-.01em;
    border-radius:var(--r-chip); padding:.22rem .62rem .22rem .5rem;
    color:var(--dim); background:var(--panel-solid); border:1px solid var(--line);
    transition:color .2s, background .2s, border-color .2s;
  }
  #stateChip .led {
    width:.46rem; height:.46rem; border-radius:50%; background:currentColor;
    flex:none;
  }
  #stateChip[data-state="LISTENING"], #stateChip[data-state="USER_SPEAKING"] {
    color:var(--hear-ink); background:var(--hear-soft); border-color:var(--accent-line);
  }
  #stateChip[data-state="PROCESSING"] {
    color:var(--think-ink); background:var(--think-soft); border-color:var(--think-ink);
  }
  #stateChip[data-state="AGENT_SPEAKING"] {
    color:var(--talk-ink); background:var(--talk-soft); border-color:var(--talk-ink);
  }
  @media (prefers-reduced-motion: no-preference) {
    /* each state's light behaves differently, so it is legible out of the
       corner of an eye: listening breathes, working blinks, speaking pulses */
    #stateChip[data-state="LISTENING"] .led { animation:breathe 2.4s ease-in-out infinite; }
    #stateChip[data-state="USER_SPEAKING"] .led { animation:breathe 1s ease-in-out infinite; }
    #stateChip[data-state="PROCESSING"] .led { animation:tick 1.1s steps(1) infinite; }
    #stateChip[data-state="AGENT_SPEAKING"] .led { animation:beat .62s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes tick    { 0%,49% { opacity:1; } 50%,100% { opacity:.25; } }
    @keyframes beat    { 0%,100% { transform:scale(.8); } 50% { transform:scale(1.25); } }
  }

  #chat {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:.8rem;
    padding:.9rem .9rem 1rem; scrollbar-width:thin;
  }
  .msg { max-width:94%; display:flex; flex-direction:column; gap:.2rem; }
  .msg .who { font-size:.68rem; font-weight:700; color:var(--dim); padding:0 .3rem; }
  .msg .bubble {
    border-radius:var(--r-bubble); padding:.6rem .85rem;
    font-size:.88rem; line-height:1.62;
    white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere;
  }
  /* the tutor speaks in white, the student in the sea's own aqua */
  .msg.tutor { align-self:flex-start; }
  .msg.tutor .bubble {
    background:var(--panel-solid); border:1px solid var(--line); color:var(--text);
    border-top-left-radius:5px; box-shadow:0 1px 2px rgb(var(--sink) / .05);
  }
  .msg.you { align-self:flex-end; align-items:flex-end; }
  .msg.you .bubble {
    background:linear-gradient(158deg, var(--aqua-fill-lit), var(--aqua-fill));
    border:1px solid var(--aqua-fill); color:#fff;
    border-top-right-radius:5px; box-shadow:0 2px 8px rgb(var(--sink) / .18);
  }
  /* the line being revealed carries a caret, so a pause mid-sentence reads as
     "still coming" rather than as the end of the answer */
  .msg.typing .bubble::after {
    content:""; display:inline-block; vertical-align:-2px;
    width:.5em; height:1.05em; margin-left:.06em; border-radius:1px;
    background:var(--accent-deep); opacity:.55;
  }
  @media (prefers-reduced-motion: no-preference) {
    .msg.typing .bubble::after { animation:caret .9s steps(1) infinite; }
    @keyframes caret { 0%,49% { opacity:.55; } 50%,100% { opacity:0; } }
  }
  /* Machine talk (hint level, action) is smaller and quieter than speech.
     Quieter by size and weight only: an opacity on top of --dim composited it
     to 4.2:1, undoing the token that was picked to pass on this surface. */
  .msg .note {
    font-size:.68rem; font-weight:600; color:var(--dim); padding:0 .35rem;
    letter-spacing:.01em;
  }
  .sys {
    align-self:center; max-width:94%; text-align:center;
    font-size:.74rem; font-weight:600; color:var(--err);
    background:var(--err-soft); border-radius:var(--r-bubble); padding:.35rem .7rem;
  }

  /* The tutor is thinking. This is the FIRST thing on screen after the
     student stops talking, and it is why it exists in the markup from the
     start: showing it is one hidden→visible flip, with nothing to build,
     nothing to fetch and nothing to measure. */
  #thinking { align-self:flex-start; }
  #thinking[hidden] { display:none; }
  #thinking .bubble {
    display:flex; align-items:center; gap:.5rem;
    background:var(--think-soft); border:1px solid var(--think-ink);
    color:var(--think-ink); font-size:.79rem; font-weight:700;
  }
  .dots { display:inline-flex; gap:.22rem; }
  .dots i { width:.3rem; height:.3rem; border-radius:50%; background:currentColor; opacity:.4; }
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation:blink 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay:.2s; }
    .dots i:nth-child(3) { animation-delay:.4s; }
    @keyframes blink { 40% { opacity:1; } }
  }

  /* ---- the voice controls, at the foot of the words they make ---- */
  .chatfoot {
    flex:none; display:flex; align-items:center; gap:.75rem;
    padding:.8rem 1rem .9rem; border-top:1px solid var(--line);
    background:var(--panel-solid);
  }
  #orb {
    flex:none; position:relative;
    display:inline-flex; align-items:center; gap:.5rem;
    border-radius:var(--r-chip); border:1px solid var(--aqua-fill);
    background:linear-gradient(158deg, var(--aqua-fill-lit), var(--aqua-fill)); color:#fff;
    padding:.5rem 1.05rem .5rem .85rem; font:800 .84rem var(--font); cursor:pointer;
    box-shadow:0 2px 8px rgb(var(--sink) / .20);
    transition:filter .18s, box-shadow .18s, transform .1s;
  }
  #orb .dot {
    width:.5rem; height:.5rem; border-radius:50%; background:#fff; opacity:.85;
    transition:background .25s, box-shadow .25s, opacity .25s;
  }
  #orb:hover { filter:brightness(1.06); box-shadow:var(--shadow-lift); }
  #orb:active { transform:translateY(1px); box-shadow:0 1px 4px rgb(var(--sink) / .22); }
  #orb:focus-visible { outline:2px solid var(--accent-deep); outline-offset:3px; }
  /* once it is running the button stops being a button and becomes the light */
  #orb:disabled {
    cursor:default; background:var(--panel-tint); color:var(--text-mid);
    border-color:var(--line); box-shadow:none; filter:none;
  }
  #orb:disabled .dot { background:var(--dim); opacity:1; }
  /* The dot only ever shows on the disabled fill, so these are the same three
     inks the chip uses — one hue per state, on both sides of the panel. */
  #orb[data-state="LISTENING"] .dot      { background:var(--hear-ink); }
  #orb[data-state="USER_SPEAKING"] .dot  { background:var(--hear-ink); box-shadow:0 0 0 4px var(--hear-soft); }
  #orb[data-state="PROCESSING"] .dot     { background:var(--think-ink); }
  #orb[data-state="AGENT_SPEAKING"] .dot { background:var(--talk-ink); box-shadow:0 0 0 4px var(--talk-soft); }
  #orb[data-state="LISTENING"], #orb[data-state="USER_SPEAKING"] { border-color:var(--accent-line); }
  #orb[data-state="PROCESSING"] { border-color:var(--think-ink); }
  #orb[data-state="AGENT_SPEAKING"] { border-color:var(--talk-ink); }
  /* and the ring, which says the same thing at arm's length: the mic is open
     and breathing, or the tutor has the floor */
  @media (prefers-reduced-motion: no-preference) {
    #orb[data-state="LISTENING"] .dot     { animation:breathe 2.4s ease-in-out infinite; }
    #orb[data-state="USER_SPEAKING"] .dot { animation:breathe 1s ease-in-out infinite; }
    #orb[data-state="AGENT_SPEAKING"] .dot { animation:beat .62s ease-in-out infinite; }
  }
  /* keep-all keeps Korean from breaking mid-word; anywhere is its companion
     for the strings this carries that have no spaces at all, like the browser's
     own getUserMedia error text */
  #status {
    min-width:0; font-size:.72rem; line-height:1.45; color:var(--dim);
    word-break:keep-all; overflow-wrap:anywhere;
  }

  /* ===================================================================
     THE TUTOR. One element, on a layer over the whole page, that flies
     between two sockets: the conversation's header, where it lives, and
     the board, where it writes.

     transform-origin is the CHARACTER's centre inside its frame, not the
     frame's — the clip is cropped to the squid's own length in every
     orientation, so the standing pose sits at 35% across it. With the
     origin there, translate places the character and scale/rotate happen
     about it, and one number does not have to be corrected by another.
     =================================================================== */
  #squidLayer {
    position:fixed; inset:0; z-index:6; pointer-events:none; overflow:hidden;
  }
  #tutor {
    position:absolute; left:0; top:0;
    width:var(--sq); height:calc(var(--sq) * 242 / 240);
    transform-origin:35.2% 51.4%;
    transform:translate3d(-999px, -999px, 0);
    will-change:transform;
  }
  @media (prefers-reduced-motion: no-preference) {
    #tutor { transition:transform var(--fly, .62s) cubic-bezier(.34, .8, .3, 1); }
  }
  #tutor img { position:absolute; inset:0; width:100%; height:100%; }
  #tutor .clip { opacity:0; }
  /* only while it is working; an image that never stops moving stops meaning
     "working", and the still is the same frame under the same crop so the
     swap never moves the character */
  #tutor.busy .still { opacity:0; }
  #tutor.busy .clip { opacity:1; }
  /* Except while it is crossing the board. The loop is a squid tumbling on the
     spot; rotating a tumbling squid along a flight path is two motions arguing,
     and it was most of why the pass read as a sprite being dragged. Flying, it
     holds ONE pose and the pose is aimed along the path. */
  #tutor.flying .clip { opacity:0; }
  #tutor.flying .still { opacity:1; }
  /* Waiting: it floats, the way anything neutrally buoyant does. On the INNER
     element, because the outer one is carrying the flight — and during a pass
     this same element carries the PULSE.
     transform-origin matches #tutor's, so both turn about the character rather
     than about a corner of empty water. Because #tutor already holds the
     rotation, this element's own y-axis IS the direction of travel: scaleY < 1
     is literally "contracted along travel" and needs no trigonometry. */
  #tutor .float {
    position:absolute; inset:0; transform-origin:35.2% 51.4%;
  }
  @media (prefers-reduced-motion: no-preference) {
    #tutor .float { animation:bob 5.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform:translateY(0) rotate(0deg); }
      50%      { transform:translateY(-7px) rotate(-2.5deg); }
    }
    /* the clip is already swimming, so the float would be swimming twice —
       and neither belongs under a flight that is carrying its own motion */
    #tutor.busy .float, #tutor.flying .float { animation:none; }
  }

  /* the maths it is chewing on, drifting round it. Placed on the character's
     centre, not the frame's, and sized in em of the frame so they grow with
     it when it comes forward to think. */
  #tutor .halo {
    position:absolute; left:35.2%; top:51.4%; width:0; height:0;
    font:800 calc(var(--sq) * .17) var(--math); color:var(--accent-deep);
    opacity:0; transition:opacity .3s;
  }
  #tutor .halo i {
    position:absolute; display:block; font-style:normal;
    transform:translate(-50%, -50%);
  }
  /* Shown only where they can drift. Without the animation all six sit on the
     same point, which is not a quieter version of the effect but a pile of
     glyphs on the character's face. */
  #tutor.flying .halo { opacity:0; }
  @media (prefers-reduced-motion: no-preference) {
    #tutor.busy:not(.flying) .halo { opacity:1; }
    #tutor.busy .halo i { animation:mutter 5.2s ease-in-out infinite both; }
    /* six of them, each on its own arc and its own clock, so they never line
       up into a ring */
    #tutor .halo i:nth-child(1) { --ax:-1.15; --ay:-.55; animation-delay:0s; }
    #tutor .halo i:nth-child(2) { --ax: 1.05; --ay:-.85; animation-delay:-.9s; }
    #tutor .halo i:nth-child(3) { --ax:-.85;  --ay: .75; animation-delay:-1.8s; }
    #tutor .halo i:nth-child(4) { --ax: 1.25; --ay: .35; animation-delay:-2.6s; }
    #tutor .halo i:nth-child(5) { --ax:-.35;  --ay:-1.2; animation-delay:-3.4s; }
    #tutor .halo i:nth-child(6) { --ax: .55;  --ay: 1.1; animation-delay:-4.2s; }
    @keyframes mutter {
      0%   { opacity:0;
             transform:translate(calc(-50% + var(--ax) * var(--sq) * .30),
                                 calc(-50% + var(--ay) * var(--sq) * .30)) scale(.5); }
      22%  { opacity:.9; }
      68%  { opacity:.55; }
      100% { opacity:0;
             transform:translate(calc(-50% + var(--ax) * var(--sq) * .62),

                       scale(1.05); }
