<!doctype html>
<!--
  Hands-free browser client for the Visual Socratic Tutor.

  The laptop only captures and plays; the VAD, STT, tutor pipeline and TTS all
  run on the server (that is the point of this page: over SSH the server has no
  microphone and nobody is listening to its speaker).

    IN:  getUserMedia → AudioWorklet → float32 @16 kHz → int16 → 512-sample
         frames → binary AUDIO frames on ONE WebSocket (the same framing the
         camera device uses, so the server code is unchanged)
    OUT: turn_state / transcript / tutor_says / problem events + TTS_AUDIO
         frames with the tutor's speech → <audio> → "playback_done" back

  Barge-in: the mic stays open while the tutor speaks so the student can cut
  in. What keeps the tutor from hearing itself is echoCancellation in
  getUserMedia — the browser subtracts what it is playing from what it hears —
  plus a higher onset bar on the server for those frames. Without working AEC
  (an external speaker, a bad driver) the tutor will interrupt itself; that is
  what BARGE_IN=0 is for.

  The mic still shuts during PROCESSING: there is nothing to interrupt while it
  thinks, and a half-turn must not survive into the answer.

  Chrome/Edge recommended (AudioWorklet at a 16 kHz AudioContext).

  DESIGN: one undersea scene in three planes (a blurred seabed far off, light
  and bubbles in the middle, the reef in focus at the front, all drawn in this
  file), and two zones on top of it. The BOARD takes about three quarters: the
  tutor stands at its top left, the problem is its heading, and every
  mathematical line the tutor writes is typeset below (KaTeX). The
  CONVERSATION takes the rest, with its own header and the voice controls
  pinned at its foot. Surfaces are opaque and lit from above rather than
  frosted; radius is a hierarchy (panel 24, card 16, bubble 14, button 12,
  chip full) so a bubble never reads as a panel. Every control on this page is
  wired to something real; there are deliberately no decorative buttons. The
  archive of solved problems is on hold, so its panel is gone and only the
  transcript it will need is still kept.

  Both colour schemes are the same water at different depths: the surface in
  light mode, the deep in dark. Every colour is a token, including the four
  the server names when it draws a curve (--accent-deep, --err, --dim, --line
  in tutor/hints/plot.py), and each one used as ink was picked against the
  surface it actually sits on rather than by eye.

  MATH: the server sends one normalized display vocabulary (x², ·, √, log₃,
  1/5 — see tutor/speech/mathspeak.py displayable()). This page converts that
  small alphabet to TeX and typesets it with KaTeX. If the KaTeX CDN cannot be
  reached, everything falls back to the plain unicode text, which is exactly
  what the page showed before KaTeX existed.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Socratic Tutor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<style>
  /* ===================================================================
     TOKENS. Colour, radius and shadow live here and nowhere else; four of
     the colour names are also the server's, because tutor/hints/plot.py
     writes var(--accent-deep), var(--err), var(--dim) and var(--line) into
     the figures it draws. Anything used as TEXT is picked for contrast on
     the panel, not for prettiness: the water is pale and a pale ink on it
     is unreadable, whatever the reference does at poster size.
     =================================================================== */
  :root {
    /* the water, top to floor */
    --sea-top:#ddf3ff; --sea-mid:#b6e4f5; --sea-bottom:#8fd3ea;
    --sea-deep:#43a9c6;
    /* the clay palette. Only what the interface itself uses lives here; the
       reef's own creams, mints and lilacs are gradient stops inside its SVG,
       where they belong, rather than tokens nothing references. */
    --coral:#f3a6a8; --peach:#ffd0a6;
    /* surfaces */
    --panel:rgba(248,253,255,.94); --panel-solid:#f8fdff;
    --panel-rim:rgba(255,255,255,.75);
    --panel-tint:#eef8fd;          /* the board, a shade cooler than the chat */
    --line:#d3e6f3;                /* hairlines, and the figure's grid */
    /* Ink, measured against the surface it actually sits on. --dim is checked
       against the BOARD (#eef8fd), which is darker than the chat panel, so it
       passes on both: 4.9:1 and 5.2:1. */
    --text:#1c3d57; --text-mid:#315b7d; --dim:#476f92;
    --accent:#43a9c6;              /* fills and borders, never small text */
    --accent-deep:#166d88;         /* accent as INK: 5.5:1 on the board */
    --accent-soft:#e2f4fa; --accent-line:#a8dcea;
    /* The student's own bubble is filled with this, in white: aqua at the
       reference's own lightness is 2.7:1 under white, which is not a colour
       choice but an unreadable message. */
    --aqua-fill:#237789; --aqua-fill-lit:#2a7d93;   /* both ends ≥4.7:1 under white */
    --err:#b34a43;                 /* 4.6:1 on its own tint, 5.2:1 on a panel */
    --err-soft:#fdeceb;
    --squid-lit:#ffe6cf; --squid-mid:#f8c49d; --squid-deep:#e79b6d;
    /* Radius is a hierarchy, not a habit: the further in you go, the tighter
       the corner, so a bubble never reads as a panel. */
    --r-panel:24px; --r-card:16px; --r-bubble:14px; --r-btn:12px; --r-chip:999px;
    /* Shadows are the sea's own blue, never black. */
    --shadow-soft:0 2px 6px rgba(49,91,125,.07), 0 14px 30px rgba(49,91,125,.10);
    --shadow-lift:0 4px 10px rgba(49,91,125,.09), 0 26px 52px rgba(49,91,125,.16);
    --lip:inset 0 1px 0 rgba(255,255,255,.95);
    --font:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
           "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --math:"STIX Two Math", "Cambria Math", "Times New Roman", serif;
  }
  /* Night in the same sea. The panels stay opaque and the ink inverts;
     --accent-deep goes LIGHT because the server hands it to a curve stroke
     and a caption that both sit on the panel. */
  @media (prefers-color-scheme: dark) {
    :root {
      --sea-top:#123a52; --sea-mid:#0e2c40; --sea-bottom:#0a2032;
      --sea-deep:#2b7d97;
      --panel:rgba(20,49,68,.94); --panel-solid:#143144;
      --panel-rim:rgba(154,205,226,.20); --panel-tint:#122c3e;
      --line:#2c5570;
      --text:#e4f3fb; --text-mid:#bcd9ea; --dim:#8fb4c9;
      --accent:#4fb8d4; --accent-deep:#8fd9ee;
      --accent-soft:rgba(79,184,212,.16); --accent-line:rgba(79,184,212,.40);
      --aqua-fill:#1e6d80; --aqua-fill-lit:#2a879d;
      --err:#f0938a; --err-soft:rgba(240,147,138,.14);
      --shadow-soft:0 2px 6px rgba(0,0,0,.30), 0 14px 30px rgba(0,0,0,.34);
      --shadow-lift:0 4px 10px rgba(0,0,0,.34), 0 26px 52px rgba(0,0,0,.42);
      --lip:inset 0 1px 0 rgba(190,225,240,.16);
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; min-height:100dvh; display:flex; flex-direction:column;
    color:var(--text); font:15px/1.6 var(--font);
    background:linear-gradient(178deg, var(--sea-top) 0%, var(--sea-mid) 52%,
               var(--sea-bottom) 100%);
    background-attachment:fixed;
  }

  /* ===================================================================
     THE SCENE, in three planes. Distance is carried by blur and contrast,
     so only the far plane is blurred: a blurred foreground reads as a
     smudge on the lens rather than as something close.
     =================================================================== */
  .scene { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }

  /* far: two dunes of seabed, out of focus */
  .scene .far {
    position:absolute; inset:0; filter:blur(26px); opacity:.85;
    background:
      radial-gradient(58% 42% at 18% 74%, rgba(255,255,255,.55), transparent 62%),
      radial-gradient(70% 46% at 82% 88%, rgba(67,169,198,.34), transparent 66%),
      radial-gradient(46% 30% at 62% 58%, rgba(255,255,255,.38), transparent 64%);
  }
  /* mid: shafts of light from the surface, and the floor they fall on */
  .scene .mid {
    position:absolute; inset:0;
    background:
      linear-gradient(104deg, transparent 28%, rgba(255,255,255,.30) 40%,
                      transparent 50%, rgba(255,255,255,.20) 62%, transparent 72%),
      radial-gradient(120% 46% at 50% 104%, rgba(255,255,255,.42), transparent 70%);
  }
  @media (prefers-color-scheme: dark) {
    .scene .far { opacity:.5; }
    .scene .mid { opacity:.28; }
  }

  /* mid: bubbles, small and few, rising the whole height */
  .bubbles { position:absolute; inset:0; }
  .bubbles i {
    position:absolute; bottom:-8vh; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95),
               rgba(255,255,255,.22) 58%, rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.55); opacity:0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .bubbles i { animation:rise linear infinite; }
    @keyframes rise {
      0%   { transform:translateY(0) scale(.7); opacity:0; }
      14%  { opacity:.75; }
      86%  { opacity:.5; }
      100% { transform:translateY(-118vh) scale(1); opacity:0; }
    }
  }

  /* near: the reef, in focus, standing on its own floor rather than being
     cut off by the bottom of the window */
  #reef {
    position:absolute; left:0; bottom:0; width:100%; height:auto;
    /* one soft ground shadow, not a blur on the objects themselves */
    filter:drop-shadow(0 10px 16px rgba(49,91,125,.16));
  }
  @media (prefers-color-scheme: dark) { #reef { opacity:.55; } }

  header, main { position:relative; z-index:1; }

  /* ===================================================================
     TOP BAR. Three things only, in falling order of importance: whose
     tutor this is, whether it is connected, and the way out. The voice
     controls live at the foot of the conversation, next to the words they
     produce.
     =================================================================== */
  /* the same arithmetic main uses, so the brand starts exactly above the
     board's left edge: box-sizing is border-box, so the gutters have to be
     inside the max-width here as they are inside main's padding there */
  header {
    flex:none; display:flex; align-items:center; gap:1rem;
    width:100%; max-width:calc(1440px + 3rem); margin:0 auto;
    padding:.85rem 1.5rem .45rem;
  }
  .brand { display:flex; align-items:baseline; gap:.55rem; min-width:0; margin-right:auto; }
  .brand .name {
    font-size:1.12rem; font-weight:800; letter-spacing:-.01em; color:var(--text);
  }
  .brand .sub {
    font-size:.64rem; font-weight:700; color:var(--text-mid);
    letter-spacing:.15em; text-transform:uppercase; white-space:nowrap;
  }
  /* a status chip, not a button: it says a thing, it does not do one */
  #conn {
    flex:none; display:inline-flex; align-items:center; gap:.4rem;
    font-size:.74rem; font-weight:700; color:var(--dim);
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r-chip); padding:.26rem .7rem .26rem .58rem;
    box-shadow:var(--shadow-soft);
  }
  #conn::before {
    content:""; width:.45rem; height:.45rem; border-radius:50%;
    background:currentColor; opacity:.7;
  }
  #conn.ok { color:var(--accent-deep); border-color:var(--accent-line); }
  #conn.down { color:var(--err); }
  /* the way out: quiet until you reach for it, then plainly a red door */
  /* text-mid rather than dim: this one sits on the open water, where dim is
     4.2:1 against the paler part of the gradient */
  #hangup {
    flex:none; font:700 .74rem var(--font); color:var(--text-mid); cursor:pointer;
    background:transparent; border:1px solid transparent;
    border-radius:var(--r-btn); padding:.3rem .7rem;
    transition:color .18s, background .18s, border-color .18s;
  }
  #hangup[hidden] { display:none; }
  #hangup:hover { color:var(--err); background:var(--err-soft); border-color:var(--err); }
  #hangup:active { transform:translateY(1px); }
  #hangup:focus-visible {
    outline:2px solid var(--err); outline-offset:2px; color:var(--err);
  }

  /* ===================================================================
     LAYOUT. The board is the lesson, so it takes about three quarters;
     the conversation takes the rest and never drops below a readable
     column. Both start at the same y and end at the same y, because they
     are siblings in one grid row rather than a stack beside a panel.
     =================================================================== */
  /* The panels run nearly to the bottom of the window and cover most of the
     reef, which is what scenery is for: it shows in the gutters, under the
     panels and behind the header, and gives way to the lesson everywhere
     else. */
  main {
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; justify-content:center;
    padding:.35rem 1.5rem 1.15rem;
  }
  .grid {
    width:100%; max-width:1440px; min-height:0;
    display:grid; gap:1.1rem; align-items:stretch;
    grid-template-columns:minmax(0,74fr) minmax(310px,26fr);
  }

  /* One surface recipe: opaque enough to read on, a lit top edge, and the
     sea's own shadow underneath. No backdrop blur anywhere: a page-wide
     frosted veil is the look this was asked to stop being. */
  .panel {
    background:var(--panel); border:1px solid var(--panel-rim);
    border-radius:var(--r-panel); box-shadow:var(--lip), var(--shadow-soft);
  }
  .cardlabel {
    display:inline-block; font-size:.7rem; font-weight:800; letter-spacing:.02em;
    color:var(--accent-deep); background:var(--accent-soft);
    border-radius:var(--r-chip); padding:.2rem .7rem;
  }

  /* ---- the problem, as the board's own heading ---- */
  #problemCard {
    padding:0 0 .9rem; margin-bottom:.2rem;
    border-bottom:1px solid var(--line);
  }
  #problemCard[hidden] { display:none; }
  #problemCard .cardlabel { margin-bottom:.5rem; }
  #problemText {
    font-size:1.06rem; font-weight:700; line-height:1.62; color:var(--text);
    word-break:keep-all;
  }
  #problemEqs {
    margin-top:.5rem; font-family:var(--math); font-size:1.16rem; color:var(--text-mid);
  }
  #problemEqs div { padding:.1rem 0; }

  /* ---- worksheet photo (click / drag / paste) ----
     Hidden until the server says this laptop is the eye (INPUT_MODE=upload).
     With a phone on /camera the box would be a dead end: the phone is asked
     first and answers every capture. */
  #sheet { display:none; }
  #drop[hidden] { display:none; }
  #drop {
    display:flex; align-items:center; gap:.9rem; margin-bottom:.7rem;
    background:var(--panel-tint); border:1.5px dashed var(--line);
    border-radius:var(--r-card); padding:.7rem .9rem;
    color:var(--dim); font-size:.8rem; line-height:1.5; cursor:pointer;
    transition:border-color .18s, color .18s, background .18s;
  }
  #drop:hover, #drop.over { border-color:var(--accent); color:var(--text); }
  #drop:active { transform:translateY(1px); }
  #drop:focus-visible { outline:2px solid var(--accent-deep); outline-offset:2px; }
  #drop.has {
    border-style:solid; border-color:var(--accent-line);
    background:var(--accent-soft); color:var(--text);
  }
  #drop b { font-weight:800; color:var(--text-mid); }
  #thumb { max-height:2.6rem; border-radius:8px; display:none; }
  #thumb.has { display:block; }
  .meta { font-size:.72rem; color:var(--dim); }

  /* ===================================================================
     THE BOARD. A cool near-white slate with a whisper of a dot grid, the
     tutor standing at its top left, and everything it writes below.
     =================================================================== */
  #board {
    min-height:0; display:flex; flex-direction:column;
    padding:1.1rem 1.5rem 1.3rem;
    background-color:var(--panel-tint);
    /* the grid is a texture, not a feature: one dot every 26px at a tenth
       of the hairline's weight */
    background-image:radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size:26px 26px; background-position:13px 13px;
  }
  /* the tutor, and whatever the lesson is about, side by side */
  #boardHead { flex:none; display:flex; gap:1.1rem; align-items:flex-start; }
  .headtext { flex:1 1 auto; min-width:0; padding-top:.35rem; }

  /* ---- the tutor's stage: character, ink, and the symbols it thinks in --- */
  #tutorStage {
    flex:none; position:relative; width:104px; height:116px;
  }
  #tutorStage .avatar {
    position:absolute; inset:0; display:grid; place-items:start center;
    will-change:transform;
  }
  #tutorStage .squid { width:100px; height:auto; }
  /* The clip IS the tutor: paused on its first frame when idle, playing while
     the pipeline works, so the character never changes identity and moving is
     what "thinking" looks like. The drawn one is the fallback underneath. */
  #tutorStage video { width:104px; height:auto; display:none; }
  #tutorStage.hasclip .squid { display:none; }
  #tutorStage.hasclip video { display:block; }
  /* the ink it writes with, and the arithmetic it mutters */
  #tutorStage .ink {
    position:absolute; left:52px; top:86px; width:9px; height:11px;
    border-radius:50% 50% 46% 46%; background:var(--accent-deep);
    opacity:0; pointer-events:none;
  }
  #tutorStage .sym {
    position:absolute; font:700 .82rem var(--math); color:var(--accent-deep);
    opacity:0; pointer-events:none; user-select:none;
  }
  /* kept inside the stage's own box: a symbol at left:-6px hangs over the
     board's padding and reads as a stray glyph on the panel edge */
  #tutorStage .sym:nth-of-type(1) { left:4px;  top:46px; }
  #tutorStage .sym:nth-of-type(2) { left:84px; top:30px; }
  #tutorStage .sym:nth-of-type(3) { left:20px; top:10px; }
  #tutorStage .sym:nth-of-type(4) { left:76px; top:72px; }

  @media (prefers-reduced-motion: no-preference) {
    /* waiting: it floats, the way anything neutrally buoyant does */
    #tutorStage .avatar { animation:bob 5.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform:translateY(0) rotate(0deg); }
      50%      { transform:translateY(-8px) rotate(-2.5deg); }
    }
    /* thinking: it swims, and the symbols drift up around it */
    #tutorStage.thinking .avatar { animation:swim 3.4s ease-in-out infinite; }
    @keyframes swim {
      0%, 100% { transform:translate(0, 0) rotate(-4deg); }
      35%      { transform:translate(7px, -10px) rotate(5deg); }
      70%      { transform:translate(-5px, -4px) rotate(-2deg); }
    }
    #tutorStage.thinking .sym { animation:mutter 3.6s ease-in-out infinite; }
    #tutorStage.thinking .sym:nth-of-type(2) { animation-delay:.9s; }
    #tutorStage.thinking .sym:nth-of-type(3) { animation-delay:1.8s; }
    #tutorStage.thinking .sym:nth-of-type(4) { animation-delay:2.5s; }
    @keyframes mutter {
      0%       { transform:translateY(6px) scale(.7); opacity:0; }
      22%      { opacity:.85; }
      70%      { opacity:.5; }
      100%     { transform:translateY(-26px) scale(1.05); opacity:0; }
    }
    /* writing: it runs along the top of the board and lets the ink go */
    #tutorStage.writing .avatar { animation:writemove 1.5s cubic-bezier(.36,0,.28,1) 1; }
    @keyframes writemove {
      0%   { transform:translate(0, 0) rotate(0deg); }
      30%  { transform:translate(96px, 6px) rotate(7deg); }
      58%  { transform:translate(168px, 3px) rotate(4deg); }
      100% { transform:translate(0, 0) rotate(0deg); }
    }
    #tutorStage.writing .ink { animation:inkfall 1.5s ease-in 1; }
    @keyframes inkfall {
      0%   { transform:translate(0, 0) scale(.5); opacity:0; }
      26%  { transform:translate(92px, 6px) scale(1); opacity:.9; }
      64%  { transform:translate(150px, 40px) scale(.85); opacity:.55; }
      100% { transform:translate(196px, 74px) scale(.4); opacity:0; }
    }
  }

  #boardLines {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    /* the top padding is exactly the fade below: the fade is there to dissolve
       a line scrolled halfway off, and it must not wash out the first line
       when nothing is scrolled at all */
    padding:16px .1rem 0; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
            mask-image:linear-gradient(180deg, transparent 0, #000 16px,
                       #000 calc(100% - 8px), transparent 100%);
  }
  .boardline {
    padding:.45rem .2rem; font-size:1.04rem; line-height:1.7; color:var(--text-mid);
    word-break:keep-all; overflow-wrap:anywhere;
  }
  .boardline .katex { font-size:1.15em; }
  /* What the tutor deliberately WROTE, one step of the argument: the biggest
     type on the board, with the reason scribbled under it in the margin
     voice. Written, not framed. */
  .boardline.key {
    padding:.5rem .2rem .8rem; margin:.15rem 0;
    font-size:1.36rem; line-height:1.5; color:var(--text);
  }
  .boardline.key .katex { font-size:1.3em; }
  .boardline.key .note {
    margin-top:.28rem; font-size:.78rem; font-weight:700; color:var(--accent-deep);
    letter-spacing:-.01em; word-break:keep-all;
  }
  @media (prefers-reduced-motion: no-preference) {
    .boardline.key { animation:inked .5s ease-out 1; }
    @keyframes inked {
      0%   { opacity:0; transform:translateY(-4px); filter:blur(2px); }
      100% { opacity:1; transform:none; filter:none; }
    }
  }

  /* a function sketched on the board: axes, a light grid, the curve */
  .boardfigure { padding:.4rem 0 .2rem; }
  @media (prefers-reduced-motion: no-preference) {
    .boardfigure { transition:opacity .18s ease; }
    .boardfigure.fading { opacity:.15; }
  }
  /* The server draws the sketch at about the board's width, so it fills it at
     roughly 1:1 and the tick labels stay the size they were drawn. */
  .boardfigure svg { display:block; width:100%; height:auto; }
  .boardfigure .grid line { stroke:var(--line); stroke-width:1; }
  .boardfigure .axes line { stroke:var(--dim); stroke-width:1.4; }
  .boardfigure .ticks text { fill:var(--dim); font-size:10px; font-family:var(--font); }
  .boardfigure .legend { font-size:12px; font-family:var(--math); }
  .boardfigure .note {
    margin-top:.15rem; text-align:center; font-size:.78rem; font-weight:700;
    color:var(--accent-deep); word-break:keep-all;
  }

  /* Empty state: not a message floating in the middle of nothing, but the
     tutor at the top of its own board, saying it is ready. */
  #boardEmpty {
    max-width:30rem; margin:.2rem 0 0 .1rem; position:relative;
    background:var(--panel-solid); border:1px solid var(--line);
    border-radius:var(--r-card); border-top-left-radius:6px;
    padding:.85rem 1.1rem; box-shadow:var(--shadow-soft);
    color:var(--dim); font-size:.88rem; line-height:1.65;
  }
  #boardEmpty b {
    display:block; font-size:1.02rem; font-weight:800; color:var(--text);
    margin-bottom:.15rem;
  }

  /* ===================================================================
     THE CONVERSATION. Its own header so it is plainly a channel to
     somebody, and the voice controls pinned at its foot, where the words
     it produces appear.
     =================================================================== */
  #chatPanel {
    min-height:0; display:flex; flex-direction:column; overflow:hidden;
    padding:0;                      /* the head and foot run edge to edge */
  }
  .chathead {
    flex:none; display:flex; align-items:center; gap:.6rem;
    padding:.85rem 1rem; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, var(--accent-soft), transparent);
  }
  .chathead .face {
    flex:none; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, var(--squid-lit), var(--squid-mid) 62%,
               var(--squid-deep));
    box-shadow:var(--lip), 0 2px 6px rgba(49,91,125,.18);
  }
  .chathead .who { min-width:0; }
  .chathead .who b { display:block; font-size:.92rem; font-weight:800; color:var(--text); }
  #stateLabel { font-size:.74rem; font-weight:700; color:var(--accent-deep); }

  #chat {
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:.8rem;
    padding:.9rem .9rem 1rem; scrollbar-width:thin;
  }
  .msg { max-width:94%; display:flex; flex-direction:column; gap:.2rem; }
  .msg .who { font-size:.68rem; font-weight:700; color:var(--dim); padding:0 .3rem; }
  .msg .bubble {
    border-radius:var(--r-bubble); padding:.6rem .85rem;
    font-size:.88rem; line-height:1.62;
    white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere;
  }
  /* the tutor speaks in white, the student in the sea's own aqua */
  .msg.tutor { align-self:flex-start; }
  .msg.tutor .bubble {
    background:var(--panel-solid); border:1px solid var(--line); color:var(--text);
    border-top-left-radius:5px; box-shadow:0 1px 2px rgba(49,91,125,.05);
  }
  .msg.you { align-self:flex-end; align-items:flex-end; }
  .msg.you .bubble {
    background:linear-gradient(158deg, var(--aqua-fill-lit), var(--aqua-fill));
    border:1px solid var(--aqua-fill); color:#fff;
    border-top-right-radius:5px; box-shadow:0 2px 8px rgba(49,91,125,.18);
  }
  /* Machine talk (hint level, action) is smaller and quieter than speech.
     Quieter by size and weight only: an opacity on top of --dim composited it
     to 4.2:1, undoing the token that was picked to pass on this surface. */
  .msg .note {
    font-size:.68rem; font-weight:600; color:var(--dim); padding:0 .35rem;
    letter-spacing:.01em;
  }
  .sys {
    align-self:center; max-width:94%; text-align:center;
    font-size:.74rem; font-weight:600; color:var(--err);
    background:var(--err-soft); border-radius:var(--r-bubble); padding:.35rem .7rem;
  }

  /* the tutor is thinking: shown only during PROCESSING */
  #thinking { align-self:flex-start; }
  #thinking[hidden] { display:none; }
  #thinking .bubble {
    display:flex; align-items:center; gap:.5rem;
    background:var(--accent-soft); border:1px solid var(--accent-line);
    color:var(--accent-deep); font-size:.79rem; font-weight:700;
  }
  .dots { display:inline-flex; gap:.22rem; }
  .dots i { width:.3rem; height:.3rem; border-radius:50%; background:var(--accent); opacity:.4; }
  @media (prefers-reduced-motion: no-preference) {
    .dots i { animation:blink 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay:.2s; }
    .dots i:nth-child(3) { animation-delay:.4s; }
    @keyframes blink { 40% { opacity:1; } }
  }

  /* ---- the voice controls, at the foot of the words they make ---- */
  .chatfoot {
    flex:none; display:flex; align-items:center; gap:.75rem;
    padding:.8rem 1rem .9rem; border-top:1px solid var(--line);
    background:var(--panel-solid);
  }
  #orb {
    flex:none; display:inline-flex; align-items:center; gap:.5rem;
    border-radius:var(--r-chip); border:1px solid var(--aqua-fill);
    background:linear-gradient(158deg, var(--aqua-fill-lit), var(--aqua-fill)); color:#fff;
    padding:.5rem 1.05rem .5rem .85rem; font:800 .84rem var(--font); cursor:pointer;
    box-shadow:0 2px 8px rgba(49,91,125,.20);
    transition:filter .18s, box-shadow .18s, transform .1s;
  }
  #orb .dot {
    width:.5rem; height:.5rem; border-radius:50%; background:#fff; opacity:.85;
    transition:background .25s, box-shadow .25s, opacity .25s;
  }
  #orb:hover { filter:brightness(1.06); box-shadow:var(--shadow-lift); }
  #orb:active { transform:translateY(1px); box-shadow:0 1px 4px rgba(49,91,125,.22); }
  #orb:focus-visible { outline:2px solid var(--accent-deep); outline-offset:3px; }
  /* once it is running the button stops being a button and becomes the light */
  #orb:disabled {
    cursor:default; background:var(--panel-tint); color:var(--text-mid);
    border-color:var(--line); box-shadow:none; filter:none;
  }
  #orb:disabled .dot { background:var(--dim); opacity:1; }
  #orb[data-state="LISTENING"] .dot      { background:var(--accent); }
  #orb[data-state="USER_SPEAKING"] .dot  { background:var(--sea-deep); box-shadow:0 0 0 4px var(--accent-soft); }
  #orb[data-state="PROCESSING"] .dot     { background:var(--peach); }
  #orb[data-state="AGENT_SPEAKING"] .dot { background:var(--coral); box-shadow:0 0 0 4px var(--err-soft); }
  #status {
    min-width:0; font-size:.72rem; line-height:1.45; color:var(--dim);
    word-break:keep-all;
  }

  /* ===================================================================
     RESPONSIVE. Under 1000px the conversation moves below the board,
     because a 300px column beside a board is not a column any more. The
     page scrolls rather than dividing one screen three ways.
     =================================================================== */
  @media (max-width: 1000px) {
    header { max-width:calc(1440px + 2rem); padding:.7rem 1rem .35rem; }
    /* the reef is pinned to the viewport, so on a page that scrolls it only
       shows at the end of the scroll: leave it that much room */
    main { flex:none; padding:.35rem 1rem 1.15rem; }
    .grid { grid-template-columns:minmax(0,1fr); gap:.9rem; }
    #board { min-height:24rem; }
    #chatPanel { min-height:26rem; }
    .msg { max-width:88%; }
  }
  @media (max-width: 620px) {
    header { flex-wrap:wrap; gap:.5rem .7rem; max-width:calc(1440px + 1.4rem); padding-inline:.7rem; }
    .brand { margin-right:auto; }
    .brand .sub { display:none; }
    main { padding:.35rem .7rem 1rem; }
    #board { padding:.9rem 1rem 1.1rem; min-height:21rem; }
    #tutorStage { width:76px; height:88px; }
    #tutorStage .squid, #tutorStage video { width:76px; }
    #boardHead { gap:.75rem; }
    #problemText { font-size:1rem; }
    .boardline.key { font-size:1.16rem; }
    .chatfoot { flex-wrap:wrap; gap:.5rem .7rem; }
    #status { flex:1 0 100%; }
  }
</style>
</head>
<body>
  <!-- The drawn tutor: the fallback shown until squid-thinking.webm reports
       it can paint a frame, at 100px on the board and 76px on a phone. Hand
       drawn as SVG rather than an image file so it can tint itself for both
       colour schemes and ship
       inside the one file the server serves. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- gradients live OUTSIDE the symbol: a <use> clone resolves url(#…)
           against the document, and a gradient hidden inside the symbol is a
           coin flip across browsers -->
      <radialGradient id="sqMantle" cx="34%" cy="24%" r="82%">
        <stop offset="0" stop-color="var(--squid-lit)"/>
        <stop offset="56%" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </radialGradient>
      <radialGradient id="sqHead" cx="34%" cy="18%" r="88%">
        <stop offset="0" stop-color="var(--squid-lit)"/>
        <stop offset="62%" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </radialGradient>
      <linearGradient id="sqArm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--squid-mid)"/>
        <stop offset="100%" stop-color="var(--squid-deep)"/>
      </linearGradient>
      <symbol id="squid" viewBox="0 0 120 152">
        <g>
          <!-- arms: tapered, splayed, back pair first so the front three
               overlap them. Long enough that the silhouette reads as a squid
               and not as a body with legs. -->
          <g fill="url(#sqArm)" opacity=".78">
            <path d="M40 106c-6 13-11 26-13 39-1 6 6 8 8 2 4-14 8-27 12-41z"/>
            <path d="M80 106c6 13 11 26 13 39 1 6-6 8-8 2-4-14-8-27-12-41z"/>
          </g>
          <g fill="url(#sqArm)">
            <path d="M49 108c-4 14-8 27-8 41 0 6 8 6 9 0 2-14 4-27 7-41z"/>
            <path d="M56 109c-1 15-1 29 0 43 0 6 8 6 8 0 1-14 1-28 0-43z"/>
            <path d="M71 108c4 14 8 27 8 41 0 6-8 6-9 0-2-14-4-27-7-41z"/>
          </g>
          <!-- head, then mantle on top of it -->
          <rect x="26" y="82" width="68" height="36" rx="17" fill="url(#sqHead)"/>
          <path d="M60 6c26 0 40 20 40 46 0 24-16 40-40 40S20 76 20 52C20 26 34 6 60 6z"
                fill="url(#sqMantle)"/>
          <!-- the light on top, and two spots, exactly as the reference reads -->
          <ellipse cx="45" cy="30" rx="15" ry="11" fill="#fff" opacity=".38" transform="rotate(-24 45 30)"/>
          <circle cx="76" cy="44" r="6" fill="var(--squid-deep)" opacity=".45"/>
          <circle cx="52" cy="68" r="4.5" fill="var(--squid-deep)" opacity=".38"/>
          <circle cx="78" cy="102" r="4" fill="var(--squid-deep)" opacity=".3"/>
          <!-- eyes -->
          <ellipse cx="44" cy="99" rx="7.5" ry="9" fill="#20303f"/>
          <ellipse cx="76" cy="99" rx="7.5" ry="9" fill="#20303f"/>
          <circle cx="41.6" cy="95.4" r="2.4" fill="#fff" opacity=".9"/>
          <circle cx="73.6" cy="95.4" r="2.4" fill="#fff" opacity=".9"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <!-- ==================================================================
       THE SCENE, in three planes: a blurred seabed far off, light and
       bubbles in the middle distance, and the reef in focus at the front.
       All of it is drawn here, in this file: no external images, nothing
       hotlinked, nothing whose licence anyone has to take on trust.
       ================================================================== -->
  <div class="scene" aria-hidden="true">
    <div class="far"></div>
    <div class="mid"></div>
    <div class="bubbles"></div>

  <!-- The reef: two stands of tube coral, a branching one, seaweed, and the
       sand they all stand on. It keeps its own proportions (a branching coral
       squashed to fit a strip becomes a worm) and its floor is drawn in, so
       nothing is cut off by the bottom of the window. -->
  <svg id="reef" viewBox="0 0 1440 260" aria-hidden="true" focusable="false">
    <defs>
      <!-- Every one of these is userSpaceOnUse, and it has to be: a coral stem
           is a straight vertical stroke, whose bounding box is zero wide, and
           an objectBoundingBox gradient on a zero-width box is simply not
           painted. The trunks vanished and left the branches floating. The
           coordinates below are the reef's own, before each cluster's scale. -->
      <!-- the anemone's fingers: pink tips, grey-lavender where they crowd -->
      <linearGradient id="anem" gradientUnits="userSpaceOnUse" x1="0" y1="85" x2="0" y2="250">
        <stop offset="0" stop-color="#f6c3d2"/><stop offset="42%" stop-color="#dbb4cd"/>
        <stop offset="100%" stop-color="#a3a2c6"/>
      </linearGradient>
      <linearGradient id="anemBack" gradientUnits="userSpaceOnUse" x1="0" y1="85" x2="0" y2="250">
        <stop offset="0" stop-color="#e2b6c8"/><stop offset="100%" stop-color="#9695bb"/>
      </linearGradient>
      <!-- the tulip cones: cream lit from above, lavender in the shade -->
      <linearGradient id="tulip" gradientUnits="userSpaceOnUse" x1="600" y1="110" x2="700" y2="245">
        <stop offset="0" stop-color="#fdedd6"/><stop offset="46%" stop-color="#f2d3cd"/>
        <stop offset="100%" stop-color="#bdb0d8"/>
      </linearGradient>
      <linearGradient id="tulipBack" gradientUnits="userSpaceOnUse" x1="600" y1="110" x2="700" y2="245">
        <stop offset="0" stop-color="#f6e2ce"/><stop offset="100%" stop-color="#ada2cc"/>
      </linearGradient>
      <!-- the staghorns: ivory with the faintest green in the branches -->
      <linearGradient id="horn" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="255">
        <stop offset="0" stop-color="#fdf7e6"/><stop offset="52%" stop-color="#f6efd2"/>
        <stop offset="100%" stop-color="#e7dcc0"/>
      </linearGradient>
      <linearGradient id="hornCool" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="255">
        <stop offset="0" stop-color="#f7f6e4"/><stop offset="55%" stop-color="#e9f0d6"/>
        <stop offset="100%" stop-color="#d9e2c4"/>
      </linearGradient>
      <radialGradient id="sand" cx="42%" cy="100%" r="72%">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <!-- the seabed the reef stands on, so nothing looks sliced off -->
      <linearGradient id="floor" gradientUnits="userSpaceOnUse" x1="0" y1="196" x2="0" y2="260">
        <stop offset="0" stop-color="#cdeaf5"/><stop offset="100%" stop-color="#a7dcee"/>
      </linearGradient>
      <linearGradient id="weed" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="250">
        <stop offset="0" stop-color="#cfeee2"/><stop offset="100%" stop-color="#8fc9c4"/>
      </linearGradient>
    </defs>

    <ellipse cx="560" cy="262" rx="760" ry="120" fill="url(#sand)"/>
    <!-- the floor: one soft rise the whole width, drawn BEFORE the reef so
         the corals sit on it rather than in front of a hard edge -->
    <path d="M0 260V232c150-16 268 10 408 6 132-4 226-24 356-22 128 2 214 20 342 16
             130-4 218-18 334-12v40z" fill="url(#floor)"/>
    <path d="M0 260V240c150-14 268 8 408 4 132-4 226-20 356-18 128 2 214 16 342 12
             130-4 218-14 334-10v32z" fill="#ffffff" opacity=".34"/>

    <!-- the long shadows the light throws to the right, on the floor -->
    <g fill="#7ea7d2" opacity=".2">
      <ellipse cx="300" cy="243" rx="180" ry="12" transform="rotate(-3 300 243)"/>
      <ellipse cx="720" cy="240" rx="150" ry="11" transform="rotate(-3 720 240)"/>
      <ellipse cx="520" cy="252" rx="230" ry="13" transform="rotate(-2 520 252)"/>
      <ellipse cx="1230" cy="246" rx="185" ry="11" transform="rotate(-3 1230 246)"/>
    </g>

    <!-- Each cluster is scaled about its own base, so it shrinks to scenery
         size without a branch ever being squashed out of shape. -->
    <!-- BACK LEFT: the anemone, a crowd of round-tipped fingers in an arc -->
    <g transform="translate(170 242) scale(.58) translate(-170 -242)"
       fill="none" stroke-linecap="round" stroke-width="15">
      <g stroke="url(#anemBack)" opacity=".75">
        <path d="M62 238V126"/>  <path d="M92 238V108"/>  <path d="M122 238V96"/>
        <path d="M152 238V90"/>  <path d="M182 238V92"/>  <path d="M212 238V102"/>
        <path d="M242 238V118"/> <path d="M272 238V140"/>
      </g>
      <g stroke="url(#anem)">
        <path d="M76 242V136"/>  <path d="M106 242V116"/> <path d="M136 242V102"/>
        <path d="M166 242V96"/>  <path d="M196 242V100"/> <path d="M226 242V112"/>
        <path d="M256 242V130"/> <path d="M286 242V154"/>
      </g>
    </g>

    <!-- BACK CENTRE: the tulips, wide at the lip and narrowing to the floor -->
    <g transform="translate(730 240) scale(.58) translate(-730 -240)">
      <g fill="url(#tulipBack)" opacity=".85">
        <path d="M596 236l8-96a24 24 0 0 1 48 0l8 96z"/>
        <path d="M676 236l7-112a25 25 0 0 1 50 0l7 112z"/>
        <path d="M756 236l8-92a23 23 0 0 1 46 0l8 92z"/>
      </g>
      <g fill="url(#tulip)">
        <path d="M632 240l9-84a26 26 0 0 1 52 0l9 84z"/>
        <path d="M716 240l8-104a27 27 0 0 1 54 0l8 104z"/>
        <path d="M800 240l9-78a25 25 0 0 1 50 0l9 78z"/>
      </g>
    </g>

    <!-- FRONT: the staghorns, branching into round-tipped fingers -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(560 252) scale(.58) translate(-560 -252)">
      <g stroke="url(#hornCool)" stroke-width="26" opacity=".92">
        <path d="M340 250v-64"/>
        <path d="M340 200l-26-38"/> <path d="M340 196l24-42"/>
        <path d="M436 250v-86"/>
        <path d="M436 186l-30-44"/> <path d="M436 178l28-46"/> <path d="M406 160l-6-30"/>
      </g>
      <g stroke="url(#horn)" stroke-width="30">
        <path d="M386 252v-96"/>
        <path d="M386 176l-32-48"/> <path d="M386 168l30-50"/> <path d="M354 132l-4-34"/>
        <path d="M500 252v-72"/>
        <path d="M500 196l-28-40"/> <path d="M500 190l26-44"/>
        <path d="M556 252v-54"/>   <path d="M556 210l-22-32"/>
      </g>
      <g stroke="url(#horn)" stroke-width="24" opacity=".95">
        <path d="M900 250v-58"/>  <path d="M900 206l-22-34"/> <path d="M900 200l20-36"/>
        <path d="M962 250v-78"/>  <path d="M962 190l-26-40"/> <path d="M962 184l24-40"/>
        <path d="M1016 250v-46"/> <path d="M1016 214l-18-28"/>
      </g>
    </g>

    <!-- RIGHT, further off: one small anemone and a pair of staghorns -->
    <g opacity=".8" transform="translate(1260 245) scale(.52) translate(-1260 -245)">
      <g fill="none" stroke="url(#anemBack)" stroke-linecap="round" stroke-width="13">
        <path d="M1186 240V152"/> <path d="M1212 240V136"/> <path d="M1238 240V128"/>
        <path d="M1264 240V134"/> <path d="M1290 240V148"/>
      </g>
      <g fill="url(#tulipBack)">
        <path d="M1114 238l7-78a21 21 0 0 1 42 0l7 78z"/>
      </g>
      <g fill="none" stroke="url(#horn)" stroke-linecap="round" stroke-linejoin="round"
         stroke-width="22">
        <path d="M1340 250v-62"/> <path d="M1340 202l-20-32"/> <path d="M1340 196l18-34"/>
        <path d="M1400 250v-44"/>
      </g>
    </g>

    <!-- seaweed, bending the way a current bends it: behind the corals on the
         left, in front of nothing on the right -->
    <g fill="none" stroke="url(#weed)" stroke-linecap="round" opacity=".9">
      <g stroke-width="9">
        <path d="M330 252c-14-26 12-44 0-70s10-40 2-58"/>
        <path d="M352 252c10-24-10-42 2-66s-6-36 4-52"/>
      </g>
      <g stroke-width="7" opacity=".8">
        <path d="M1074 252c-12-22 10-38 0-60s8-34 2-48"/>
        <path d="M1092 252c8-20-8-36 2-56s-4-30 4-44"/>
        <path d="M600 254c-10-18 8-32 0-50s6-28 2-40"/>
      </g>
    </g>
  </svg>
  </div>

  <header>
    <div class="brand">
      <span class="name">오징어 튜터</span>
      <span class="sub">Visual Socratic Tutor</span>
    </div>
    <!-- both are written by script, so both announce themselves; the turn
         state is deliberately NOT a live region, it changes every few
         seconds and would talk over everything else -->
    <div id="conn" role="status">연결 대기</div>
    <button id="hangup" type="button" hidden>연결 종료</button>
  </header>

  <main>
    <div class="grid">
      <section id="board" class="panel">
        <div id="boardHead">
          <!-- the tutor itself: the clip when it has loaded, the drawn one
               until then, plus the ink it writes with and the arithmetic it
               mutters while it thinks -->
          <div id="tutorStage">
            <div class="avatar">
              <svg class="squid" viewBox="0 0 120 152" aria-label="오징어 튜터"><use href="#squid"/></svg>
              <video id="squidThinking" src="squid-thinking.webm"
                     muted loop playsinline preload="auto" aria-hidden="true"></video>
            </div>
            <!-- the symbols first: :nth-of-type counts every <span> sibling,
                 so an ink span in front of them shifts all four by one and
                 leaves the last with no position at all -->
            <span class="sym" aria-hidden="true">+</span>
            <span class="sym" aria-hidden="true">√</span>
            <span class="sym" aria-hidden="true">×</span>
            <span class="sym" aria-hidden="true">π</span>
            <span class="ink" aria-hidden="true"></span>
          </div>

          <div class="headtext">
            <div id="drop" tabindex="0" role="button" hidden>
              <img id="thumb" alt="문제 사진 미리보기">
              <div>
                <b>문제 사진 올리기</b> · 클릭하거나, 끌어다 놓거나, Ctrl+V
                <div id="sheetname" class="meta"></div>
              </div>
            </div>
            <input type="file" id="sheet" accept="image/*">

            <section id="problemCard" hidden>
              <span class="cardlabel">지금 푸는 문제</span>
              <div id="problemText"></div>
              <div id="problemEqs"></div>
            </section>
          </div>
        </div>

        <div id="boardLines">
          <div id="boardEmpty">
            <b>같이 풀어 볼까요?</b>
            문제를 보여 주면 여기에 하나씩 짚어 가며 적을게요.
          </div>
        </div>
      </section>

      <section id="chatPanel" class="panel">
        <div class="chathead">
          <span class="face" aria-hidden="true"></span>
          <span class="who">
            <b>오징어 튜터</b>
            <span id="stateLabel">대기 중</span>
          </span>
        </div>
        <div id="chat">
          <div id="thinking" class="msg tutor" hidden>
            <div class="bubble">
              <span id="stageText">튜터가 생각하는 중이에요</span>
              <span class="dots"><i></i><i></i><i></i></span>
            </div>
          </div>
        </div>
        <div class="chatfoot">
          <button id="orb" type="button" aria-label="대화 시작">
            <i class="dot"></i><span>대화 시작</span>
          </button>
          <div id="status" role="status">마이크를 허용한 뒤 그냥 말하면 됩니다.</div>
        </div>
      </section>
    </div>
  </main>

  <audio id="player"></audio>

<script>
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };

const SAMPLE_RATE = 16000;
const FRAME_SAMPLES = 512;          // Silero's window at 16 kHz (32 ms)

const IMAGE_FRAME = 0x01, AUDIO_FRAME = 0x02, TTS_FRAME = 0x03;

let ws = null;
let turnState = "";                 // LISTENING | USER_SPEAKING | PROCESSING | AGENT_SPEAKING
let streamSeq = 0;
let worksheet = null;               // optional jpeg bytes for capture_request
let uploadMode = false;             // set from the server's config event

// With barge-in the mic stays open while the tutor talks, so the student can
// cut in; the server judges those frames at a higher bar. It stays shut during
// PROCESSING either way — there is nothing to interrupt while it thinks, and a
// half-turn must not survive into the answer.
let bargeIn = false;
const micOpen = () =>
  turnState === "LISTENING" ||
  turnState === "USER_SPEAKING" ||
  (bargeIn && turnState === "AGENT_SPEAKING");

// --- the project's binary framing, in ~15 lines ----------------------------
function encodeFrame(type, header, payload) {
  const head = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(5 + head.length + payload.length);
  new DataView(out.buffer).setUint32(1, head.length, false);  // big endian
  out[0] = type;
  out.set(head, 5);
  out.set(payload, 5 + head.length);
  return out;
}

function decodeFrame(buffer) {
  const bytes = new Uint8Array(buffer);
  const headLen = new DataView(buffer).getUint32(1, false);
  return {
    type: bytes[0],
    header: JSON.parse(new TextDecoder().decode(bytes.subarray(5, 5 + headLen))),
    payload: bytes.subarray(5 + headLen),
  };
}

const sendEvent = (event, data = {}) => {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: "EVENT", event, data, ts: Date.now() }));
};

// --- math typesetting -------------------------------------------------------
// The server normalizes everything the tutor writes into ONE small display
// vocabulary (x² · √ log₃ f'(1) 1/5 — mathspeak.displayable). These two
// functions take that vocabulary the last mile: find the math runs inside a
// Korean sentence, translate the run to TeX, hand it to KaTeX. No KaTeX (CDN
// down, offline) → the unicode text stands as-is, which is yesterday's page.
const SUBS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7",
               "₈":"8","₉":"9","ₐ":"a","ₑ":"e","ₕ":"h","ₖ":"k","ₗ":"l","ₘ":"m",
               "ₙ":"n","ₒ":"o","ₚ":"p","ₛ":"s","ₜ":"t","ₓ":"x",
               // a_{n+1}: the operators sink with the rest of the subscript
               "₊":"+","₋":"-","₌":"=","₍":"(","₎":")" };
// the server's unicode superscripts (x², x¹⁰, xⁿ), back to TeX for KaTeX
const SUP_CHARS = "⁰¹²³⁴⁵⁶⁷⁸⁹ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻ";
const SUP_ASCII = "0123456789abcdefghijklmnoprstuvwxyz";
const SUPS = Object.fromEntries([...SUP_CHARS].map((c, i) => [c, SUP_ASCII[i]]));
const SUP_RE = new RegExp("[" + SUP_CHARS + "]+", "g");
// derived from the tables above, so a character added there is understood
// everywhere: a run that breaks mid-subscript renders as half an expression
const SUB_CHARS = Object.keys(SUBS).join("");
const SUB_RE = new RegExp("[" + SUB_CHARS + "]+", "g");
const MATH_RUN = new RegExp(
  "[0-9A-Za-z+\\-=^*/().,'′²³√·_{} " + SUB_CHARS + SUP_CHARS + "]+", "g");
const MATH_SIGNAL = new RegExp(
  "[=^²³√·′]|[" + SUB_CHARS + SUP_CHARS + "]|\\w\\/\\w|[A-Za-z]['_]|"
  + "\\b(?:log|sqrt|sin|cos|tan)\\b");

function toTex(s) {
  // function names first: "log₃" has no word boundary before the subscript
  s = s.replace(/\b(log|sin|cos|tan)(?![A-Za-z])/g, "\\$1");
  s = s.replace(/√\(([^()]*)\)/g, "\\sqrt{$1}");
  s = s.replace(SUP_RE, (m) => "^{" + [...m].map(c => SUPS[c]).join("") + "}");
  // the (?!\{) keeps these off the braced groups the lines above just built:
  // re-matching "_{n+k}" would take "_{n" and leave "+k}" dangling
  s = s.replace(/\^(?!\{)([A-Za-z0-9]+)/g, "^{$1}");
  s = s.replace(SUB_RE, (m) => "_{" + [...m].map(c => SUBS[c]).join("") + "}");
  s = s.replace(/_(?!\{)([A-Za-z0-9]+)/g, "_{$1}");   // raw a_4 that slipped through
  s = s.replace(/·/g, "\\cdot ");
  s = s.replace(/(?<![}\w])(\w+)\s*\/\s*(\w+)(?![\w{])/g, "\\frac{$1}{$2}");
  return s;
}

/** text → { frag, hasMath }: math runs typeset, everything else plain text. */
function mathify(text) {
  const frag = document.createDocumentFragment();
  if (!window.katex) { frag.append(text); return { frag, hasMath: false }; }
  let last = 0, found = false;
  for (const m of text.matchAll(MATH_RUN)) {
    const run = m[0], at = m.index;
    // a run must LOOK like math, not just be latin letters in a sentence
    const core = run.trim();
    if (core.length < 2 || !MATH_SIGNAL.test(core)) continue;
    frag.append(text.slice(last, at));
    frag.append(run.slice(0, run.indexOf(core)));          // leading spaces
    const span = document.createElement("span");
    try {
      span.innerHTML = katex.renderToString(toTex(core), { throwOnError: true });
    } catch (e) {
      span.textContent = core;         // one bad run must not lose the sentence
    }
    frag.append(span);
    frag.append(run.slice(run.indexOf(core) + core.length)); // trailing spaces
    last = at + run.length;
    found = true;
  }
  frag.append(text.slice(last));
  return { frag, hasMath: found };
}

// --- 1. capture: mic → worklet → 512-sample int16 frames → server ----------
// Held so that 연결 종료 can actually let go of them: a page that closes the
// socket but leaves the microphone open is still recording, and the browser
// says so with a tab indicator the student cannot turn off.
let micStream = null, audioCtx = null;

// A failed start must be retryable. This listener used to be {once:true}, so a
// dismissed microphone prompt consumed it: the button stayed lit, said 대화
// 시작, and did nothing for the rest of the page's life. The guard below is
// what stops a double click opening two microphones instead.
let starting = false;

async function start() {
  if (starting || micStream) return;
  starting = true;
  try {
    await openMic();
  } finally {
    starting = false;
  }
}

async function openMic() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true,
               channelCount: 1 },
    });
  } catch (e) {
    setStatus("마이크 권한이 필요합니다 (localhost 또는 HTTPS에서 열어주세요). "
              + "허용한 뒤 다시 눌러 주세요: " + e.message);
    return;
  }

  // Ask for 16 kHz so the browser resamples for us — the server's VAD needs it.
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.sampleRate !== SAMPLE_RATE) {
    setStatus(`브라우저가 ${ctx.sampleRate} Hz를 반환했습니다. Chrome/Edge를 사용해 주세요.`);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  try {
    await ctx.audioWorklet.addModule("worklet.js");
  } catch (e) {
    setStatus("오디오 모듈을 불러오지 못했습니다. 새로고침한 뒤 다시 시도해 주세요: " + e.message);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  const capture = new AudioWorkletNode(ctx, "pcm-capture");
  ctx.createMediaStreamSource(stream).connect(capture);
  capture.port.onmessage = (e) => onSamples(e.data);
  micStream = stream;
  audioCtx = ctx;

  const speakerReady = await unlockAudio();   // must happen inside this click
  connect();

  // from here on the button is a status light, not a control, and there is
  // something running to hang up on
  const orb = $("orb");
  orb.disabled = true;
  orb.querySelector("span").textContent = "마이크 켜짐";
  orb.setAttribute("aria-label", "마이크 켜짐");
  $("hangup").hidden = false;
  setStatus(
    speakerReady
      ? "핸즈프리로 대화하세요. 튜터 목소리는 이 기기에서 나옵니다."
      : "마이크는 열렸지만 스피커가 차단되었습니다. 페이지를 한 번 클릭해 주세요."
  );
}

/** 연결 종료: let go of everything this page took, and offer to start again. */
function hangUp() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  stopSpeaking(false);        // hanging up is not barging in: say nothing
  setState("");
  swim(false);
  const orb = $("orb");
  orb.disabled = false;
  orb.removeAttribute("data-state");
  orb.querySelector("span").textContent = "다시 연결";
  orb.setAttribute("aria-label", "다시 연결");
  $("hangup").hidden = true;
  setConn("연결 종료됨", "");
  setStatus("연결을 끊었습니다. 다시 연결을 누르면 이어서 할 수 있어요.");
}

let pending = new Float32Array(0);
function onSamples(block) {
  if (!micOpen()) return;               // muted while the tutor thinks or speaks
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const joined = new Float32Array(pending.length + block.length);
  joined.set(pending);
  joined.set(block, pending.length);
  pending = joined;

  while (pending.length >= FRAME_SAMPLES) {
    const frame = pending.subarray(0, FRAME_SAMPLES);
    pending = pending.slice(FRAME_SAMPLES);
    const pcm = new Int16Array(FRAME_SAMPLES);
    for (let i = 0; i < FRAME_SAMPLES; i++) {
      const s = Math.max(-1, Math.min(1, frame[i]));   // clamp: overflow screeches
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;        // float32 → int16 LE
    }
    ws.send(encodeFrame(AUDIO_FRAME, {
      stream_id: "browser", sample_rate: SAMPLE_RATE, bits: 16, channels: 1,
      seq: ++streamSeq, last: false,
    }, new Uint8Array(pcm.buffer)));
  }
}

// --- 2. one socket, both directions ---------------------------------------
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/browser`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => sendEvent("hello", { device_id: "browser", proto: 1, caps: ["mic", "speaker"] });
  ws.onclose = () => {
    setState("");
    setConn("연결 끊김", "down");
    setStatus("연결이 끊어졌습니다. 새로고침 해주세요.");
  };
  ws.onmessage = (e) => (typeof e.data === "string" ? onEvent(JSON.parse(e.data)) : onBinary(e.data));
}

function setConn(text, cls) {
  const conn = $("conn");
  conn.textContent = text;
  conn.className = cls || "";
}

function onEvent(msg) {
  const d = msg.data || {};
  switch (msg.event) {
    case "hello_ack":   setConn("연결됨", "ok"); setStatus("연결됐어요. 말을 시작하세요."); break;
    case "turn_state":  setState(d.state); break;
    case "config":
      bargeIn = !!d.barge_in;
      // Only an upload-mode server takes a photo from this page; with a phone
      // watching, the box would be an invitation to nowhere.
      uploadMode = d.input_mode === "upload";
      $("drop").hidden = !uploadMode;
      break;
    case "barge_in":    stopSpeaking(); break;
    case "transcript":  addTurn("you", d.text || "(인식 실패)"); break;
    case "tutor_says":  addTurn("tutor", d.text); break;
    case "board":       for (const line of d.lines || []) boardWrite(line); break;
    case "figure":      boardDraw(d); break;
    case "stage":       setStage(d.text); break;
    case "solved":      addSolved(d.text); break;
    case "problem":     showProblem(d); break;
    case "hint_issued": note(`힌트 L${d.level} · ${d.action}`); break;
    case "capture_request": sendWorksheet(d.capture_id); break;
    case "error":       addTurn("err", d.message || JSON.stringify(d)); break;
  }
}

function onBinary(buffer) {
  const { type, header, payload } = decodeFrame(buffer);
  if (type === TTS_FRAME) onTts(header, payload);
}

function setState(s) {
  turnState = s;
  // a data attribute, not a class: the state light is one dot inside the
  // button, and the button keeps its own classes
  const orb = $("orb");
  if (orb.disabled) orb.dataset.state = s;
  const label = {
    LISTENING: "듣는 중", USER_SPEAKING: "말하는 중",
    PROCESSING: "생각 중", AGENT_SPEAKING: "튜터 발화 중",
  }[s] || "대기";
  $("stateLabel").textContent = label;
  orb.setAttribute("aria-label", label);
  swim(s === "PROCESSING");
  const thinking = $("thinking");
  thinking.hidden = s !== "PROCESSING";
  if (!thinking.hidden) {
    $("chat").appendChild(thinking);     // always after the newest message
    scrollChat();
  }
  if (s === "LISTENING")                 // a fresh turn starts generic
    $("stageText").textContent = "튜터가 생각하는 중이에요";
}

// The tutor swims while the pipeline works, and only then: a loop that never
// stops stops meaning "working". Paused it sits on its first frame, so the
// squid in the corner is the same squid whether or not it is moving. Under
// prefers-reduced-motion it never plays and the stage line carries the
// progress instead.
const STILL = window.matchMedia("(prefers-reduced-motion: reduce)");
// only once it can actually show a frame does the drawn fallback stand down
$("squidThinking").addEventListener("loadeddata", () => {
  $("tutorStage").classList.add("hasclip");
});
function swim(on) {
  const clip = $("squidThinking");
  const play = on && !STILL.matches;
  // the stage carries the swimming pose and the drifting symbols; the clip
  // carries the tutor itself
  $("tutorStage").classList.toggle("thinking", play);
  if (play) clip.play().catch(() => {});   // blocked: it stays still
  else { clip.pause(); clip.currentTime = 0; }
}

/** The tutor runs along the top of the board and lets the ink go. One shot,
    on the turn a line is actually written — never a loop, because a squid
    that writes forever is writing nothing. */
let writingTimer = null;
function writeStroke() {
  if (STILL.matches) return;
  const stage = $("tutorStage");
  stage.classList.remove("writing");
  void stage.offsetWidth;                  // restart the animation, not extend it
  stage.classList.add("writing");
  clearTimeout(writingTimer);
  writingTimer = setTimeout(() => stage.classList.remove("writing"), 1500);
}

// What the pipeline is doing right now (server `stage` events) — the screen
// carries the progress so the voice does not have to narrate it.
function setStage(text) {
  if (!text) return;
  $("stageText").textContent = text;
  if (!$("thinking").hidden) scrollChat();
}

// --- the problem card and the board ----------------------------------------
function showProblem(d) {
  const text = (d.text || "").trim();
  const eqs = d.equations || [];
  if (!text && !eqs.length) return;
  problemTitle = text;
  currentDialogue = [];                // a new problem starts a fresh transcript
  const pt = $("problemText");
  pt.textContent = "";
  pt.append(mathify(text).frag);
  const box = $("problemEqs");
  box.textContent = "";
  // the server sends only equations the statement does NOT already spell out
  for (const eq of eqs) {
    const line = document.createElement("div");
    line.append(mathify(eq).frag);
    box.appendChild(line);
  }
  $("problemCard").hidden = false;
  boardClear();                          // a new problem starts a clean board
}

// --- the solved-problems archive -------------------------------------------
// The PANEL is on hold, so nothing is drawn. What is kept is the transcript it
// will be built from: the conversation since the last problem event, cleared
// when the server says that problem is DONE (a `solved` event from the finish
// path, not from a mere "맞아요"). Two lines, and the archive can come back
// without the lesson having lost anything in the meantime.
let currentDialogue = [];              // {kind, text} since the last problem event
let problemTitle = "";

function addSolved(title) {
  console.info("solved: %s (%d turns)", title || problemTitle, currentDialogue.length);
  currentDialogue = [];
}

let boardSeen = new Set();             // one problem's writing, no duplicates

function boardClear() {
  boardSeen = new Set();
  const lines = $("boardLines");
  lines.textContent = "";
  const empty = document.createElement("div");
  empty.id = "boardEmpty";
  const invite = document.createElement("b");
  invite.textContent = "같이 풀어 볼까요?";
  empty.append(invite, "문제를 보여 주면 여기에 하나씩 짚어 가며 적을게요.");
  lines.appendChild(empty);
}

/** A function sketched on the board. The markup is built by the server (sympy
    samples the curve there), so this only has to place it — and the same leak
    guard that screens the spoken hint has already seen it. */
/** ONE grid per problem, replaced in place. The server re-declares the whole
    scene each turn — a curve that has served its purpose is simply absent
    from the next one — so the picture must CHANGE rather than a second
    picture appearing beneath it. */
function boardDraw(d) {
  const svg = d && d.svg;
  if (!svg) return;
  const id = `fig:${d.id || d.of || "scene"}`;
  const key = `${id}|${d.of}|${d.note || ""}`;
  if (boardSeen.has(key)) return;      // the same scene twice is not a change
  boardSeen.add(key);

  let box = document.querySelector(`[data-figure="${CSS.escape(id)}"]`);
  const fresh = !box;
  if (fresh) {
    const empty = document.getElementById("boardEmpty");
    if (empty) empty.remove();
    box = document.createElement("div");
    box.className = "boardfigure";
    box.dataset.figure = id;
    $("boardLines").appendChild(box);
  }
  const paint = () => {
    box.innerHTML = svg;
    if (d.note) {
      // what to look at, in the same margin voice the written lines use
      const label = document.createElement("div");
      label.className = "note";
      label.textContent = d.note;
      box.appendChild(label);
    }
    box.classList.remove("fading");
    // Show the picture from ITS top, not the board's bottom. The sketch now
    // fills the board, so scrolling to the foot as a written line does would
    // put the legend (which says which curve is l) above the visible edge.
    const lines = $("boardLines");
    lines.scrollTop +=
      box.getBoundingClientRect().top - lines.getBoundingClientRect().top - 6;
  };
  if (fresh) return paint();
  // redrawing an existing grid: fade out the old scene so a curve leaving is
  // seen as leaving rather than as a flicker
  box.classList.add("fading");
  setTimeout(paint, 180);
}

/** The board shows ONLY what the tutor deliberately wrote (the `board`
    event) — the whiteboard move behind the spoken hint, typeset. Sentence
    transcription used to land here too and read as a strange half-solution;
    sentences live in the chat now, full stop. */
function boardWrite(item) {
  // {expr, note} from the server; a bare string still works
  const expr = ((typeof item === "string" ? item : item && item.expr) || "").trim();
  const note = ((typeof item === "string" ? "" : item && item.note) || "").trim();
  if (!expr || boardSeen.has(expr)) return;
  boardSeen.add(expr);
  writeStroke();                         // the tutor goes and writes it
  const lines = $("boardLines");
  const empty = document.getElementById("boardEmpty");
  if (empty) empty.remove();
  const line = document.createElement("div");
  line.className = "boardline key";
  const math = document.createElement("div");
  math.append(mathify(expr).frag);
  line.appendChild(math);
  if (note) {
    // the margin scribble: why this line is here, in the tutor's shorthand
    const label = document.createElement("div");
    label.className = "note";
    label.textContent = note;
    line.appendChild(label);
  }
  lines.appendChild(line);
  lines.scrollTop = lines.scrollHeight;
}

// --- 3. playback: the tutor's audio, then tell the server we are done ------

// 50 ms of silence. Browsers only grant an <audio> element permission to play
// programmatically once it has played inside a user gesture — and play() on a
// SOURCELESS element rejects, which grants nothing. So play real (silent)
// audio during the 시작 click; every later hint then plays on its own.
const SILENCE =
  "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZ" +
  "ABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI" +
  "CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

async function unlockAudio() {
  const player = $("player");
  try {
    player.src = SILENCE;
    await player.play();
    return true;
  } catch (e) {
    return false;
  }
}

// The tutor's audio is a queue, not a single clip: a turn can be a filler
// followed by the hint, and a barge-in has to be able to throw away the part
// that has not started playing as well as the part that has.
//
// STREAMED SPEECH: one utterance now arrives as MANY small TTS frames (the
// server ships MP3 chunks while xAI is still rendering the tail), grouped by
// utterance_id and ordered by seq, the final one flagged last. Playback
// starts on the FIRST chunk via MediaSource — that is the whole point: the
// voice begins ~1.3s after synthesis starts instead of after the ~2.5s file.
// Where MediaSource cannot take mp3, chunks are collected and played whole,
// which is exactly the old behaviour.
let audioQueue = [];                     // Blobs (fallback) and stream objects
let playingUrl = null;
const ttsStreams = new Map();            // utterance_id → in-flight stream
const MSE_OK = window.MediaSource && MediaSource.isTypeSupported("audio/mpeg");

function onTts(header, bytes) {
  const id = header.utterance_id || "solo";
  // A stream begins at seq 0. A mid-stream chunk with no stream behind it is
  // the tail of an utterance a barge-in already threw away — starting playback
  // from the middle of an MP3 would be noise followed by a stall.
  if (header.seq > 0 && !ttsStreams.has(id)) return;
  if (!MSE_OK) {                         // fallback: whole-file, old behaviour
    let held = ttsStreams.get(id);
    if (!held) { held = []; ttsStreams.set(id, held); }
    held.push(bytes);
    if (header.last) {
      ttsStreams.delete(id);
      audioQueue.push(new Blob(held, { type: "audio/mpeg" }));
      if (!playingUrl) playNext();
    }
    return;
  }
  let st = ttsStreams.get(id);
  if (!st) {
    st = { id, url: null, ms: null, sb: null, chunks: [], ended: false };
    ttsStreams.set(id, st);
    audioQueue.push(st);
    if (!playingUrl) playNext();
  }
  st.chunks.push(bytes);
  if (header.last) { st.ended = true; ttsStreams.delete(id); }
  feedStream(st);
}

function feedStream(st) {
  // append exactly one pending chunk per updateend; close when drained
  if (!st.sb || st.url !== playingUrl || st.sb.updating) return;
  if (st.chunks.length) {
    st.sb.appendBuffer(st.chunks.shift());
  } else if (st.ended && st.ms.readyState === "open") {
    st.ms.endOfStream();
  }
}

function playNext() {
  const item = audioQueue.shift();
  if (!item) { playingUrl = null; return; }

  const player = $("player");
  let url;
  if (item instanceof Blob) {
    url = URL.createObjectURL(item);
  } else {                               // an in-flight stream: play as it arrives
    item.ms = new MediaSource();
    url = URL.createObjectURL(item.ms);
    item.url = url;
    item.ms.addEventListener("sourceopen", () => {
      if (playingUrl !== url) return;    // dropped before it even opened
      item.sb = item.ms.addSourceBuffer("audio/mpeg");
      item.sb.addEventListener("updateend", () => feedStream(item));
      feedStream(item);
    });
  }
  playingUrl = url;
  const done = () => {
    if (playingUrl !== url) return;      // already dropped by a barge-in
    URL.revokeObjectURL(url);
    playingUrl = null;
    if (audioQueue.length) { playNext(); return; }
    sendEvent("playback_done");          // the server reopens the mic after its tail guard
  };
  player.onended = done;
  player.onerror = done;                 // never leave the server waiting
  player.src = url;
  player.play().catch(() => {
    setStatus("자동 재생이 차단되었습니다. 페이지를 한 번 클릭한 뒤 다시 말해주세요.");
    done();
  });
}

/** The student cut in. Stop mid-word and drop everything not yet played.
    `announce` is false when the page itself is stopping (연결 종료), because
    "끼어들기" is a report about the student and they did not do it. */
function stopSpeaking(announce = true) {
  const player = $("player");
  const dropped = audioQueue.length + ttsStreams.size;
  audioQueue = [];
  ttsStreams.clear();                    // late chunks of dropped streams are ignored
  if (playingUrl) {
    URL.revokeObjectURL(playingUrl);
    playingUrl = null;
  }
  player.pause();
  // Detach the source, or the element keeps buffering what we just cancelled.
  player.removeAttribute("src");
  player.load();
  // Deliberately no playback_done: the server already knows, it told us to stop.
  if (announce)
    addTurn("err", dropped ? `끼어들기: 재생을 멈추고 대기 중이던 ${dropped}개를 지웠어요` : "끼어들기: 재생을 멈췄어요");
}

// --- 4. the worksheet photo ------------------------------------------------
// Three ways in, because the one that fits the moment is the one that gets
// used: choosing a file, dragging it, or pasting a screenshot straight from
// the clipboard — which is how most photos actually arrive on a laptop.
async function useWorksheet(file) {
  // In camera mode the box is hidden, but Ctrl+V still reaches the document:
  // accepting a paste there would stash a photo nobody can see and nothing
  // will use (the phone answers first), which is worse than ignoring it.
  if (!uploadMode || !file || !file.type.startsWith("image/")) return;
  worksheet = new Uint8Array(await file.arrayBuffer());
  $("sheetname").textContent =
    `${file.name || "붙여넣은 이미지"} · ${Math.round(worksheet.length / 1024)} KB`;
  // Show it back: the commonest failure is not a bad model but a photo that
  // turns out to be blurred, cropped short, or of the wrong page.
  const thumb = $("thumb");
  thumb.src = URL.createObjectURL(file);
  thumb.classList.add("has");
  $("drop").classList.add("has");
  setStatus("사진을 받았습니다. 이제 힌트를 물어보세요.");
}

$("sheet").addEventListener("change", (e) => useWorksheet(e.target.files[0]));
$("drop").addEventListener("click", () => $("sheet").click());
// It advertises itself as a button and takes tab focus, so Enter and Space
// have to work: a div with role="button" gets no synthesised click.
$("drop").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("sheet").click(); }
});

for (const type of ["dragenter", "dragover"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.add("over");
  });
}
for (const type of ["dragleave", "drop"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.remove("over");
  });
}
$("drop").addEventListener("drop", (e) => useWorksheet(e.dataTransfer.files[0]));

document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.files) {
    if (item.type.startsWith("image/")) { useWorksheet(item); return; }
  }
});

function sendWorksheet(captureId) {
  if (!worksheet) {
    // Nothing to read HERE. In camera mode that is the normal answer, not a
    // problem: the phone is the eye and was already asked first, so say
    // nothing. In upload mode the student really does need to pick a photo.
    sendEvent("capture_failed", { capture_id: captureId });
    if (uploadMode) setStatus("문제 사진이 아직 없어요. 위에 사진을 올려 주세요.");
    return;
  }
  ws.send(encodeFrame(IMAGE_FRAME, { capture_id: captureId, format: "jpeg" }, worksheet));
}

// --- 5. the conversation ---------------------------------------------------
function scrollChat() {
  const chat = $("chat");
  chat.scrollTop = chat.scrollHeight;
}

function addTurn(kind, text) {
  const chat = $("chat");
  const div = document.createElement("div");
  if (kind === "err") {
    div.className = "sys";
    div.textContent = text;
  } else {
    div.className = `msg ${kind}`;
    div.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
    div.querySelector(".who").textContent = kind === "you" ? "나" : "튜터";
    div.querySelector(".bubble").append(mathify(text).frag);
    currentDialogue.push({ kind, text });  // this problem's transcript-so-far
  }
  // the thinking bubble stays glued to the end while it is visible
  const thinking = $("thinking");
  chat.insertBefore(div, thinking.hidden ? null : thinking);
  scrollChat();
}

function note(text) {
  const turns = $("chat").querySelectorAll(".msg:not(#thinking)");
  const last = turns[turns.length - 1];
  if (!last) return;
  const meta = document.createElement("div");
  meta.className = "note";
  meta.textContent = text;
  last.appendChild(meta);
  scrollChat();
}

// NOT {once:true}: a denied microphone prompt would consume the listener and
// leave an enabled button wired to nothing. start() guards itself instead, and
// the button is disabled for the whole time a session is actually running.
$("orb").addEventListener("click", start);
$("hangup").addEventListener("click", hangUp);

// --- 6. the water ----------------------------------------------------------
// Eight bubbles, sized and paced apart so they never read as a row, and kept
// away from the middle where the board sits. Built here rather than in markup
// because the only thing that varies is numbers, and the CSS keyframe is
// already gated on prefers-reduced-motion.
for (const [size, left, seconds, delay] of
     [[13, 5, 24, 0], [7, 12, 30, 7], [18, 21, 26, 13], [9, 30, 33, 4],
      [11, 70, 28, 18], [16, 81, 23, 9], [7, 88, 31, 2], [12, 95, 27, 15]]) {
  const bubble = document.createElement("i");
  bubble.style.cssText =
    `width:${size}px;height:${size}px;left:${left}%;` +
    `animation-duration:${seconds}s;animation-delay:-${delay}s`;
  document.querySelector(".bubbles").appendChild(bubble);
}
</script>
</body>
