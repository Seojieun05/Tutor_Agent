<script>
const $ = (id) => document.getElementById(id);
const setStatus = (m) => { $("status").textContent = m; };

const SAMPLE_RATE = 16000;
const FRAME_SAMPLES = 512;          // Silero's window at 16 kHz (32 ms)

const IMAGE_FRAME = 0x01, AUDIO_FRAME = 0x02, TTS_FRAME = 0x03;

let ws = null;
let turnState = "";                 // LISTENING | USER_SPEAKING | PROCESSING | AGENT_SPEAKING
let streamSeq = 0;
let worksheet = null;               // optional jpeg bytes for capture_request
let uploadMode = false;             // set from the server's config event

// With barge-in the mic stays open while the tutor talks, so the student can
// cut in; the server judges those frames at a higher bar. It stays shut during
// PROCESSING either way — there is nothing to interrupt while it thinks, and a
// half-turn must not survive into the answer.
let bargeIn = false;
const micOpen = () =>
  turnState === "LISTENING" ||
  turnState === "USER_SPEAKING" ||
  (bargeIn && turnState === "AGENT_SPEAKING");

const STILL = window.matchMedia("(prefers-reduced-motion: reduce)");

// --- the project's binary framing, in ~15 lines ----------------------------
function encodeFrame(type, header, payload) {
  const head = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(5 + head.length + payload.length);
  new DataView(out.buffer).setUint32(1, head.length, false);  // big endian
  out[0] = type;
  out.set(head, 5);
  out.set(payload, 5 + head.length);
  return out;
}

function decodeFrame(buffer) {
  const bytes = new Uint8Array(buffer);
  const headLen = new DataView(buffer).getUint32(1, false);
  return {
    type: bytes[0],
    header: JSON.parse(new TextDecoder().decode(bytes.subarray(5, 5 + headLen))),
    payload: bytes.subarray(5 + headLen),
  };
}

const sendEvent = (event, data = {}) => {
  if (ws && ws.readyState === WebSocket.OPEN)
    ws.send(JSON.stringify({ type: "EVENT", event, data, ts: Date.now() }));
};

// --- math typesetting -------------------------------------------------------
// The server normalizes everything the tutor writes into ONE small display
// vocabulary (x² · √ log₃ f'(1) 1/5 — mathspeak.displayable). These two
// functions take that vocabulary the last mile: find the math runs inside a
// Korean sentence, translate the run to TeX, hand it to KaTeX. No KaTeX (CDN
// down, offline) → the unicode text stands as-is, which is yesterday's page.
const SUBS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6","₇":"7",
               "₈":"8","₉":"9","ₐ":"a","ₑ":"e","ₕ":"h","ₖ":"k","ₗ":"l","ₘ":"m",
               "ₙ":"n","ₒ":"o","ₚ":"p","ₛ":"s","ₜ":"t","ₓ":"x",
               // a_{n+1}: the operators sink with the rest of the subscript
               "₊":"+","₋":"-","₌":"=","₍":"(","₎":")" };
// the server's unicode superscripts (x², x¹⁰, xⁿ), back to TeX for KaTeX
const SUP_CHARS = "⁰¹²³⁴⁵⁶⁷⁸⁹ᵃᵇᶜᵈᵉᶠᵍʰⁱʲᵏˡᵐⁿᵒᵖʳˢᵗᵘᵛʷˣʸᶻ";
const SUP_ASCII = "0123456789abcdefghijklmnoprstuvwxyz";
const SUPS = Object.fromEntries([...SUP_CHARS].map((c, i) => [c, SUP_ASCII[i]]));
const SUP_RE = new RegExp("[" + SUP_CHARS + "]+", "g");
// derived from the tables above, so a character added there is understood
// everywhere: a run that breaks mid-subscript renders as half an expression
const SUB_CHARS = Object.keys(SUBS).join("");
const SUB_RE = new RegExp("[" + SUB_CHARS + "]+", "g");
const MATH_RUN = new RegExp(
  "[0-9A-Za-z+\\-=^*/().,'′²³√·_{} " + SUB_CHARS + SUP_CHARS + "]+", "g");
const MATH_SIGNAL = new RegExp(
  "[=^²³√·′]|[" + SUB_CHARS + SUP_CHARS + "]|\\w\\/\\w|[A-Za-z]['_]|"
  + "\\b(?:log|sqrt|sin|cos|tan)\\b");

function toTex(s) {
  // function names first: "log₃" has no word boundary before the subscript
  s = s.replace(/\b(log|sin|cos|tan)(?![A-Za-z])/g, "\\$1");
  s = s.replace(/√\(([^()]*)\)/g, "\\sqrt{$1}");
  s = s.replace(SUP_RE, (m) => "^{" + [...m].map(c => SUPS[c]).join("") + "}");
  // the (?!\{) keeps these off the braced groups the lines above just built:
  // re-matching "_{n+k}" would take "_{n" and leave "+k}" dangling
  s = s.replace(/\^(?!\{)([A-Za-z0-9]+)/g, "^{$1}");
  s = s.replace(SUB_RE, (m) => "_{" + [...m].map(c => SUBS[c]).join("") + "}");
  s = s.replace(/_(?!\{)([A-Za-z0-9]+)/g, "_{$1}");   // raw a_4 that slipped through
  s = s.replace(/·/g, "\\cdot ");
  s = s.replace(/(?<![}\w])(\w+)\s*\/\s*(\w+)(?![\w{])/g, "\\frac{$1}{$2}");
  return s;
}

/** text → { frag, hasMath }: math runs typeset, everything else plain text. */
function mathify(text) {
  const frag = document.createDocumentFragment();
  if (!window.katex) { frag.append(text); return { frag, hasMath: false }; }
  let last = 0, found = false;
  for (const m of text.matchAll(MATH_RUN)) {
    const run = m[0], at = m.index;
    // a run must LOOK like math, not just be latin letters in a sentence
    const core = run.trim();
    if (core.length < 2 || !MATH_SIGNAL.test(core)) continue;
    frag.append(text.slice(last, at));
    frag.append(run.slice(0, run.indexOf(core)));          // leading spaces
    const span = document.createElement("span");
    span.className = "mathrun";      // the box a too-wide formula scrolls in
    try {
      span.innerHTML = katex.renderToString(toTex(core), { throwOnError: true });
    } catch (e) {
      span.textContent = core;         // one bad run must not lose the sentence
    }
    frag.append(span);
    frag.append(run.slice(run.indexOf(core) + core.length)); // trailing spaces
    last = at + run.length;
    found = true;
  }
  frag.append(text.slice(last));
  return { frag, hasMath: found };
}

// --- 1. capture: mic → worklet → 512-sample int16 frames → server ----------
// Held so that 연결 종료 can actually let go of them: a page that closes the
// socket but leaves the microphone open is still recording, and the browser
// says so with a tab indicator the student cannot turn off.
let micStream = null, audioCtx = null;

// A failed start must be retryable. This listener used to be {once:true}, so a
// dismissed microphone prompt consumed it: the button stayed lit, said 대화
// 시작, and did nothing for the rest of the page's life. The guard below is
// what stops a double click opening two microphones instead.
let starting = false;

async function start() {
  if (starting || micStream) return;
  starting = true;
  try {
    await openMic();
  } finally {
    starting = false;
  }
}

async function openMic() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true,
               channelCount: 1 },
    });
  } catch (e) {
    setStatus("마이크 권한이 필요합니다 (localhost 또는 HTTPS에서 열어주세요). "
              + "허용한 뒤 다시 눌러 주세요: " + e.message);
    return;
  }

  // Ask for 16 kHz so the browser resamples for us — the server's VAD needs it.
  const ctx = new AudioContext({ sampleRate: SAMPLE_RATE });
  if (ctx.sampleRate !== SAMPLE_RATE) {
    setStatus(`브라우저가 ${ctx.sampleRate} Hz를 반환했습니다. Chrome/Edge를 사용해 주세요.`);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  try {
    await ctx.audioWorklet.addModule("worklet.js");
  } catch (e) {
    setStatus("오디오 모듈을 불러오지 못했습니다. 새로고침한 뒤 다시 시도해 주세요: " + e.message);
    stream.getTracks().forEach((t) => t.stop());
    ctx.close().catch(() => {});
    return;
  }
  const capture = new AudioWorkletNode(ctx, "pcm-capture");
  ctx.createMediaStreamSource(stream).connect(capture);
  capture.port.onmessage = (e) => onSamples(e.data);
  micStream = stream;
  audioCtx = ctx;

  const speakerReady = await unlockAudio();   // must happen inside this click
  connect();

  // from here on the button is a status light, not a control, and there is
  // something running to hang up on
  const orb = $("orb");
  orb.disabled = true;
  orb.querySelector("span").textContent = "마이크 켜짐";
  orb.setAttribute("aria-label", "마이크 켜짐");
  $("hangup").hidden = false;
  setStatus(
    speakerReady
      ? "핸즈프리로 대화하세요. 튜터 목소리는 이 기기에서 나옵니다."
      : "마이크는 열렸지만 스피커가 차단되었습니다. 페이지를 한 번 클릭해 주세요."
  );
}

/** 연결 종료: let go of everything this page took, and offer to start again. */
function hangUp() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
  stopSpeaking(false);        // hanging up is not barging in: say nothing
  setState("");
  const orb = $("orb");
  orb.disabled = false;
  orb.removeAttribute("data-state");
  orb.querySelector("span").textContent = "다시 연결";
  orb.setAttribute("aria-label", "다시 연결");
  $("hangup").hidden = true;
  setConn("연결 종료됨", "");
  setStatus("연결을 끊었습니다. 다시 연결을 누르면 이어서 할 수 있어요.");
}

let pending = new Float32Array(0);
function onSamples(block) {
  if (!micOpen()) return;               // muted while the tutor thinks or speaks
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const joined = new Float32Array(pending.length + block.length);
  joined.set(pending);
  joined.set(block, pending.length);
  pending = joined;

  while (pending.length >= FRAME_SAMPLES) {
    const frame = pending.subarray(0, FRAME_SAMPLES);
    pending = pending.slice(FRAME_SAMPLES);
    const pcm = new Int16Array(FRAME_SAMPLES);
    for (let i = 0; i < FRAME_SAMPLES; i++) {
      const s = Math.max(-1, Math.min(1, frame[i]));   // clamp: overflow screeches
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;        // float32 → int16 LE
    }
    ws.send(encodeFrame(AUDIO_FRAME, {
      stream_id: "browser", sample_rate: SAMPLE_RATE, bits: 16, channels: 1,
      seq: ++streamSeq, last: false,
    }, new Uint8Array(pcm.buffer)));
  }
}

// --- 2. one socket, both directions ---------------------------------------
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/browser`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => sendEvent("hello", { device_id: "browser", proto: 1, caps: ["mic", "speaker"] });
  ws.onclose = () => {
    setState("");
    setConn("연결 끊김", "down");
    setStatus("연결이 끊어졌습니다. 새로고침 해주세요.");
  };
  ws.onmessage = (e) => (typeof e.data === "string" ? onEvent(JSON.parse(e.data)) : onBinary(e.data));
}

function setConn(text, cls) {
  const conn = $("conn");
  conn.textContent = text;
  conn.className = cls || "";
}

function onEvent(msg) {
  const d = msg.data || {};
  switch (msg.event) {
    case "hello_ack":   setConn("연결됨", "ok"); setStatus("연결됐어요. 말을 시작하세요."); break;
    case "turn_state":  setState(d.state); break;
    case "config":
      bargeIn = !!d.barge_in;
      // Only an upload-mode server takes a photo from this page; with a phone
      // watching, the box would be an invitation to nowhere.
      uploadMode = d.input_mode === "upload";
      $("drop").hidden = !uploadMode;
      break;
    case "barge_in":    stopSpeaking(); break;
    case "transcript":  addTurn("you", d.text || "(인식 실패)"); break;
    case "tutor_says":  addTurn("tutor", d.text); break;
    case "board":       for (const line of d.lines || []) boardWrite(line); break;
    case "figure":      boardDraw(d); break;
    case "stage":       setStage(d.text); break;
    case "solved":      addSolved(d.text); break;
    case "problem":     showProblem(d); break;
    case "hint_issued": note(`힌트 L${d.level} · ${d.action}`); break;
    case "capture_request": sendWorksheet(d.capture_id); break;
    case "error":       addTurn("err", d.message || JSON.stringify(d)); break;
  }
}

function onBinary(buffer) {
  const { type, header, payload } = decodeFrame(buffer);
  if (type === TTS_FRAME) onTts(header, payload);
}

// ===========================================================================
// THE TUTOR AS A CHARACTER
//
// One element on a fixed layer with two sockets to land in. Everything below
// is placement: nothing here talks to the socket, and the pipeline cannot be
// held up by an animation.
// ===========================================================================
const tutor = $("tutor");
const float = tutor.querySelector(".float");

// Where the character sits inside its own frame when it is standing still,
// measured off the asset (tools that cut it print this). It is also the
// element's transform-origin, so scale and rotate happen about the squid
// rather than about a corner of empty water.
const SQ_CX = 0.352, SQ_CY = 0.514;

/** Put the character's centre on an element's centre, at a size and a lean. */
function land(anchor, { scale = 1, tilt = 0, ms = 620 } = {}) {
  if (!anchor) return;
  const r = anchor.getBoundingClientRect();
  // the box's own untransformed size: offsetWidth is immune to the transform
  const w = tutor.offsetWidth, h = tutor.offsetHeight;
  const x = r.left + r.width / 2 - w * SQ_CX;
  const y = r.top + r.height / 2 - h * SQ_CY;
  tutor.style.setProperty("--fly", (STILL.matches ? 0 : ms) + "ms");
  tutor.style.transform =
    `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale}) rotate(${tilt}deg)`;
}

// Where it is meant to be when nothing is happening, so a resize, a scroll or
// the end of a trip all have one answer to go back to.
let perch = { anchor: null, scale: 1, tilt: 0 };
function goHome(ms = 620) {
  perch = { anchor: $("squidHome"), scale: 1, tilt: 0 };
  land(perch.anchor, { scale: 1, tilt: 0, ms });
}
// The waypoints of a sweep are points, not elements — they are where the
// board WAS. If the window changes size mid-flight there is nothing live to
// measure, so the trip is abandoned and the character goes home.
function reperch() {
  // A flight is checked FIRST, but only against the rect it was actually
  // built from. Its path, the ink under it and every line's reveal delay came
  // out of one measurement of the writing area, so if that area has moved
  // there is nothing left to correct the trip to and it is abandoned. If it
  // has NOT moved this is just noise — the ResizeObserver fires every time a
  // line is appended, and treating that as a resize destroyed the pass on its
  // own first line.
  if (flight) {
    const now = document.querySelector(".writing").getBoundingClientRect();
    const moved = ["left", "top", "width", "height"]
      .some((k) => Math.abs(now[k] - passRect[k]) > 1);
    if (!moved) return;
    clearInk();
    goHome(0);
    return;
  }
  if (perch.anchor && perch.anchor.isConnected) {
    land(perch.anchor, { ...perch, ms: 0 });
    return;
  }
  clearInk();
  goHome(0);
}

// --- the state light --------------------------------------------------------
const STATE_WORDS = {
  LISTENING: ["듣는 중", "듣는 중"],
  USER_SPEAKING: ["말하는 중", "학생이 말하는 중"],
  PROCESSING: ["생각 중", "튜터가 생각하는 중"],
  AGENT_SPEAKING: ["말하는 중", "튜터가 말하는 중"],
};

function setState(s) {
  turnState = s;
  const [short, spoken] = STATE_WORDS[s] || ["대기", "대기 중"];
  // Everything below is a class or a text swap on nodes that already exist:
  // the first feedback after the student stops talking is a paint, not a
  // fetch. That is the whole budget.
  const chip = $("stateChip");
  chip.dataset.state = s || "";
  chip.lastElementChild.textContent = short;
  // The state is announced ONCE, by the live region in the conversation's
  // header. It used to be written over the button's aria-label as well, which
  // renamed a control after it had stopped being one and left a screen reader
  // saying "듣는 중" for a button that reads 마이크 켜짐.
  $("stateLabel").textContent = spoken;
  // a data attribute, not a class: the state light is one dot inside the
  // button, and the button keeps its own classes
  const orb = $("orb");
  if (orb.disabled) orb.dataset.state = s;

  const working = s === "PROCESSING";
  tutor.classList.toggle("busy", working);
  const thinking = $("thinking");
  thinking.hidden = !working;
  if (working) {
    $("chat").appendChild(thinking);     // always after the newest message
    scrollChat();
  }
  if (s === "PROCESSING") {
    // the FIRST feedback of the turn types out like the rest
    setStage("문제를 살펴보고 있어요…");
  }
  if (s === "LISTENING" || !s) {
    wroteThisTurn = false;
    clearInk();
    goHome();
  }
}

// What the pipeline is doing right now (server `stage` events) — the screen
// carries the progress so the voice does not have to narrate it.
//
// TYPED, not swapped. A line that appears whole and then sits still is a
// label; a line still being written is somebody doing something right now,
// which is the entire message these carry. Fast — a line lands in ~½s — and
// under reduced motion it appears whole. The element is not a live region
// (the state chip's label is), so the partial text is never announced.
let stageTimer = null;
function setStage(text) {
  if (!text) return;
  const el = $("stageText");
  clearInterval(stageTimer);
  el.textContent = text;
  if (!STILL.matches && text.length > 1) {
    let shown = 0;
    const step = Math.max(1, Math.ceil(text.length / (500 / 24)));
    el.textContent = "";
    stageTimer = setInterval(() => {
      shown = Math.min(text.length, shown + step);
      el.textContent = text.slice(0, shown);
      if (shown >= text.length) clearInterval(stageTimer);
    }, 24);
  }
  if (!$("thinking").hidden) scrollChat();
}

// --- the trip to the board --------------------------------------------------
// The tutor goes over when there is something to write, JETS across the
// writing area letting the ink go behind it, the lines are uncovered in its
// wake, and it comes back to the conversation — where, a moment later, it
// starts talking. One trip per turn: a squid that shuttles for every line of a
// four-line answer is a squid nobody can read past.
//
// A squid does not swim, it pulses: it fills its mantle, squeezes, and the
// water leaving pushes it the other way — mantle first, arms streaming behind,
// the jet coming out from under the arms. The first version of this had the
// character sliding along a path at a constant speed with its tentacles
// pointing at the floor the whole way, which is why it read as a sprite being
// dragged rather than as an animal moving.
//
// So two things carry it. The character is AIMED: its rotation is the tangent
// of the path it is on, plus the 90° that turns the drawn upright pose into a
// swimming one. And its SPEED is the reference clip's own, measured off it
// frame by frame — the leading edge of the drawn squid, every 40 ms, through
// one jet — so the build, the peak at about 40% of the stroke and the long
// glide are not an easing anyone chose by eye.
let wroteThisTurn = false;
let inkTimers = [];
let flight = null;                     // where the character is, and its heading
let passRect = { left: 0, top: 0, width: 0, height: 0 };  // what it was built from
let pulse = null;                      // what shape it is in, on its own clock

// The reference's own jet, normalised: distance covered by the fraction of the
// stroke elapsed, sampled at 40 ms. Fed to the keyframes as offsets, so the
// browser interpolates a path position and the character accelerates exactly
// as the reference does. Peak speed lands at sample 9 of 23.
const JET = [
  0, .006, .030, .061, .097, .145, .200, .267, .339, .424, .503, .576,
  .648, .715, .776, .830, .873, .915, .945, .970, .982, .994, 1,
];

// RIGHT to left, and that is not a compositional preference — it is the only
// way the approach is a movement at all. The tutor lives in the chat header on
// the right; launching from the left meant crossing the whole window to get
// there, measured at 1035 px in 220 ms, whose peak frame moved the character
// 216 px — nearly three times its own length in one frame, with seven frames
// over a full body length. That is a teleport with an easing curve on it, and
// it is also two crossings of the text for one gesture. Launching near the
// right of the writing area makes the approach about 300 px and leaves exactly
// one crossing.
//
// It descends past the LAST line, or every line below where the stroke levels
// out is reached at the same moment and the stagger collapses.
const PASS = {                         // the stroke, in fractions of the area
  from: { x: .90, y: .10 }, ctrl: { x: .50, y: .30 }, to: { x: .10, y: .84 },
};
// Short. This plays on the way to an answer the student is waiting for, and
// the first line is readable a third of a second in.
const BEATS = { reach: 220, coil: 90, jet: 620, settle: 170 };
const PUFFS = 12;
// How far ahead on the stroke the character looks. A squid aims while it is
// still coasting and contracts once it is pointed; rotating and translating on
// the same clock means it turns hardest exactly when it is moving fastest,
// which is what a cursor does and not what an animal does.
const LOOK = .12;
// Nothing the tutor wrote waits longer than this to start being readable.
const LAY_LATEST = 620;
// the least a line waits behind the one above it, so a cramped board still
// reads as one thing being written after another
const LAY_STEP = 130;

/** A point on the stroke, and the direction it is heading there. */
function onPass(s, w, h) {
  const { from: a, ctrl: b, to: c } = PASS;
  const u = 1 - s;
  return {
    x: (u * u * a.x + 2 * u * s * b.x + s * s * c.x) * w,
    y: (u * u * a.y + 2 * u * s * b.y + s * s * c.y) * h,
    // the derivative of the same quadratic: the tangent, in pixels
    dx: (2 * u * (b.x - a.x) + 2 * s * (c.x - b.x)) * w,
    dy: (2 * u * (b.y - a.y) + 2 * s * (c.y - b.y)) * h,
  };
}

/** The rotation that points the drawn squid along a heading.
 *
 *  The art is upright — mantle at the top, arms hanging down — so it already
 *  "points" at -90°. Adding 90° to the heading turns that into mantle-first.
 */
const aim = (dx, dy) => Math.atan2(dy, dx) * 180 / Math.PI + 90;

/** The same angle, expressed nearest to where the character already is.
 *
 *  Without this a heading of 190° followed by one of -170° is a 360° spin
 *  rather than the 20° it really is, and coming home from a leftward pass
 *  turns the tutor round the long way. */
const near = (deg, to) => deg + 360 * Math.round((to - deg) / 360);

function clearInk() {
  inkTimers.forEach(clearTimeout);
  inkTimers = [];
  if (flight) { flight.cancel(); flight = null; }
  if (pulse) { pulse.cancel(); pulse = null; }
  tutor.classList.remove("flying");
  $("boardInk").classList.remove("wet");
  $("inkPuffs").textContent = "";
  // Whatever was mid-wipe is now simply shown. Dropping the timers above took
  // the backstop with them, and a step left under a half-finished mask is the
  // one outcome this whole mechanism is not allowed to have.
  for (const el of document.querySelectorAll(".laying:not(.dry)"))
    el.classList.add("dry");
}

/** When the ink passes a height in the writing area, in ms from the pass start.
 *
 *  The stroke descends monotonically, so the sample whose y first reaches this
 *  height is the moment — and because the samples ARE the reference's speed,
 *  the answer is in real time and not in path length.  */
function inkReaches(yFraction) {
  for (let i = 1; i < JET.length; i++) {
    if (onPass(JET[i], 1, 1).y >= yFraction) {
      return BEATS.reach + BEATS.coil + BEATS.jet * (i / (JET.length - 1));
    }
  }
  return BEATS.reach + BEATS.coil + BEATS.jet;
}

/** Go over to the writing area and jet across it once. */
function inkPass() {
  const area = document.querySelector(".writing");
  const r = area.getBoundingClientRect();
  if (!r.width) return;
  clearInk();
  // remembered so a later resize can tell a real one from ResizeObserver noise
  passRect = { left: r.left, top: r.top, width: r.width, height: r.height };

  if (STILL.matches) {                   // no flight, no ink: just be there
    perch = { anchor: $("squidBoard"), scale: 1.05, tilt: 0 };
    land(perch.anchor, { ...perch, ms: 0 });
    return;
  }

  const ink = $("boardInk");
  const trail = $("inkTrail");
  const strokes = [...ink.querySelectorAll(".ink")];
  // one unit, one pixel — see the note on #boardInk
  ink.setAttribute("viewBox", `0 0 ${r.width.toFixed(0)} ${r.height.toFixed(0)}`);

  const start = onPass(0, r.width, r.height);
  const end = onPass(1, r.width, r.height);
  const d = `M${start.x.toFixed(1)} ${start.y.toFixed(1)} ` +
            `Q${(PASS.ctrl.x * r.width).toFixed(1)} ${(PASS.ctrl.y * r.height).toFixed(1)} ` +
            `${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
  strokes.forEach((s) => s.setAttribute("d", d));
  // the gradient runs launch → head, so the oldest ink is the thinnest
  const fade = $("inkFade");
  fade.setAttribute("x1", start.x.toFixed(1)); fade.setAttribute("y1", start.y.toFixed(1));
  fade.setAttribute("x2", end.x.toFixed(1));   fade.setAttribute("y2", end.y.toFixed(1));

  // --- the character's own flight ------------------------------------------
  // One animation, four beats, driven by keyframes whose offsets carry the
  // measured speed. The transform is written whole each time because scale and
  // rotation change together with position and a transition on three separate
  // properties would let them arrive at different moments.
  const home = $("squidHome").getBoundingClientRect();
  const box = { w: tutor.offsetWidth, h: tutor.offsetHeight };
  // Position and heading only. The SHAPE lives on .float, on its own clock:
  // welding them together is what makes a character turn hardest exactly when
  // it is moving fastest, which is a cursor's behaviour and not an animal's.
  const put = (x, y, deg) =>
    `translate3d(${(x - box.w * SQ_CX).toFixed(1)}px, ` +
    `${(y - box.h * SQ_CY).toFixed(1)}px, 0) rotate(${deg.toFixed(1)}deg)`;
  const at = (s) => {
    const p = onPass(s, r.width, r.height);
    return { ...p, vx: r.left + p.x, vy: r.top + p.y };
  };

  const total = BEATS.reach + BEATS.coil + BEATS.jet + BEATS.settle;
  const f0 = at(0), f1 = at(1);
  const head0 = aim(f0.dx, f0.dy);
  // UNIT vectors. The curve's derivative is in pixels-per-unit-of-s and runs
  // to several hundred, so offsetting by a fraction of it made the recoil
  // scale with the width of the board: 11% of the tangent was a 75 px pull
  // back, which the first frame of the thrust then snapped across in one go.
  // The recoil belongs to the ANIMAL, so it is measured in its own body.
  const unit = (v) => { const m = Math.hypot(v.dx, v.dy) || 1;
                        return { x: v.dx / m, y: v.dy / m }; };
  const u0 = unit(f0), u1 = unit(f1);
  const BODY = box.h * .9;             // the character's own length, near enough
  let last = 0;                        // the previous heading, for unwrapping
  const heading = (s) => {
    // aimed where it is GOING, not where it is: LOOK ahead on the stroke
    const p = onPass(Math.min(1, s + LOOK), r.width, r.height);
    return (last = near(aim(p.dx, p.dy), last));
  };
  const frames = [];
  // where it is coming from, already turning to face the way it will go
  frames.push({ offset: 0, easing: "cubic-bezier(.32,.04,.28,1)",
                transform: put(home.left + home.width / 2,
                               home.top + home.height / 2, 0) });
  // arrives just short of the start, ALREADY aimed — the turn belongs to the
  // coast, so that the thrust itself is pure acceleration with no turn in it
  frames.push({ offset: BEATS.reach / total, easing: "cubic-bezier(.55,0,.85,.4)",
                transform: put(f0.vx - u0.x * BODY * .12, f0.vy - u0.y * BODY * .12,
                               (last = near(head0, 0))) });
  // the intake: it opens, takes water in, and the inflow pushes it BACKWARD
  // along its own heading. The one slow beat in the pass, and the reason the
  // next 620 ms reads as an impulse instead of a slide.
  frames.push({ offset: (BEATS.reach + BEATS.coil) / total, easing: "linear",
                transform: put(f0.vx - u0.x * BODY * .34, f0.vy - u0.y * BODY * .34,
                               last - 5) });
  // the jet: sampled along the stroke at the reference's own speed
  JET.forEach((s, i) => {
    const u = i / (JET.length - 1);
    const p = at(s);
    frames.push({
      offset: (BEATS.reach + BEATS.coil + BEATS.jet * u) / total,
      easing: "linear",
      transform: put(p.vx, p.vy, heading(s)),
    });
  });
  // follow-through: it drifts a little past the end and starts to right itself
  const settled = put(f1.vx + u1.x * BODY * .18, f1.vy + u1.y * BODY * .18,
                      near(0, last) * .4);
  frames.push({ offset: 1, easing: "cubic-bezier(.2,.6,.3,1)", transform: settled });

  // The PULSE, on its own clock. A squid does not change size, it changes
  // shape: full and short across the intake, thin and long down the thrust.
  // Because #tutor holds the rotation, y here is along travel — see .float.
  const T = (ms) => ms / total;
  const poseHome = "scale(1, 1)";
  const pose = [
    { offset: 0, transform: poseHome, easing: "cubic-bezier(.35,.05,.6,1)" },
    { offset: T(BEATS.reach), transform: "scale(1.02, 1.06)", easing: "cubic-bezier(.55,0,.85,.4)" },
    // squash peaks BEFORE the stroke starts: anticipation
    { offset: T(BEATS.reach + BEATS.coil * .9), transform: "scale(1.22, .80)",
      easing: "cubic-bezier(.1,.9,.25,1)" },
    // and the stretch peaks a beat AFTER it: follow-through
    { offset: T(BEATS.reach + BEATS.coil + 70), transform: "scale(.83, 1.32)",
      easing: "cubic-bezier(.2,.7,.35,1)" },
    { offset: T(BEATS.reach + BEATS.coil + BEATS.jet), transform: "scale(.97, 1.06)",
      easing: "ease-out" },
    { offset: 1, transform: poseHome },
  ];

  tutor.classList.add("flying");
  tutor.style.setProperty("--fly", "0ms");   // the flight owns the transform now
  flight = tutor.animate(frames, { duration: total, fill: "forwards" });
  pulse = float.animate(pose, { duration: total, fill: "forwards" });

  // --- the ink -------------------------------------------------------------
  ink.classList.add("wet");
  const puffs = $("inkPuffs");
  for (let i = 0; i < PUFFS; i++) {
    const s = (i + .5) / PUFFS;
    const p = onPass(s, r.width, r.height);
    const len = Math.hypot(p.dx, p.dy) || 1;
    // It leaves from UNDER THE ARMS, which trail behind the mantle: back along
    // the heading, and a little below. Measured off the box's LONG axis, since
    // that is the one the character's own length lies on — so it follows the
    // phone breakpoint down to --sq:62 without a second number.
    const back = box.h * .44;
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("class", "puff");
    c.setAttribute("r", (7 + (i % 3) * 2.5).toFixed(1));
    c.setAttribute("cx", (p.x - p.dx / len * back).toFixed(1));
    c.setAttribute("cy", (p.y - p.dy / len * back + 3).toFixed(1));
    puffs.appendChild(c);
    // born as the arms pass, then it blooms, drifts back and thins away
    c.animate([
      { offset: 0, opacity: 0, transform: "scale(.35)" },
      { offset: .18, opacity: .85, transform: "scale(1)" },
      // it drifts back against the direction of travel and SINKS, which is
      // both what ink does and what puts it over the line about to be written
      { offset: 1, opacity: 0,
        transform: `translate(${(-p.dx / len * 9).toFixed(1)}px, ` +
                   `${(-p.dy / len * 9 + 17).toFixed(1)}px) scale(2.6)` },
    ], {
      duration: 950,
      delay: BEATS.reach + BEATS.coil + BEATS.jet * jetTimeFor(s),
      easing: "cubic-bezier(.15,.7,.4,1)", fill: "both",
    });
  }

  // The trail, drawn exactly as fast as the squid moves. Each layer's head
  // lags a little further behind the one above it, so the wide diffuse edge
  // trails the sharp one instead of arriving with it — which is what makes
  // four hard strokes read as one soft plume.
  const len = trail.getTotalLength();
  strokes.forEach((path, i) => {
    const lag = [74, 58, 46, 0][i];
    path.style.transition = "none";
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.animate(
      JET.map((s, k) => ({
        offset: k / (JET.length - 1),
        strokeDashoffset: Math.min(len, Math.max(0, len * (1 - s) + lag)).toFixed(1),
        easing: "linear",
      })),
      { duration: BEATS.jet, delay: BEATS.reach + BEATS.coil, fill: "forwards" });
  });

  // and back to the conversation, which is where it is about to start talking
  inkTimers.push(setTimeout(() => {
    ink.classList.remove("wet");
    // The transform has to be HANDED OVER before the animation is dropped. A
    // filled animation is not the element's style, it is layered on top of it,
    // so cancelling one reverts to whatever the inline style still says — the
    // chat header, from before the pass — and the tutor teleports home instead
    // of swimming back.
    tutor.style.transform = settled;
    float.style.transform = poseHome;
    if (flight) { flight.cancel(); flight = null; }
    if (pulse) { pulse.cancel(); pulse = null; }
    tutor.classList.remove("flying");
    goHome(620);
  }, total + 180));
}

/** The fraction of the jet's DURATION at which the stroke reaches s. */
function jetTimeFor(s) {
  for (let i = 1; i < JET.length; i++) {
    if (JET[i] >= s) {
      const span = JET[i] - JET[i - 1] || 1;
      return (i - 1 + (s - JET[i - 1]) / span) / (JET.length - 1);
    }
  }
  return 1;
}

// --- the problem card and the board ----------------------------------------
function showProblem(d) {
  const text = (d.text || "").trim();
  const eqs = d.equations || [];
  if (!text && !eqs.length) return;
  problemTitle = text;
  currentDialogue = [];                // a new problem starts a fresh transcript
  const pt = $("problemText");
  pt.textContent = "";
  pt.append(mathify(text).frag);
  const box = $("problemEqs");
  box.textContent = "";
  // the server sends only equations the statement does NOT already spell out
  for (const eq of eqs) {
    const line = document.createElement("div");
    line.append(mathify(eq).frag);
    box.appendChild(line);
  }
  $("problemCard").hidden = false;
  boardClear();                          // a new problem starts a clean board
}

// --- the solved-problems archive -------------------------------------------
// The PANEL is on hold, so nothing is drawn. What is kept is the transcript it
// will be built from: the conversation since the last problem event, cleared
// when the server says that problem is DONE (a `solved` event from the finish
// path, not from a mere "맞아요"). Two lines, and the archive can come back
// without the lesson having lost anything in the meantime.
let currentDialogue = [];              // {kind, text} since the last problem event
let problemTitle = "";

function addSolved(title) {
  console.info("solved: %s (%d turns)", title || problemTitle, currentDialogue.length);
  currentDialogue = [];
}

let boardSeen = new Set();             // one problem's writing, no duplicates

function boardClear() {
  boardSeen = new Set();
  const lines = $("boardLines");
  lines.textContent = "";
  const empty = document.createElement("div");
  empty.id = "boardEmpty";
  const invite = document.createElement("b");
  invite.textContent = "같이 풀어 볼까요?";
  empty.append(invite, "문제를 보여 주면 여기에 하나씩 짚어 가며 적을게요.");
  lines.appendChild(empty);
}

/** A function sketched on the board. The markup is built by the server (sympy
    samples the curve there), so this only has to place it — and the same leak
    guard that screens the spoken hint has already seen it. */
/** ONE grid per problem, replaced in place. The server re-declares the whole
    scene each turn — a curve that has served its purpose is simply absent
    from the next one — so the picture must CHANGE rather than a second
    picture appearing beneath it. */
function boardDraw(d) {
  const svg = d && d.svg;
  if (!svg) return;
  const id = `fig:${d.id || d.of || "scene"}`;
  // The view revision is part of the key. Keying on the zoom VALUE dropped
  // every revisited window — widen then narrow back, and the render at the
  // old zoom collided with the first time it was seen and was thrown away,
  // which is why the buttons felt like they sometimes did not work.
  const key = `${id}|${d.of}|${d.note || ""}|${d.v || 0}`;
  if (boardSeen.has(key)) return;      // the same scene twice is not a change
  boardSeen.add(key);
  // a view adjustment is the student's act, not the tutor writing: the
  // character stays where it is
  if (!d.user) goWrite();

  let box = document.querySelector(`[data-figure="${CSS.escape(id)}"]`);
  const fresh = !box;
  if (fresh) {
    const empty = document.getElementById("boardEmpty");
    if (empty) empty.remove();
    box = document.createElement("div");
    box.className = "boardfigure";
    box.dataset.figure = id;
    // The window controls, OUTSIDE the part a redraw repaints — the same
    // buttons keep keyboard focus across every redraw they cause. The server
    // owns the window (it has the samples); these only ask.
    const zoom = document.createElement("div");
    zoom.className = "figzoom";
    for (const [glyph, act, label] of [
      ["−", () => sendEvent("figure_zoom", { dir: +1 }), "그래프 범위 넓히기"],
      ["+", () => sendEvent("figure_zoom", { dir: -1 }), "그래프 범위 좁히기"],
      ["⟳", () => sendEvent("figure_reset"), "그래프 창 되돌리기"],
    ]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = glyph;
      b.setAttribute("aria-label", label);
      b.title = label;
      b.addEventListener("click", act);
      zoom.appendChild(b);
    }
    const body = document.createElement("div");
    body.className = "figbody";
    box.append(zoom, body);
    figureControls(box, body);
    $("boardLines").appendChild(box);
  }
  const body = box.querySelector(".figbody");
  const paint = () => {
    body.innerHTML = svg;
    if (d.note) {
      // what to look at, in the same margin voice the written lines use
      const label = document.createElement("div");
      label.className = "note";
      label.textContent = d.note;
      body.appendChild(label);
    }
    box.classList.remove("fading");
    // Show the picture from ITS top, not the board's bottom. The sketch now
    // fills the board, so scrolling to the foot as a written line does would
    // put the legend (which says which curve is l) above the visible edge.
    const lines = $("boardLines");
    lines.scrollTop +=
      box.getBoundingClientRect().top - lines.getBoundingClientRect().top - 6;
    // a sketch is something the tutor drew too, so the ink lays it down as
    // well — otherwise a figure appears with no relation to the pass at all
    if (fresh) lay(box);
  };
  if (fresh) return paint();
  // redrawing an existing grid: fade out the old scene so a curve leaving is
  // seen as leaving rather than as a flicker
  box.classList.add("fading");
  setTimeout(paint, 180);
}

/** The figure's own hands: drag to pan, keys to steer.
 *
 *  The buttons cover a mouse at rest; these cover everyone else — a finger,
 *  a trackpad drag, and the keyboard, which is also what makes the sketch
 *  reachable at all without a pointer. The page never does the arithmetic:
 *  it reports the gesture as fractions of the picture and the server, which
 *  owns the samples, moves the window and sends the true render back. The
 *  drag previews locally so the hand feels the picture move at once.
 */
function figureControls(box, body) {
  box.tabIndex = 0;
  box.setAttribute("role", "group");
  box.setAttribute("aria-label",
    "함수 그래프. 화살표 키로 이동, +와 -로 범위, 0으로 되돌리기. 마우스로 끌 수 있어요.");

  box.addEventListener("keydown", (e) => {
    const pan = { ArrowLeft: [-.2, 0], ArrowRight: [.2, 0],
                  ArrowUp: [0, -.2], ArrowDown: [0, .2] }[e.key];
    if (pan) { sendEvent("figure_pan", { dx: pan[0], dy: pan[1] }); }
    else if (e.key === "-" || e.key === "_") sendEvent("figure_zoom", { dir: +1 });
    else if (e.key === "+" || e.key === "=") sendEvent("figure_zoom", { dir: -1 });
    else if (e.key === "0" || e.key === "Home") sendEvent("figure_reset");
    else return;
    e.preventDefault();
  });

  let drag = null;
  box.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest(".figzoom")) return;
    const svg = body.querySelector("svg");
    if (!svg) return;
    drag = { x: e.clientX, y: e.clientY, box: svg.getBoundingClientRect() };
    // a pen lifted in the same instant has no pointer left to capture, and
    // losing the capture only means the drag ends at the figure's edge
    try { box.setPointerCapture(e.pointerId); } catch (err) {}
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return;
    // the preview: the picture follows the hand until the real render lands
    body.style.transform =
      `translate(${e.clientX - drag.x}px, ${e.clientY - drag.y}px)`;
  });
  const drop = (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    const r = drag.box;
    drag = null;
    body.style.transform = "";
    // dragging the picture right means asking for the plane to its LEFT
    if (Math.hypot(dx, dy) >= 4 && r.width && r.height) {
      sendEvent("figure_pan", {
        dx: +(-dx / r.width).toFixed(3),
        dy: +(-dy / r.height).toFixed(3),
      });
    }
  };
  box.addEventListener("pointerup", drop);
  box.addEventListener("pointercancel", () => { drag = null; body.style.transform = ""; });
}

/** The tutor has something for the board: send it over, once per turn. */
function goWrite() {
  if (wroteThisTurn) return;
  wroteThisTurn = true;
  passStartedAt = performance.now();
  layFloor = 0;                        // a new pass starts the cascade again
  inkPass();
}
let passStartedAt = 0;
let layFloor = 0;                      // the last line's moment, for the floor

/** Uncover a line in the ink's wake, at the moment the ink actually gets there.
 *
 *  Not a fixed stagger. The stroke crosses the writing area diagonally, so it
 *  arrives at the top line before the bottom one by an amount that depends on
 *  where the lines happen to sit — which is what "먹물이 지나간 자리에" means. The
 *  geometry is read once, here, off the element that was just laid out.
 *
 *  Nothing about the TEXT waits on this: it is already in the document, and a
 *  line whose moment has passed is simply shown. */
function lay(line) {
  if (STILL.matches) return;             // no wipe: .boardline is plain and visible
  const area = document.querySelector(".writing");
  if (!area) return;
  const box = area.getBoundingClientRect();
  const here = line.getBoundingClientRect();
  if (!box.height || !here.height) return;
  // the middle of the line, as a fraction of the area the stroke crosses
  const mid = (here.top + here.height / 2 - box.top) / box.height;
  // LEAD it. The ink is underneath now, so the writing can start coming
  // through as the cloud arrives rather than after it has gone by, and being
  // early is the right way to be wrong when a student is waiting to read.
  // Where the ink gets to this line — and never sooner than a beat after the
  // line above it. On a tall board the geometry does all the work; on a short
  // one every line sits within a few percent of the same height, the geometry
  // returns nearly the same moment for all of them, and the cascade collapses
  // into everything appearing at once. The floor keeps it a sequence exactly
  // where there is no room for one.
  const geometric = inkReaches(Math.max(0, Math.min(1, mid))) - 150;
  const elapsed = performance.now() - passStartedAt;
  layFloor = Math.max(layFloor + LAY_STEP, elapsed);
  const when = Math.max(geometric, layFloor);
  layFloor = when;
  // Bounded at both ends. Zero below, because a line whose moment has already
  // passed is simply shown; and a ceiling above, because the delay is derived
  // from geometry and geometry can put a line anywhere — nothing the tutor has
  // written may sit invisible for most of a second waiting for a squid.
  const wait = Math.min(LAY_LATEST, Math.max(0,
    when - (performance.now() - passStartedAt)));
  line.classList.add("laying");
  // Quicker than the stroke that is uncovering it, so the writing never lags
  // visibly behind the thing supposedly making it. Restarted in place first:
  // an animation declared by a class that was added during a forced layout has
  // been seen adopting the document's start time rather than its own, which
  // finishes the wipe before the line is ever painted.
  line.style.animation = "none";
  void line.getBoundingClientRect();
  line.style.animation = "";
  line.style.setProperty("--lay", ".46s");
  line.style.animationDelay = `0s, ${wait.toFixed(0)}ms`;
  // And the mask comes off when it has done its work, so a lesson's worth of
  // steps is not left on a lesson's worth of composited layers. The timer is
  // the backstop, because a backgrounded tab pauses the animation and onfinish
  // would then never come at all.
  // By NAME: `.laying` declares two animations and the other, `inked 0s`,
  // finishes inside the frame it starts in — a bare animationend listener took
  // the mask off before the wipe had begun and every line simply appeared.
  const done = () => line.classList.add("dry");
  line.addEventListener("animationend", (e) => {
    if (e.animationName === "laydown") done();
  });
  inkTimers.push(setTimeout(done, wait + 1200));
}

/** The board shows ONLY what the tutor deliberately wrote (the `board`
    event) — the whiteboard move behind the spoken hint, typeset. Sentence
    transcription used to land here too and read as a strange half-solution;
    sentences live in the chat now, full stop. */
function boardWrite(item) {
  // {expr, note} from the server; a bare string still works
  const expr = ((typeof item === "string" ? item : item && item.expr) || "").trim();
  const note = ((typeof item === "string" ? "" : item && item.note) || "").trim();
  if (!expr || boardSeen.has(expr)) return;
  boardSeen.add(expr);
  goWrite();                             // the tutor goes and writes it
  const lines = $("boardLines");
  const empty = document.getElementById("boardEmpty");
  if (empty) empty.remove();
  const line = document.createElement("div");
  line.className = "boardline key";
  const math = document.createElement("div");
  math.append(mathify(expr).frag);
  line.appendChild(math);
  if (note) {
    // the margin scribble: why this line is here, in the tutor's shorthand
    const label = document.createElement("div");
    label.className = "note";
    label.textContent = note;
    line.appendChild(label);
  }
  lines.appendChild(line);
  // scroll FIRST. lay() keys the reveal to where the line is on screen, and
  // scrolling to the foot of the board moves it — measuring before the scroll
  // keyed every reveal to a position the next statement invalidated.
  lines.scrollTop = lines.scrollHeight;
  lay(line);
}

// --- 3. playback: the tutor's audio, then tell the server we are done ------

// 50 ms of silence. Browsers only grant an <audio> element permission to play
// programmatically once it has played inside a user gesture — and play() on a
// SOURCELESS element rejects, which grants nothing. So play real (silent)
// audio during the 시작 click; every later hint then plays on its own.
const SILENCE =
  "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZ" +
  "ABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI" +
  "CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC" +
  "AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA" +
  "gICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg" +
  "ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA=";

async function unlockAudio() {
  const player = $("player");
  try {
    player.src = SILENCE;
    await player.play();
    return true;
  } catch (e) {
    return false;
  }
}

// The tutor's audio is a queue, not a single clip: a turn can be a filler
// followed by the hint, and a barge-in has to be able to throw away the part
// that has not started playing as well as the part that has.
//
// STREAMED SPEECH: one utterance now arrives as MANY small TTS frames (the
// server ships MP3 chunks while xAI is still rendering the tail), grouped by
// utterance_id and ordered by seq, the final one flagged last. Playback
// starts on the FIRST chunk via MediaSource — that is the whole point: the
// voice begins ~1.3s after synthesis starts instead of after the ~2.5s file.
// Where MediaSource cannot take mp3, chunks are collected and played whole,
// which is exactly the old behaviour.
let audioQueue = [];                     // Blobs (fallback) and stream objects
let playingUrl = null;
const ttsStreams = new Map();            // utterance_id → in-flight stream
const MSE_OK = window.MediaSource && MediaSource.isTypeSupported("audio/mpeg");

function onTts(header, bytes) {
  const id = header.utterance_id || "solo";
  // A stream begins at seq 0. A mid-stream chunk with no stream behind it is
  // the tail of an utterance a barge-in already threw away — starting playback
  // from the middle of an MP3 would be noise followed by a stall.
  if (header.seq > 0 && !ttsStreams.has(id)) return;
  if (!MSE_OK) {                         // fallback: whole-file, old behaviour
    let held = ttsStreams.get(id);
    if (!held) { held = []; ttsStreams.set(id, held); }
    held.push(bytes);
    if (header.last) {
      ttsStreams.delete(id);
      audioQueue.push(new Blob(held, { type: "audio/mpeg" }));
      if (!playingUrl) playNext();
    }
    return;
  }
  let st = ttsStreams.get(id);
  if (!st) {
    st = { id, url: null, ms: null, sb: null, chunks: [], ended: false };
    ttsStreams.set(id, st);
    audioQueue.push(st);
    if (!playingUrl) playNext();
  }
  st.chunks.push(bytes);
  if (header.last) { st.ended = true; ttsStreams.delete(id); }
  feedStream(st);
}

function feedStream(st) {
  // append exactly one pending chunk per updateend; close when drained
  if (!st.sb || st.url !== playingUrl || st.sb.updating) return;
  if (st.chunks.length) {
    st.sb.appendBuffer(st.chunks.shift());
  } else if (st.ended && st.ms.readyState === "open") {
    st.ms.endOfStream();
  }
}

function playNext() {
  const item = audioQueue.shift();
  if (!item) { playingUrl = null; return; }

  const player = $("player");
  let url;
  if (item instanceof Blob) {
    url = URL.createObjectURL(item);
  } else {                               // an in-flight stream: play as it arrives
    item.ms = new MediaSource();
    url = URL.createObjectURL(item.ms);
    item.url = url;
    item.ms.addEventListener("sourceopen", () => {
      if (playingUrl !== url) return;    // dropped before it even opened
      item.sb = item.ms.addSourceBuffer("audio/mpeg");
      item.sb.addEventListener("updateend", () => feedStream(item));
      feedStream(item);
    });
  }
  playingUrl = url;
  const done = () => {
    if (playingUrl !== url) return;      // already dropped by a barge-in
    URL.revokeObjectURL(url);
    playingUrl = null;
    if (audioQueue.length) { playNext(); return; }
    sendEvent("playback_done");          // the server reopens the mic after its tail guard
  };
  player.onended = done;
  player.onerror = done;                 // never leave the server waiting
  player.src = url;
  player.play().catch(() => {
    setStatus("자동 재생이 차단되었습니다. 페이지를 한 번 클릭한 뒤 다시 말해주세요.");
    done();
  });
}

/** The student cut in. Stop mid-word and drop everything not yet played.
    `announce` is false when the page itself is stopping (연결 종료), because
    "끼어들기" is a report about the student and they did not do it. */
function stopSpeaking(announce = true) {
  const player = $("player");
  const dropped = audioQueue.length + ttsStreams.size;
  audioQueue = [];
  ttsStreams.clear();                    // late chunks of dropped streams are ignored
  if (playingUrl) {
    URL.revokeObjectURL(playingUrl);
    playingUrl = null;
  }
  player.pause();
  // Detach the source, or the element keeps buffering what we just cancelled.
  player.removeAttribute("src");
  player.load();
  reveal.finish();                       // a line nobody is hearing is not still arriving
  clearInk();
  // Deliberately no playback_done: the server already knows, it told us to stop.
  if (announce)
    addTurn("err", dropped ? `끼어들기: 재생을 멈추고 대기 중이던 ${dropped}개를 지웠어요` : "끼어들기: 재생을 멈췄어요");
}

// --- 4. the worksheet photo ------------------------------------------------
// Three ways in, because the one that fits the moment is the one that gets
// used: choosing a file, dragging it, or pasting a screenshot straight from
// the clipboard — which is how most photos actually arrive on a laptop.
async function useWorksheet(file) {
  // In camera mode the box is hidden, but Ctrl+V still reaches the document:
  // accepting a paste there would stash a photo nobody can see and nothing
  // will use (the phone answers first), which is worse than ignoring it.
  if (!uploadMode || !file || !file.type.startsWith("image/")) return;
  worksheet = new Uint8Array(await file.arrayBuffer());
  $("sheetname").textContent =
    `${file.name || "붙여넣은 이미지"} · ${Math.round(worksheet.length / 1024)} KB`;
  // Show it back: the commonest failure is not a bad model but a photo that
  // turns out to be blurred, cropped short, or of the wrong page.
  const thumb = $("thumb");
  thumb.src = URL.createObjectURL(file);
  thumb.classList.add("has");
  $("drop").classList.add("has");
  setStatus("사진을 받았습니다. 이제 힌트를 물어보세요.");
}

$("sheet").addEventListener("change", (e) => useWorksheet(e.target.files[0]));
$("drop").addEventListener("click", () => $("sheet").click());
// It advertises itself as a button and takes tab focus, so Enter and Space
// have to work: a div with role="button" gets no synthesised click.
$("drop").addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("sheet").click(); }
});

for (const type of ["dragenter", "dragover"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.add("over");
  });
}
for (const type of ["dragleave", "drop"]) {
  $("drop").addEventListener(type, (e) => {
    e.preventDefault();
    $("drop").classList.remove("over");
  });
}
$("drop").addEventListener("drop", (e) => useWorksheet(e.dataTransfer.files[0]));

document.addEventListener("paste", (e) => {
  for (const item of e.clipboardData.files) {
    if (item.type.startsWith("image/")) { useWorksheet(item); return; }
  }
});

function sendWorksheet(captureId) {
  if (!worksheet) {
    // Nothing to read HERE. In camera mode that is the normal answer, not a
    // problem: the phone is the eye and was already asked first, so say
    // nothing. In upload mode the student really does need to pick a photo.
    sendEvent("capture_failed", { capture_id: captureId });
    if (uploadMode) setStatus("문제 사진이 아직 없어요. 위에 사진을 올려 주세요.");
    return;
  }
  ws.send(encodeFrame(IMAGE_FRAME, { capture_id: captureId, format: "jpeg" }, worksheet));
}

// --- 5. the conversation ---------------------------------------------------
function scrollChat() {
  const chat = $("chat");
  chat.scrollTop = chat.scrollHeight;
}

// The tutor's line is REVEALED, not posted. The server sends the whole
// sentence in one tutor_says (it has to: the same text is being spoken, and
// the TTS wants it whole), so this is the page's own doing — reading speed
// out of a string that is already here. It is worth it because the
// alternative is a bubble that appears fully formed after a silence, which
// reads as a stall even when the audio started at the same instant.
//
// Prose is typed; a formula appears whole, because half a typeset equation is
// worse than no equation. Nothing here can lose a message: the text is in the
// DOM within one tick either way, and finish() puts the rest in at once.
const reveal = {
  timer: null, parts: null, node: null, msg: null, i: 0, at: 0,

  start(msg, bubble, frag) {
    this.finish();
    const parts = [...frag.childNodes];
    if (STILL.matches || !parts.length) { bubble.append(...parts); return; }
    Object.assign(this, { parts, node: bubble, msg, i: 0, at: 0 });
    msg.classList.add("typing");
    // Fast enough never to be the thing anyone is waiting for: this is a
    // reading cue, not a typewriter impression. A ninety-character hint lands
    // in about a second, and nothing takes longer than 1.1 s however long it
    // is — the voice is saying the same words at the same time, and the eye
    // must not fall behind the ear.
    const chars = parts.reduce((n, p) => n + (p.nodeType === 3 ? p.length : 8), 0);
    const ms = Math.min(1100, Math.max(260, chars * 13));
    const step = Math.max(1, Math.ceil(chars / (ms / 24)));
    this.timer = setInterval(() => this.tick(step), 24);
  },

  tick(step) {
    let budget = step;
    while (budget > 0 && this.i < this.parts.length) {
      const part = this.parts[this.i];
      if (part.nodeType !== 3) {         // a typeset formula: whole, or not at all
        this.node.appendChild(part);
        this.i++; this.at = 0; budget -= 8;
        continue;
      }
      const text = part.textContent;
      const take = Math.min(budget, text.length - this.at);
      const end = this.at + take;
      if (!this.at) this.node.appendChild(document.createTextNode(""));
      this.node.lastChild.textContent = text.slice(0, end);
      budget -= take;
      this.at = end;
      if (end >= text.length) { this.i++; this.at = 0; }
    }
    scrollChat();
    if (this.i >= this.parts.length) this.finish();
  },

  finish() {
    if (!this.timer) return;
    clearInterval(this.timer);
    this.timer = null;
    // whatever is left goes in at once, in order
    for (let k = this.i; k < this.parts.length; k++) {
      const part = this.parts[k];
      if (k === this.i && part.nodeType === 3 && this.at) {
        this.node.lastChild.textContent = part.textContent;
      } else {
        this.node.appendChild(part);
      }
    }
    this.msg.classList.remove("typing");
    this.parts = null; this.node = null; this.msg = null;
    scrollChat();
  },
};

function addTurn(kind, text) {
  const chat = $("chat");
  const div = document.createElement("div");
  if (kind === "err") {
    div.className = "sys";
    div.textContent = text;
  } else {
    div.className = `msg ${kind}`;
    div.innerHTML = `<div class="who"></div><div class="bubble"></div>`;
    div.querySelector(".who").textContent = kind === "you" ? "나" : "튜터";
    currentDialogue.push({ kind, text });  // this problem's transcript-so-far
  }
  // the thinking bubble stays glued to the end while it is visible
  const thinking = $("thinking");
  chat.insertBefore(div, thinking.hidden ? null : thinking);
  if (kind === "tutor") {
    // the answer has begun: the "…" has done its job
    thinking.hidden = true;
    reveal.start(div, div.querySelector(".bubble"), mathify(text).frag);
  } else if (kind === "you") {
    div.querySelector(".bubble").append(mathify(text).frag);
  }
  scrollChat();
}

function note(text) {
  const turns = $("chat").querySelectorAll(".msg:not(#thinking)");
  const last = turns[turns.length - 1];
  if (!last) return;
  const meta = document.createElement("div");
  meta.className = "note";
  meta.textContent = text;
  last.appendChild(meta);
  scrollChat();
}

// NOT {once:true}: a denied microphone prompt would consume the listener and
// leave an enabled button wired to nothing. start() guards itself instead, and
// the button is disabled for the whole time a session is actually running.
$("orb").addEventListener("click", start);
$("hangup").addEventListener("click", hangUp);

// --- 6. the water ----------------------------------------------------------
// Eight bubbles, sized and paced apart so they never read as a row, and kept
// away from the middle where the board sits. Built here rather than in markup
// because the only thing that varies is numbers, and the CSS keyframe is
// already gated on prefers-reduced-motion.
for (const [size, left, seconds, delay] of
     [[13, 5, 24, 0], [7, 12, 30, 7], [18, 21, 26, 13], [9, 30, 33, 4],
      [11, 70, 28, 18], [16, 81, 23, 9], [7, 88, 31, 2], [12, 95, 27, 15]]) {
  const bubble = document.createElement("i");
  bubble.style.cssText =
    `width:${size}px;height:${size}px;left:${left}%;` +
    `animation-duration:${seconds}s;animation-delay:-${delay}s`;
  document.querySelector(".bubbles").appendChild(bubble);
}

// --- 7. keeping the tutor where it belongs ---------------------------------
// It is placed against live geometry, so anything that moves the geometry has
// to place it again — without a transition, or the character would swim to
// catch up with a window that has already stopped moving.
goHome(0);
// Two ways the pass can be left half-finished, and both end with something
// unreadable if nothing catches them: a backgrounded tab pauses CSS
// animations while the mask that is hiding a line stays exactly where it is,
// and toggling the OS motion preference mid-flight leaves the character
// somewhere no rule owns. Both land the same way — stop, show everything, go
// home.
addEventListener("visibilitychange", () => { if (document.hidden) clearInk(); });
STILL.addEventListener("change", () => { clearInk(); goHome(0); });
addEventListener("resize", reperch);
new ResizeObserver(reperch).observe($("chatPanel"));
// the panels are inside a scrolling page under 1000px
addEventListener("scroll", reperch, { passive: true });
</script>
</body>
</html>
